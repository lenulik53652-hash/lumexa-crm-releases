<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lumexa CRM · Account</title>
<meta name="robots" content="noindex"/>
<style>
  :root { --ink:#1c1c1c; --ash:#6f6f6f; --line:#e7e5df; --paper:#f4f3ef; --accent:#e3a63b; --soft:#fbefd6; }
  html, body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 -apple-system, "Segoe UI", "DM Sans", sans-serif; }
  main { min-height:100vh; display:grid; place-items:center; padding:24px 16px; box-sizing:border-box; }
  .card { width:100%; max-width:440px; background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.06); }
  .head { background:#1f1f1f; color:#fff; padding:20px 24px; display:flex; align-items:center; gap:10px; }
  .mark { width:30px; height:30px; border-radius:9px; background:var(--accent); color:#1c1c1c; display:grid; place-items:center; font-weight:700; }
  .body { padding:24px; }
  h1 { font-size:22px; margin:0 0 6px; letter-spacing:-.02em; }
  p { margin:0 0 14px; color:var(--ash); }
  label { display:block; font-size:12px; color:var(--ash); margin:12px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:10px; background:#1c1c1c; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  .ok { color:#2a6b3a; font-weight:600; } .bad { color:#b4451c; }
  .hint { font-size:13px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="head"><span class="mark">✳</span><strong>Lumexa CRM</strong></div>
    <div class="body" id="body"><h1>One moment…</h1><p>Checking the link.</p></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script>
(async () => {
  const CONFIG = { url: 'https://gtmnraiidsfzljtnadrf.supabase.co', key: 'sb_publishable_HqA3tVwOeeQhH2fXc9xRLw_BWv4eXhd' };
  const body = document.getElementById('body');
  const show = (title, text, extra = '') => { body.innerHTML = `<h1>${title}</h1><p>${text}</p>${extra}`; };
  const params = new URLSearchParams(location.hash.replace(/^#/, '') + '&' + location.search.replace(/^\?/, ''));
  const type = params.get('type') || '';
  const error = params.get('error_description') || params.get('error') || '';
  if (error) {
    show('This link no longer works', error.replace(/\+/g, ' ') + '.', '<p class="hint">Links are single-use and expire after a while. Go back to the app and request a new one.</p>');
    return;
  }
  const client = supabase.createClient(CONFIG.url, CONFIG.key, { auth: { persistSession: false, detectSessionInUrl: true, flowType: 'implicit' } });
  const session = (await client.auth.getSession()).data.session;
  if (type === 'recovery') {
    if (!session) { show('This link no longer works', 'The reset link could not be used.', '<p class="hint">Go back to the app, choose "Forgot password" again, and open the newest email.</p>'); return; }
    show('Choose a new password', 'For ' + (session.user.email || 'your account') + '.', `
      <label>New password (at least 8 characters)</label><input id="p1" type="password" autocomplete="new-password"/>
      <label>Repeat it</label><input id="p2" type="password" autocomplete="new-password"/>
      <div id="msg" class="hint"></div><button id="save">Save password</button>`);
    document.getElementById('save').onclick = async () => {
      const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value, msg = document.getElementById('msg');
      if (p1.length < 8) { msg.className = 'hint bad'; msg.textContent = 'Use at least 8 characters.'; return; }
      if (p1 !== p2) { msg.className = 'hint bad'; msg.textContent = 'The two passwords differ.'; return; }
      document.getElementById('save').disabled = true;
      const { error } = await client.auth.updateUser({ password: p1 });
      if (error) { msg.className = 'hint bad'; msg.textContent = error.message; document.getElementById('save').disabled = false; return; }
      await client.auth.signOut();
      show('Password saved', 'Open Lumexa CRM and sign in with the new password.', '<p class="hint ok">You can close this page.</p>');
    };
    return;
  }
  if (type === 'signup' || type === 'email_change' || type === 'magiclink' || session) {
    await client.auth.signOut();
    show(type === 'email_change' ? 'Email changed' : 'Email confirmed', 'Your account is ready. Open Lumexa CRM and sign in.', '<p class="hint ok">You can close this page.</p>');
    return;
  }
  show('Lumexa CRM', 'This page handles email confirmations and password resets for the Lumexa CRM app.', '<p class="hint">Nothing to do here right now. Open the app to sign in.</p>');
})();
</script>
</body>
</html>
