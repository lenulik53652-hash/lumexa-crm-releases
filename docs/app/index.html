<script>
/* Lumexa CRM record sync engine.
 *
 * The CRM renders from one in-memory `state` object (contacts with their calls, meetings,
 * sales…, plus settings, tasks, templates, reports). This module turns that object into
 * individual records for the database and back, so that:
 *   - a save sends only the records that changed since the last sync (with the revision each
 *     one had, so a teammate's concurrent save is detected and merged, never overwritten);
 *   - a load pulls only the records changed after the last sequence number this device saw;
 *   - every device keeps a local mirror of the records (revision, seq, data) in a store.
 *
 * It is plain JavaScript with no dependencies so it runs in the browser, in Electron and in
 * Node tests. Two things are injected: a `transport` (fetchSince / upsert against Supabase or a
 * fake) and a `store` (IndexedDB or memory).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const SINGLETON_KINDS = ['settings', 'workspaceSettings'];
  const LIST_KINDS = {
    leadCategory: 'leadCategories',
    task: 'tasks',
    calendarEvent: 'calendarEvents',
    salesActivity: 'salesActivities',
    activity: 'activity',
  };
  const REPORT_KINDS = { dailyReport: 'dailyReports', weeklyReport: 'weeklyReports', monthlyReport: 'monthlyReports' };
  const PER_USER_KINDS = { payRate: 'payRates', payPlan: 'payPlans', userPref: 'userPrefs' };
  // Written by integrations on the server side; never round-tripped from a device.
  const SERVER_OWNED_WORKSPACE_KEYS = ['_googleSheetsImportEvents', '_metaLeadAdsImportEvents', '_metaLeadAdsPages'];
  const CONTACT_LIST_FIELDS = ['calls', 'meetings', 'renders', 'renderRequests', 'orders', 'subcontacts', 'files', 'projects', 'ownershipHistory', 'statusHistory'];
  const DELETABLE_KINDS = new Set(['contact', 'sale', ...Object.keys(LIST_KINDS)]);

  const key = (kind, id) => `${kind}\u0000${id}`;
  const splitKey = (k) => { const i = k.indexOf('\u0000'); return [k.slice(0, i), k.slice(i + 1)]; };

  function stableStringify(value) {
    if (value === null || typeof value !== 'object') return JSON.stringify(value === undefined ? null : value);
    if (Array.isArray(value)) return `[${value.map(stableStringify).join(',')}]`;
    const keys = Object.keys(value).filter(k => value[k] !== undefined).sort();
    return `{${keys.map(k => `${JSON.stringify(k)}:${stableStringify(value[k])}`).join(',')}}`;
  }
  const deepEqual = (a, b) => stableStringify(a) === stableStringify(b);
  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const isObject = (v) => v && typeof v === 'object' && !Array.isArray(v);

  function defaultCurrentOwnerId(c) {
    const history = Array.isArray(c && c.ownershipHistory) ? c.ownershipHistory : [];
    const open = history.find(p => p && !p.to);
    return open ? String(open.userId || '') : String((c && c.ownerId) || '');
  }

  /* ------------------------------------------------------------------ decompose / compose */

  function decompose(state, opts = {}) {
    const currentOwnerId = opts.currentOwnerId || defaultCurrentOwnerId;
    const existingOwner = typeof opts.existingOwner === 'function' ? opts.existingOwner : () => null;
    const out = new Map();
    const put = (kind, id, rec) => out.set(key(kind, id), { kind, id, brand: null, owner_id: null, ...rec });
    for (const c of (state.contacts || [])) {
      if (!c || !c.id) continue;
      const { sales, ...rest } = c;
      const owner = currentOwnerId(c) || null;
      put('contact', String(c.id), { brand: c.brand === 'velum' ? 'velum' : 'lumexa', owner_id: owner, data: rest });

        if (!s || !s.id) continue;

        // whoever the database already credits, and only a brand-new sale falls back to the lead's owner.
        put('sale', String(s.id), { brand: c.brand === 'velum' ? 'velum' : 'lumexa', owner_id: String(s.createdByUserId || s.ownerId || existingOwner('sale', String(s.id)) || owner || ''), data: { ...s, contactId: String(c.id) } });
      }
    }
    const settings = isObject(state.settings) ? state.settings : {};
    const { payRates, ...plainSettings } = settings;
    put('settings', 'main', { data: plainSettings });
    for (const [uid, rates] of Object.entries(isObject(payRates) ? payRates : {})) {
      put('payRate', uid, { owner_id: uid, data: { rates } });
    }
    for (const [uid, plan] of Object.entries(isObject(state.payPlans) ? state.payPlans : {})) {
      put('payPlan', uid, { owner_id: uid, data: isObject(plan) ? plan : {} });
    }
    for (const [uid, prefs] of Object.entries(isObject(state.userPrefs) ? state.userPrefs : {})) {
      put('userPref', uid, { owner_id: uid, data: isObject(prefs) ? prefs : {} });
    }
    for (const [kind, field] of Object.entries(REPORT_KINDS)) {
      const bucket = isObject(state[field]) ? state[field] : {};

        if (!isObject(byUser)) continue;
        for (const [uid, report] of Object.entries(byUser)) {
          put(kind, `${period}:${uid}`, { owner_id: uid, data: { period, userId: uid, report } });
        }
      }
    }
    const workspace = isObject(state.workspaceSettings) ? state.workspaceSettings : {};
    const ws = {};
    for (const [k, v] of Object.entries(workspace)) if (!SERVER_OWNED_WORKSPACE_KEYS.includes(k)) ws[k] = v;
    put('workspaceSettings', 'main', { data: ws });
    for (const [kind, field] of Object.entries(LIST_KINDS)) {
      for (const item of (Array.isArray(state[field]) ? state[field] : [])) {
        if (!item || !item.id) continue;

        put(kind, String(item.id), { owner_id: owner, data: item });
      }
    }
    return out;
  }

  // rows: iterable of { kind, id, brand, owner_id, data, deleted_at, ... }
  function compose(rows, base = {}) {
    const state = { contacts: [], tombstones: [], settings: {}, payPlans: {}, workspaceSettings: {}, userPrefs: {} };
    for (const field of Object.values(LIST_KINDS)) state[field] = [];

    const salesByContact = new Map();
    const tombstones = [];
    const ordered = Array.from(rows).sort((a, b) => (a.seq || 0) - (b.seq || 0));
    for (const row of ordered) {
      if (!row || !row.kind) continue;
      if (row.deleted_at) {

      }

          if (!salesByContact.has(contactId)) salesByContact.set(contactId, []);
          salesByContact.get(contactId).push({ ...sale, id: row.id });
          break;
        }

        case 'payRate': { state.settings.payRates = state.settings.payRates || {}; state.settings.payRates[row.id] = data.rates; break; }
        case 'payPlan': { state.payPlans[row.id] = data; break; }
        case 'userPref': { state.userPrefs[row.id] = data; break; }
        case 'workspaceSettings': { state.workspaceSettings = { ...state.workspaceSettings, ...data }; break; }

            const period = data.period, uid = data.userId;

          }

      }

    }

    // Lists keep the order people arranged them in (sortOrder), then arrival order.
    for (const field of Object.values(LIST_KINDS)) {

        state[field].sort((a, b) => ((typeof a.sortOrder === 'number' ? a.sortOrder : 1e9) - (typeof b.sortOrder === 'number' ? b.sortOrder : 1e9)));
      }
    }
    if (!isObject(state.settings.payRates)) state.settings.payRates = {};

  }

  /* ------------------------------------------------------------------ three-way merge */

  function mergeIdList(base, mine, theirs) {
    const byId = list => new Map((Array.isArray(list) ? list : []).filter(x => x && x.id != null).map(x => [String(x.id), x]));
    const b = byId(base), m = byId(mine), t = byId(theirs);

    const seen = new Set();
    for (const list of [theirs, mine, base]) for (const x of (Array.isArray(list) ? list : [])) {
      if (!x || x.id == null || seen.has(String(x.id))) continue;
      seen.add(String(x.id)); ids.push(String(x.id));
    }
    const out = [];

      if (!mineChanged && theirsChanged) { if (tv) out.push(tv); continue; }
      if (mineChanged && !theirsChanged) { if (mv) out.push(mv); continue; }
      if (!mineChanged && !theirsChanged) { if (tv || mv) out.push(tv || mv); continue; }
      if (!mv || !tv) { out.push(mv || tv); continue; } // an edit beats a deletion
      out.push(mergeValue(bv, mv, tv));
    }
    return out;
  }

  function mergeValue(base, mine, theirs) {
    if (deepEqual(mine, theirs)) return mine;
    if (deepEqual(mine, base)) return theirs;
    if (deepEqual(theirs, base)) return mine;
    if (Array.isArray(mine) && Array.isArray(theirs) && [mine, theirs].every(l => l.every(x => x && typeof x === 'object' && x.id != null))) {
      return mergeIdList(Array.isArray(base) ? base : [], mine, theirs);
    }

        if (!has(mine, k) && !has(theirs, k)) continue;
        if (!has(mine, k)) { if (!deepEqual(theirs[k], b[k]) || !has(b, k)) out[k] = theirs[k]; continue; }
        if (!has(theirs, k)) { if (!deepEqual(mine[k], b[k]) || !has(b, k)) out[k] = mine[k]; continue; }
        out[k] = mergeValue(b[k], mine[k], theirs[k]);
      }
      return out;

    // Scalars both changed differently: the newer-looking timestamp wins when present, else mine.
    return mine;
  }

  function mergeRecord(base, mine, theirs) {
    return {
      brand: mine.brand !== (base && base.brand) ? mine.brand : theirs.brand,
      owner_id: mine.owner_id !== (base && base.owner_id) ? mine.owner_id : theirs.owner_id,
      data: mergeValue(base ? base.data : undefined, mine.data, theirs.data),
      deleted_at: (mine.deleted_at && !deepEqual(mine.data, theirs.data)) ? null : (mine.deleted_at || theirs.deleted_at || null),
    };
  }

  /* ------------------------------------------------------------------ engine */

  class MemoryStore {
    constructor() { this.rows = new Map(); this.seq = 0; }
    async loadAll() { return { rows: Array.from(this.rows.values()), seq: this.seq }; }
    async saveRows(rows) { for (const r of rows) this.rows.set(key(r.kind, r.id), r); }
    async setSeq(seq) { this.seq = seq; }
    async clear() { this.rows.clear(); this.seq = 0; }
  }

  class SyncEngine {
    constructor({ transport, store, currentOwnerId, pageSize = 1000, batchSize = 300, log, maxImplicitDeletes = 20 } = {}) {
      this.transport = transport;
      this.batchSize = batchSize;
      // A sale that is on the server but missing from the state is deleted without a tombstone
      // (it vanishes with its contact, or was removed in the drawer). That is also exactly what a
      // client with a damaged or incomplete state would do to every estimate at once, so more than
      // this many in one push are refused and reported instead (summary.refusedDeletes).
      this.maxImplicitDeletes = maxImplicitDeletes;
      this.store = store || new MemoryStore();
      this.currentOwnerId = currentOwnerId || defaultCurrentOwnerId;
      this.pageSize = pageSize;
      this.log = log || (() => {});
      this.mirror = new Map(); // key -> row { kind, id, brand, owner_id, data, revision, seq, deleted_at }
      this.lastSeq = 0;
      this.loaded = false;
      this._chain = Promise.resolve();
      this.rejected = new Map(); // key -> payload hash the server refused (not retried until the record changes)
    }

    // push() and pull() never overlap: a live-update pull that starts while a push is still
    // recording its outcome would otherwise re-fetch (and re-apply) the row just saved.
    _serial(fn) {
      const run = this._chain.then(fn, fn);
      this._chain = run.then(() => undefined, () => undefined);
      return run;
    }

    async load() {
      const { rows, seq } = await this.store.loadAll();
      this.mirror = new Map(rows.map(r => [key(r.kind, r.id), r]));
      this.lastSeq = seq || 0;
      this.loaded = true;
      return this.mirror.size;
    }

    composeState(base) { return compose(this.mirror.values(), base); }

    async _remember(rows) {
      for (const r of rows) {
        this.mirror.set(key(r.kind, r.id), r);
        if ((r.seq || 0) > this.lastSeq) this.lastSeq = r.seq;
      }
      await this.store.saveRows(rows);
      await this.store.setSeq(this.lastSeq);
    }

    // Fetch everything after lastSeq. Returns the rows that arrived (already in the mirror).
    pull() { return this._serial(() => this._pull()); }
    push(state) { return this._serial(() => this._push(state)); }

    async _pull() {
      const arrived = [];
      for (;;) {
        const page = await this.transport.fetchSince(this.lastSeq, this.pageSize);
        if (!page.length) break;
        await this._remember(page);
        arrived.push(...page);
        if (page.length < this.pageSize) break;
      }
      return arrived;
    }

    // Compare `state` with the mirror and send what changed. Conflicts are merged and retried.
    // Returns { sent, conflicts, merged: [row...] } — `merged` rows should be applied to state.
    async _push(state) {
      const wanted = decompose(state, { currentOwnerId: this.currentOwnerId, existingOwner: (kind, id) => { const m = this.mirror.get(key(kind, id)); return m ? m.owner_id : null; } });
      const tombstoned = new Set((state.tombstones || []).map(t => String(t && t.id)));
      const batch = [];
      for (const [k, rec] of wanted) {
        const have = this.mirror.get(k);
        if (have && !have.deleted_at && deepEqual({ brand: have.brand, owner_id: have.owner_id, data: have.data }, { brand: rec.brand, owner_id: rec.owner_id, data: rec.data })) continue;
        if (have && have.deleted_at && tombstoned.has(rec.id)) continue; // deleted on purpose, still in the state's list → ignore
        const payload = { ...rec, revision: have ? have.revision : 0, deleted_at: null };
        if (this.rejected.get(k) === stableStringify({ b: payload.brand, o: payload.owner_id, d: payload.data })) continue;
        batch.push(payload);
      }
      const implicitSales = [];
      for (const [k, have] of this.mirror) {
        if (have.deleted_at || wanted.has(k)) continue;
        if (!DELETABLE_KINDS.has(have.kind)) continue;
        if (!tombstoned.has(have.id)) {
          if (have.kind !== 'sale') continue; // only explicit deletions
          // A sale vanishes with its contact, or was removed in the drawer: in both cases the
          // state knows the contact's fate. A sale whose contact is simply absent from the state
          // (nothing loaded, partial read, broken merge) is not a deletion — leave it alone.
          const contactId = have.data && have.data.contactId != null ? String(have.data.contactId) : '';
          const contactInState = contactId && wanted.has(key('contact', contactId));
          const contactTombstoned = contactId && tombstoned.has(contactId);
          if (!contactInState && !contactTombstoned) continue;
          implicitSales.push(k);
        }
        batch.push({ kind: have.kind, id: have.id, brand: have.brand, owner_id: have.owner_id, data: have.data, revision: have.revision, deleted_at: new Date().toISOString() });
      }
      const summary = { sent: 0, conflicts: 0, merged: [], errors: [], changes: [], refusedDeletes: [] };
      if (implicitSales.length > this.maxImplicitDeletes) {
        const refused = new Set(implicitSales);
        summary.refusedDeletes = implicitSales.map(k => this.mirror.get(k)).map(r => ({ kind: r.kind, id: r.id, contactId: r.data && r.data.contactId }));
        this.log('refused to delete ' + implicitSales.length + ' sales in one push (limit ' + this.maxImplicitDeletes + ')');
        for (let i = batch.length - 1; i >= 0; i--) if (batch[i].deleted_at && refused.has(key(batch[i].kind, batch[i].id))) batch.splice(i, 1);
      }
      if (!batch.length) return summary;
      this._baseBeforePull = new Map(batch.map(r => [key(r.kind, r.id), this.mirror.get(key(r.kind, r.id)) || null]));
      for (const r of batch) {
        const before = this.mirror.get(key(r.kind, r.id));
        summary.changes.push({ kind: r.kind, id: r.id, before: before && !before.deleted_at ? before.data : null, after: r.deleted_at ? null : clone(r.data) });
      }

      for (let attempt = 0; attempt < 3 && pending.length; attempt++) {
        const outcomes = [];
        for (let i = 0; i < pending.length; i += this.batchSize) {
          const chunk = pending.slice(i, i + this.batchSize);
          outcomes.push(...await this.transport.upsert(chunk.map(r => ({ kind: r.kind, id: r.id, brand: r.brand, owner_id: r.owner_id, data: r.data, revision: r.revision, deleted_at: r.deleted_at }))));
          if (typeof this.onProgress === 'function' && pending.length > this.batchSize) this.onProgress(Math.min(i + chunk.length, pending.length), pending.length);
        }

        const ok = [];
        for (const r of pending) {
          const o = byKey.get(key(r.kind, r.id));
          if (!o) { summary.errors.push({ kind: r.kind, id: r.id, message: 'no outcome' }); continue; }
          if (o.status === 'ok') {
            this.rejected.delete(key(r.kind, r.id));

            // and a later edit in place would otherwise silently rewrite "what the server has".
            ok.push({ kind: r.kind, id: r.id, brand: r.brand, owner_id: r.owner_id, data: clone(r.data), revision: o.revision, seq: o.seq, deleted_at: r.deleted_at || null });
            summary.sent++;
          } else if (o.status === 'conflict') {
            summary.conflicts++;

            const merged = mergeRecord(base, r, theirs);
            const theirsRow = { kind: r.kind, id: r.id, ...theirs, revision: o.revision, seq: o.seq };
            if (deepEqual({ brand: merged.brand, owner_id: merged.owner_id, data: merged.data, deleted_at: merged.deleted_at }, theirs)) {

              ok.push(theirsRow);
              summary.merged.push(theirsRow);
            } else {
              retry.push({ ...r, ...merged, revision: o.revision });

            }

            // Fetch what changed, merge, and go once more.
            summary.conflicts++;

            retry.push(r);
          } else {
            this.rejected.set(key(r.kind, r.id), stableStringify({ b: r.brand, o: r.owner_id, d: r.data }));
            summary.errors.push({ kind: r.kind, id: r.id, message: o.message || 'error' });
          }
        }

          this._pullAfterPush = false; this._retriedAfterPull = true;

        }
        pending = retry;

<script>
/* Supabase binding for the Lumexa CRM sync engine.
 *
 * Wraps supabase-js (loaded separately as window.supabase, UMD build) into the three things the
 * CRM needs: sign-in/team, a transport for the sync engine (records_since / upsert_records), and
 * a change feed so a device pulls when a teammate saves. No business logic lives here.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LumexaSupabase = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  function unwrap(result, what) {
    if (result && result.error) {
      const err = new Error(`${what}: ${result.error.message || result.error}`);
      err.code = result.error.code; err.status = result.error.status; err.cause = result.error;
      throw err;
    }
    return result ? result.data : undefined;
  }

  function createSupabaseBackend({ url, key, supabaseLib, storage, authPagesUrl } = {}) {
    const lib = supabaseLib || (typeof root !== 'undefined' && root.supabase) || (typeof window !== 'undefined' && window.supabase);
    if (!lib || typeof lib.createClient !== 'function') throw new Error('supabase-js is not loaded');
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(String(url || ''))) throw new Error('Supabase project URL is missing or malformed');
    if (!key || String(key).length < 20) throw new Error('Supabase publishable key is missing');
    const client = lib.createClient(url, key, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, flowType: 'implicit', ...(storage ? { storage } : {}) },
      realtime: { params: { eventsPerSecond: 5 } },
    });

    const auth = {
      async session() { return unwrap(await client.auth.getSession(), 'session').session || null; },
      async user() { const s = await auth.session(); return s ? s.user : null; },
      async signIn(email, password) {
        const data = unwrap(await client.auth.signInWithPassword({ email: String(email).trim().toLowerCase(), password }), 'sign in');
        return data.user;
      },
      async signUp(email, password, displayName) {
        const data = unwrap(await client.auth.signUp({
          email: String(email).trim().toLowerCase(), password,
          options: { data: { display_name: String(displayName || '').trim() }, ...(authPagesUrl ? { emailRedirectTo: authPagesUrl } : {}) },
        }), 'sign up');
        // With email confirmation on, `session` is null until the link is clicked.
        return { user: data.user, session: data.session, needsConfirmation: !data.session };
      },
      async signOut() { unwrap(await client.auth.signOut(), 'sign out'); },
      async requestPasswordReset(email, redirectTo) {
        const target = authPagesUrl || redirectTo;
        unwrap(await client.auth.resetPasswordForEmail(String(email).trim().toLowerCase(), target ? { redirectTo: target } : undefined), 'password reset');
      },
      async setPassword(password) { unwrap(await client.auth.updateUser({ password }), 'set password'); },
      // Changing the login email sends a confirmation link to the new address; it takes effect
      // once that link is opened. The roster follows automatically (database trigger).
      async updateEmail(email) { unwrap(await client.auth.updateUser({ email: String(email).trim().toLowerCase() }, authPagesUrl ? { emailRedirectTo: authPagesUrl } : undefined), 'change email'); },
      onChange(listener) {
        const { data } = client.auth.onAuthStateChange((event, session) => listener(event, session ? session.user : null, session));
        return () => data.subscription.unsubscribe();
      },
    };

    const team = {
      // The signed-in person's roster row (null when they have no membership yet).
      async me() {
        const user = await auth.user();
        if (!user) return null;
        const rows = unwrap(await client.from('team_members').select('*').eq('user_id', user.id).limit(1), 'team member');
        return rows && rows[0] ? toMember(rows[0]) : null;
      },
      async roster() {
        const rows = unwrap(await client.from('team_members').select('*').order('created_at'), 'roster');
        return (rows || []).map(toMember);
      },
      async updateMe({ name, color }) {
        const user = await auth.user();
        const patch = {};
        if (typeof name === 'string') patch.name = name.trim();
        if (typeof color === 'string') patch.color = color;
        unwrap(await client.from('team_members').update(patch).eq('user_id', user.id), 'update profile');
      },
      async updateMember(userId, { name, role, active, color }) {
        const patch = {};
        if (typeof name === 'string') patch.name = name.trim();
        if (typeof role === 'string') patch.role = role;
        if (typeof active === 'boolean') patch.active = active;
        if (typeof color === 'string') patch.color = color;
        unwrap(await client.from('team_members').update(patch).eq('user_id', userId), 'update member');
      },
      async removeMember(userId) { unwrap(await client.from('team_members').delete().eq('user_id', userId), 'remove member'); },
      async invites() { return unwrap(await client.from('team_invites').select('*').order('created_at'), 'invites') || []; },
      async invite(email, name, role) {
        unwrap(await client.from('team_invites').upsert({ email: String(email).trim().toLowerCase(), name: String(name).trim(), role }), 'invite');
      },
      async cancelInvite(email) { unwrap(await client.from('team_invites').delete().eq('email', String(email).trim().toLowerCase()), 'cancel invite'); },
    };

    function toMember(row) {
      return { id: row.user_id, email: row.email, name: row.name, role: row.role, active: row.active !== false, color: row.color || '', calendarToken: row.calendar_token || '', createdAt: row.created_at };
    }

    // Edit history (crm_audit): members append their own entries, owner/boss read everything.
    const audit = {
      async append(entries) {
        const rows = (entries || []).map(e => ({ id: e.id, actor_id: e.actor_id, actor_email: e.actor_email || '', actor_name: e.actor_name || '', action: e.action, section: e.section || '', target: e.target || '', details: e.details || '', created_at: e.created_at }));
        if (!rows.length) return;
        unwrap(await client.from('crm_audit').insert(rows), 'audit');
      },
      async list(limit = 500) {
        return unwrap(await client.from('crm_audit').select('*').order('created_at', { ascending: false }).limit(limit), 'audit list') || [];
      },
    };

    // What the sync engine calls.
    const transport = {
      async fetchSince(seq, limit = 1000) {
        const rows = unwrap(await client.rpc('records_since', { p_seq: seq || 0, p_limit: limit }), 'fetch changes');
        return rows || [];
      },
      async upsert(records) {
        const out = unwrap(await client.rpc('upsert_records', { p_records: records }), 'save');
        return Array.isArray(out) ? out : [];
      },
    };

    // Change feed: calls onChange() (debounced) whenever any record changes; the caller pulls.
    // The channel reconnects by itself after an error or timeout, and reports its status so the
    // app can show whether it is live. Bulk writes (an import) can exceed what the feed delivers,
    // so callers should also poll — this feed is the fast path, not the only path.
    function subscribe(onChange, { debounceMs = 400, onStatus } = {}) {
      let timer = null, channel = null, retry = null, attempts = 0, stopped = false;
      const fire = () => { if (timer) clearTimeout(timer); timer = setTimeout(() => { timer = null; onChange(); }, debounceMs); };
      const open = () => {
        if (stopped) return;
        if (channel) { try { client.removeChannel(channel); } catch (e) { /* ignore */ } }
        channel = client.channel(`crm-records-${Date.now()}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'crm_records' }, fire)
          .subscribe((status) => {
            if (typeof onStatus === 'function') onStatus(status);
            if (status === 'SUBSCRIBED') { attempts = 0; fire(); }
            if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status) && !stopped) {
              attempts += 1;
              const wait = Math.min(30000, 1000 * Math.pow(2, Math.min(attempts, 5)));
              if (retry) clearTimeout(retry);
              retry = setTimeout(open, wait);
            }
          });
      };
      open();
      return () => { stopped = true; if (timer) clearTimeout(timer); if (retry) clearTimeout(retry); if (channel) client.removeChannel(channel); };
    }

    // App releases live on GitHub Releases (public repository, published by drag-and-drop). One
    // release carries every platform's installer; the app picks the one for its own platform.
    // Returns { version, notes, publishedAt, mac, macIntel, win, linux, deb } — each { url, file } or
    // null. `mac` is the Apple silicon DMG (a DMG with no architecture in its name counts as that,
    // for older releases), `macIntel` the x64 one.
    const releases = {
      async latest(apiUrl) {
        if (!apiUrl) return null;
        const res = await fetch(apiUrl, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
        if (!res.ok) return null;
        const rel = await res.json();
        const assets = Array.isArray(rel.assets) ? rel.assets : [];
        const pick = (re) => { const a = assets.find(x => re.test(x.name || '')); return a ? { url: a.browser_download_url, file: a.name } : null; };
        return {
          version: String(rel.tag_name || rel.name || '').replace(/^v/i, ''), notes: String(rel.body || '').trim(), publishedAt: rel.published_at || '',
          mac: pick(/-mac-arm64\.dmg$/i) || pick(/^(?!.*-mac-x64\.dmg$).*\.dmg$/i), macIntel: pick(/-mac-x64\.dmg$/i),
          win: pick(/\.exe$/i), linux: pick(/\.AppImage$/i), deb: pick(/\.deb$/i),
        };
      },
    };
    return { client, auth, team, audit, transport, subscribe, releases };
  }

  return { createSupabaseBackend };
});

/* IndexedDB store for the sync engine's local mirror: every record this device has seen, plus
 * the last sequence number. One database per Supabase project and signed-in user, so a shared
 * computer never shows one person's cache to another. Falls back to memory when IndexedDB is
 * unavailable (private windows, some embedded browsers) — the app then simply pulls everything
 * on each start.

  const DB_VERSION = 1;

  function request(req) {
    return new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
  }

        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');

      const rows = await request(tx.objectStore('records').getAll());
      const seq = await request(tx.objectStore('meta').get('seq'));
      await done(tx);
      return { rows: rows || [], seq: Number(seq) || 0 };
    }
    async saveRows(rows) {
      if (!rows.length) return;
      const db = await this.open();
      const tx = db.transaction('records', 'readwrite');

      tx.objectStore('meta').put(Number(seq) || 0, 'seq');
      await done(tx);
    }
    async clear() {
      const db = await this.open();
      const tx = db.transaction(['records', 'meta'], 'readwrite');
      tx.objectStore('records').clear(); tx.objectStore('meta').clear();
      await done(tx);
    }
  }

    constructor() { this.rows = new Map(); this.seq = 0; }

    async saveRows(rows) { for (const r of rows) this.rows.set(recordKey(r), r); }

  async function openStore({ projectRef, userId, idb } = {}) {
    const name = `lumexa_crm_${String(projectRef || 'local').replace(/[^a-z0-9]/gi, '')}_${String(userId || 'anon').replace(/[^a-z0-9-]/gi, '')}`;

  // Preserve legacy activity records from the earlier separate-estimate

  merged.salesActivities = Array.isArray(merged.salesActivities) ? merged.salesActivities
    .filter(item => item && item.type !== 'followed_up')
    .map(item => ({
      id:item.id || cryptoId(), type:'estimate', date:item.date || '',
      contactId:item.contactId || '', contactName:item.contactName || '', notes:item.notes || '',

      }

      result.contacts = result.contacts.filter(p => {

  // browser whose stored reference point predates the record, where plain absence can't be told
  // apart from "never heard of it". Kept 30 days (long enough for every device to sync past the

    merged.leadCategories = alive(merged.leadCategories);
    merged.tasks = alive(merged.tasks);

    for (const key of Object.keys(bucket)) {
      if (tombstoneMap.has(`report:${collection}:${key}`)) { delete bucket[key]; continue; }

        if (tombstoneMap.has(`report:${collection}:${key}:${uid}`) || (own && typeof own === 'object' && !Object.keys(own).length)) delete entry[uid];
      }
      if (!Object.keys(entry).length) delete bucket[key];
    }
  }
  return merged;
}

/* First touchpoint timestamp for a contact (earliest comm log entry OR meeting createdAt). */
function firstActivityIso(c) {
  let earliest = null;
  for (const k of (c.calls || [])) {
    const t = k.timestamp;
    if (t && (!earliest || t < earliest)) earliest = t;
  }
  for (const m of (c.meetings || [])) {
    const t = m.createdAt || m.scheduledOn;
    if (t && (!earliest || t < earliest)) earliest = t;
  }
  return earliest;
}

/* Return contact's status as it stood at the given ISO timestamp (using statusHistory). */
function statusAtIso(c, iso) {
  const hist = c.statusHistory || [];
  if (hist.length === 0) return c.status || 'Cold';
  // History is appended chronologically. Find the latest entry whose changedAt <= iso.
  let active = hist[0];
  for (const h of hist) {
    if ((h.changedAt || '') <= iso) active = h;
    else break;
  }
  return active.status || c.status || 'Cold';
}

/* Activity count for a contact in a date range (inclusive). */
function activityInRange(c, startIso, endIso) {
  let calls = 0, emails = 0, dms = 0;
  for (const k of (c.calls || [])) {
    const t = k.timestamp || '';
    if (t < startIso || t > endIso) continue;
    const ch = (k.channel || 'call');
    if (ch === 'email') emails++;
    else if (ch === 'whatsapp') dms++;
    else calls++;
  }
  return { calls, emails, dms, total: calls + emails + dms };
}

/* Tomorrow attack plan — auto-pick top 3 priority contacts.
   Scoring:
     status base (Hot 100, Warm 50, Cold 20, Inactive 5)
     × recency multiplier (last touchpoint older = higher)
     + bonuses (next-step set: +20, upcoming meeting: +30)
   Returns array of { contact, score, reason }. */
function computeTomorrowPriorities(asOfIso) {
  const asOf = asOfIso || new Date().toISOString();
  const asOfMs = new Date(asOf).getTime();
  const statusBase = { Hot: 100, Warm: 50, Cold: 20, 'On Hold': 5, Inactive: 5 };
  const ranked = [];

  for (const c of visibleContacts()) {
    const sNow = statusAtIso(c, asOf);
    if (sNow === 'Inactive' || sNow === 'On Hold') continue; // skip inactive & on-hold by default

    // Latest touchpoint timestamp
    let lastTs = null;
    for (const k of (c.calls || [])) {
      const t = k.timestamp;
      if (t && (!lastTs || t > lastTs)) lastTs = t;
    }
    // also consider last meeting createdAt
    for (const m of (c.meetings || [])) {
      const t = m.createdAt || m.scheduledOn;
      if (t && (!lastTs || t > lastTs)) lastTs = t;
    }

    // Days since last contact
    let daysSince = lastTs ? Math.floor((asOfMs - new Date(lastTs).getTime()) / 86400000) : 9999;
    if (daysSince < 0) daysSince = 0;

    let recencyMult;
    if (daysSince <= 2)        recencyMult = 0.3;    // just contacted
    else if (daysSince <= 6)   recencyMult = 0.8;
    else if (daysSince <= 14)  recencyMult = 1.3;    // follow-up sweet spot
    else if (daysSince <= 30)  recencyMult = 1.6;
    else                       recencyMult = 1.9;    // very overdue

    let score = (statusBase[sNow] || 20) * recencyMult;

    // Bonuses
    if (c.nextStep && c.nextStep.trim()) score += 20;
    const hasUpcomingMeeting = (c.meetings || []).some(m => !m.completed && m.scheduledOn && new Date(m.scheduledOn).getTime() > asOfMs);
    if (hasUpcomingMeeting) score += 30;

    // Build reason
    const lastLabel = lastTs ? `last contact ${daysSince === 0 ? 'today' : daysSince === 1 ? 'yesterday' : daysSince + 'd ago'}` : 'never contacted';
    let reason = `${sNow} · ${lastLabel}`;
    if (hasUpcomingMeeting) reason += ' · meeting booked';
    if (c.nextStep && c.nextStep.trim()) reason += ' · has next step';

    ranked.push({ contact: c, score, reason, sNow, daysSince });
  }

  ranked.sort((a, b) => b.score - a.score);

  // Diversity: try to ensure at most 2 of the same status in the top 3
  const top = [];
  const statusCount = {};
  for (const r of ranked) {
    const s = r.sNow;
    statusCount[s] = statusCount[s] || 0;
    if (statusCount[s] >= 2 && top.length < 3) continue;
    top.push(r);
    statusCount[s]++;
    if (top.length === 3) break;
  }
  // Fill any remaining slots from raw ranked if diversity rule left us short
  if (top.length < 3) {
    for (const r of ranked) {
      if (!top.includes(r)) top.push(r);
      if (top.length === 3) break;
    }
  }
  return top;
}
async function apiRequest(path, options = {}) {
  const response = await fetch(`${API_BASE}${path}`, {
    credentials:'same-origin',
    ...options,
    headers:{ 'Content-Type':'application/json', ...(options.headers || {}) },
  });
  let data = {};
  try { data = await response.json(); } catch(e) { data = {}; }
  if (!response.ok) {
    const error = new Error(typeof data.detail === 'string' ? data.detail : 'Request failed');
    error.status = response.status;
    error.data = data;
    throw error;
  }
  return data;
}

function cloudProjectRef() { return String(CLOUD.url).replace(/^https:\/\//, '').split('.')[0]; }
function cloudBackend() {

}
function memberToUser(m) { return { id: m.id, email: m.email, name: m.name, role: m.role, active: m.active !== false, color: m.color || '' }; }
// Meta Lead Ads intake lives in the "meta-leads" Edge Function (crm-next/supabase/functions/meta-leads).
// The signed-in person's token goes along; the function checks they are Owner / Manager / Boss.
function metaIntakeUrl() { return `${CLOUD.url}/functions/v1/meta-leads`; }
async function metaIntakeRequest(action, payload = {}) {
  const session = await cloudBackend().auth.session();
  if (!session || !session.access_token) throw new Error('Sign in again to manage Meta Lead Ads.');
  let response;
  try {
    response = await fetch(metaIntakeUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CLOUD.key, Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify({ action, ...payload }) });
  } catch (e) {
    throw new Error('The Meta intake function could not be reached. Is it deployed in Supabase?');
  }
  let data = {};
  try { data = await response.json(); } catch (e) { data = {}; }
  if (!response.ok) throw new Error(data.error || data.message || (response.status === 404 ? 'The meta-leads function is not deployed yet (Supabase → Edge Functions).' : `Request failed (${response.status})`));
  return data;
}

async function initializeCloudApp() {
  try {
    const backend = cloudBackend();
    ui.authRequired = true; ui.authReady = true; ui.setupRequired = false; ui.authUnavailable = false;
    let user = null;
    try { user = await backend.auth.user(); }
    catch (e) {
      // A stale or revoked saved sign-in is not an outage: drop it and ask for the password.
      console.warn('saved session rejected', e);
      try { await backend.auth.signOut(); } catch (e2) { /* ignore */ }
      user = null;
    }
    if (!user) { ui.currentUser = null; renderAuthScreen(); return; }
    const member = await backend.team.me();
    if (!member) { ui.currentUser = { id: user.id, email: user.email, name: user.email, role: 'none' }; renderCloudNoAccessScreen(); return; }
    if (member.active === false) { ui.currentUser = null; renderCloudNoAccessScreen('This account has been deactivated. Ask the Owner to reactivate it.'); return; }
    ui.currentUser = memberToUser(member);
    ui.calendarFeedUrl = '';
    ui.salesPersonId = ui.currentUser.id; ui.reportsPersonId = ui.currentUser.id;
    ui.leadsFilter = loadLeadsFilter(); invalidateDerivedCaches();
    renderAll();
    await loadFromBackend();
    await loadRoster();
  } catch (error) {
    console.error('cloud init failed', error);
    const authy = error && (error.status === 401 || error.status === 403 || /jwt|token|session|not authenticated|invalid claim/i.test(String(error.message || '')));
    if (authy) {
      // The server rejected our sign-in rather than being unreachable: start over at the sign-in screen.
      try { await cloudBackend().auth.signOut(); } catch (e) { /* ignore */ }
      ui.currentUser = null; ui.authUnavailable = false; cloud.authMode = 'signin';
      renderAuthScreen();
      return;
    }
    ui.currentUser = null; ui.authRequired = true; ui.authUnavailable = true; ui.authReady = true; cloud.lastInitError = String(error && error.message || error);

  }
}

// Keep every computer current without anyone pressing anything: the live feed (fast path),
// a check every 20 seconds (catches anything the feed dropped, e.g. after a big import), and a
// check the moment the window comes back into focus or back online.
const CLOUD_POLL_MS = 20000;
function cloudStartWatch() {
  const backend = cloudBackend();
  if (!cloud.unsubscribe) {
    cloud.unsubscribe = backend.subscribe(() => cloudPullLive(), {
      onStatus: (status) => { cloud.liveStatus = status; renderSyncBadge(); },
    });
  }
  if (!cloud.pollTimer) cloud.pollTimer = setInterval(() => { if (!document.hidden) cloudPullLive(); }, CLOUD_POLL_MS);
  if (!cloud.listening) {
    cloud.listening = true;
    window.addEventListener('focus', () => cloudPullLive());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) cloudPullLive(); });
    window.addEventListener('online', () => { cloudPullLive(); if (ui.unsynced) scheduleSync(); });
  }
}
let cloudLivePulling = false;
async function cloudPullLive() {
  if (!cloud.engine || cloudLivePulling) return;
  cloudLivePulling = true;
  cloudRefreshRoster();
  try {
    const rows = await cloud.engine.pull();
    if (!rows.length) return;
    const touched = cloud.engine.applyToState(state, rows);
    afterStateMerged();
    ui.cloudRevision = String(cloud.engine.lastSeq);
    const view = loadLeadsFilter(); if (view !== ui.leadsFilter) { ui.leadsFilter = view; invalidateDerivedCaches(); }
    cloud.lastPulledAt = new Date().toISOString();
    const typing = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) && !document.activeElement.id?.startsWith('contact-search');
    if (ui.page === 'contacts') updateContactsList(); else if (!typing) renderPage();
    if (ui.drawerContactId && touched.has(String(ui.drawerContactId)) && !typing) renderContactDrawer();
    renderSyncBadge();
  } catch (e) {
    console.warn('live pull failed', e);
  } finally { cloudLivePulling = false; }
}

async function cloudSyncToBackend() {
  syncTimer = null;
  if (!cloud.engine || !ui.cloudLoaded) { ui.lastSyncStatus = 'err'; renderSyncBadge(); scheduleSyncRetry(); return; }
  try {
    ui.syncing = true; renderSyncBadge();
    // Automations keep the order they are listed in (same order as the web app); the position
    // travels with each record so every computer shows the same list.
    (state.tasks || []).forEach((t, i) => { if (t && typeof t === 'object' && t.sortOrder !== i) t.sortOrder = i; });
    const r = await cloud.engine.push(state);
    if (r.refusedDeletes && r.refusedDeletes.length) {
      // The engine will not wipe estimates in bulk. Reload the server copy instead of saving over it.
      console.error('sync refused a bulk estimate deletion', r.refusedDeletes);
      toast(`Stopped a save that would have removed ${r.refusedDeletes.length} estimates. Reloading the saved copy — nothing was deleted.`);
      cloudBackend().audit.append([{ id: cryptoId(), actor_id: ui.currentUser?.id || '', actor_email: ui.currentUser?.email || '', actor_name: ui.currentUser?.name || '', action: 'refused', section: 'Sales', target: `${r.refusedDeletes.length} estimates`, details: 'Bulk estimate deletion refused by the sync guard', created_at: new Date().toISOString() }]).catch(() => {});
      setTimeout(() => { try { cloudRebuildStateFromMirror(); } catch (e) { console.warn('rebuild after refused delete failed', e); } }, 100);
    }
    if (r.changes && r.changes.length && !r.errors.length) {
      cloudBackend().audit.append(cloudAuditEntries(r.changes)).catch(e => console.warn('audit write failed', e));
    }
    if (r.merged.length) {
      cloud.engine.applyToState(state, r.merged);
      afterStateMerged();
      updateContactsList();
      if (ui.drawerContactId) renderContactDrawer();
      toast('Combined your changes with a teammate’s update — nothing was lost.');
    }
    if (r.errors.length) {
      ui.lastSyncStatus = 'err';
      toast(`Some changes could not be saved: ${r.errors[0].message}`);
      scheduleSyncRetry();
    } else {
      ui.unsynced = false; ui.lastSyncStatus = 'ok'; ui.syncRetries = 0;
      state.lastSync = new Date().toISOString();
      ui.cloudRevision = String(cloud.engine.lastSeq);
    }
  } catch (e) {
    console.warn('cloud sync failed', e);
    ui.lastSyncStatus = 'err';
    scheduleSyncRetry();
  } finally {
    ui.syncing = false;
    renderSyncBadge();
  }
}

// Throw away the in-memory state and rebuild it from the server copy the engine already holds.
function cloudRebuildStateFromMirror() {
  if (!cloud.engine) return;

// Port of the old server's crm_audit_changes, computed from the records a save actually changed.
const CLOUD_AUDIT_CONTACT_FIELDS = { name:'Name', pointOfContact:'Point of contact', email:'Email', phone:'Phone', company:'Company', role:'Role', website:'Website', status:'Status', statusReason:'Status reason', leadType:'Lead type', leadSource:'Lead source', campaignName:'Campaign name', brand:'Brand', nextStep:'Next step', nextActionDue:'Next action date', onHoldUntil:'On Hold follow-up', tags:'Tags', notes:'Notes' };
const CLOUD_AUDIT_CONTACT_LISTS = [['subcontacts','Company contacts'], ['meetings','Meetings'], ['calls','Communication log'], ['files','Customer files'], ['projects','Projects'], ['orders','Production orders'], ['renders','Renders'], ['renderRequests','Render requests']];
const CLOUD_AUDIT_KINDS = { calendarEvent:'Calendar', task:'Automations', dailyReport:'Daily reports', weeklyReport:'Weekly reports', monthlyReport:'Monthly reports', settings:'Payout settings', payRate:'Payout settings', payPlan:'Pay plans', workspaceSettings:'Workspace settings', leadCategory:'Lead categories', salesActivity:'Legacy financial activity' };
function cloudAuditEntries(changes) {
  const same = (a, b) => JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b);
  const out = [];
  const now = new Date().toISOString();
  const actor = { actor_id: ui.currentUser?.id || '', actor_email: ui.currentUser?.email || '', actor_name: ui.currentUser?.name || ui.currentUser?.email || '' };
  const push = (action, section, target, details) => out.push({ id: cryptoId(), ...actor, action, section, target, details, created_at: now });
  for (const ch of changes || []) {
    const { kind, before, after } = ch;
    if (kind === 'contact') {
      if (!before && after) { push('created', 'Contacts', after.name || 'New contact', 'Contact created'); continue; }
      if (before && !after) { push('deleted', 'Contacts', before.name || 'Contact', 'Contact deleted'); continue; }
      if (!before || !after) continue;
      const fields = Object.entries(CLOUD_AUDIT_CONTACT_FIELDS).filter(([k]) => !same(before[k], after[k])).map(([, label]) => label);
      if (fields.length) push('updated', 'Contact details', after.name || before.name || 'Contact', 'Changed ' + fields.join(', '));
      for (const [k, label] of CLOUD_AUDIT_CONTACT_LISTS) {
        if (!same(before[k] || [], after[k] || [])) push('updated', label, after.name || before.name || 'Contact', `${label} changed (${(before[k] || []).length} → ${(after[k] || []).length})`);
      }
    } else if (kind === 'sale') {
      const contactName = getContact((after || before || {}).contactId)?.name || 'Contact';
      push(!before ? 'created' : (!after ? 'deleted' : 'updated'), 'Sales', contactName, !before ? 'Estimate added' : (!after ? 'Estimate removed' : 'Estimate updated'));
    } else if (kind === 'userPref') {
      continue;
    } else if (CLOUD_AUDIT_KINDS[kind]) {
      const label = CLOUD_AUDIT_KINDS[kind];
      push('updated', label, label, `${label} updated`);
    }
  }
  // One line per section per save is enough for the activity view.
  const seen = new Set();
  return out.filter(e => { const k = `${e.section}|${e.target}|${e.details}`; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 100);
}

// Legacy (web CRM) user ids → Supabase account ids, matched by email through the roster.
let cloudFullRoster = [];
function cloudLegacyIdMap() {
  const map = {};
  const byEmail = new Map(cloudFullRoster.map(m => [String(m.email || '').toLowerCase(), m.id]));
  for (const legacy of (CLOUD.legacyUsers || [])) {
    const target = byEmail.get(String(legacy.email || '').toLowerCase());
    if (legacy.id && target) map[legacy.id] = target;
  }
  return map;
}
// Replace every occurrence of an old user id — as a value or as an object key — anywhere in the data.
function remapUserIds(value, map) {
  if (!map || !Object.keys(map).length) return value;
  const walk = (v) => {
    if (typeof v === 'string') return Object.prototype.hasOwnProperty.call(map, v) ? map[v] : v;
    if (Array.isArray(v)) return v.map(walk);

        // overwrite otherwise — exactly the case (e.g. a browser where that snapshot never fit

        // whether the push below succeeds. A reference point that's stale relative to the cloud

        // deletion look like a brand-new item to merge back in on the next conflict retry — the
        // longer the reference point stays wrong, the longer that keeps happening. Any local
        // change not yet pushed is still safe: it only exists in `state`, and threeWayMerge always
        // compares against `state` (mine) fresh next time, never against this stored snapshot.

async function pullFromBackend(force = false) {
  if (cloudMode()) return cloudPullFromBackend();
  try {
    const res = await fetch(`${API_BASE}/api/crm/state`, {credentials:'same-origin'});
    if (!res.ok) { toast('Cloud not reachable.'); return; }
    const data = await res.json();
    if (!data || !data.state) { toast('No cloud backup yet.'); return; }
    const cloudContacts = Array.isArray(data.state.contacts) ? data.state.contacts.length : 0;
    // Always combine with the cloud copy rather than blindly overwriting — so pulling never
    // discards work that just hadn't synced yet. This used to only merge when a locally-stored
    // reference point (loadCloudBase()) existed, silently falling back to a full overwrite
    // otherwise (e.g. on a browser where that snapshot never fit under the storage quota) —
    // exactly when a safe merge matters most. threeWayMerge already treats a missing/malformed
    // base as empty and unions both sides by id, so an empty fallback base is strictly safer
    // than skipping the merge.
    const baseRecord = await loadCloudBase();
    const merged = threeWayMerge(baseRecord ? baseRecord.state : {}, state, data.state);
    const combining = !deepEqualJson(merged, data.state);
    const resultState = merged;
    const message = combining
      ? `Combine your unsaved local changes with the cloud copy (${cloudContacts} cloud contacts)? Nothing will be discarded.`
      : `Replace your local CRM with the cloud copy (${cloudContacts} contacts)?`;
    if (!force && !confirm(message)) return;
    reconcileInPlace(state, mergeWithDefaults(resultState));
    afterStateMerged();
    ui.cloudRevision = data.updated_at || null;
    // Refresh the reference point to what the cloud actually holds right now, whether or not
    // there's anything left to push — a stale reference point is what makes a genuine deletion
    // look like a brand-new item to merge back in on some later conflict retry, so every
    // confirmed look at the cloud should narrow that window, not just the no-op case.
    setCloudBase(data.state, data.updated_at);
    if (combining) {
      saveState(); // push the combined result back up
    } else {
      saveState({ sync: false });
    }
    renderAll();
    toast(combining ? `Combined your local changes with the cloud copy (${cloudContacts} contacts).` : `Pulled ${cloudContacts} contacts from cloud.`);
  } catch(e) { toast('Sync failed: ' + e.message); }
}

/* Compute monthly payout for a given YYYY-MM, for one teammate at a time.

  // even if a stale ui.salesPersonId selection is present.

  const userId = (requested && requested !== 'all' && (canManagePayroll() || requested === ui.currentUser?.id))

    const created = m.createdAt || m.scheduledOn;

  });

  // earns half the commission in September; the balance earns the rest when it is paid.
  const sales = salePaymentRows(allSales().filter(s => s.createdByUserId === userId))
    .filter(r => inPeriod(r.paymentDate) && withinWindow(r.paymentDate));

  // Group meetings by ISO week (by creation date) to award weekly bonuses
  const byWeek = {};
  for (const m of meetings) {
    const created = m.createdAt || m.scheduledOn;
    const wk = weekKey(created);
    byWeek[wk] = (byWeek[wk] || 0) + 1;
  }
  const qualifyingWeeks = Object.values(byWeek).filter(n => n >= Number(plan.weeklyThreshold || 1)).length;

  const salesTotal = round2(sales.reduce((acc, r) => acc + Number(r.paymentAmount || 0), 0));
  const commission = round2(sales.reduce((acc, r) => acc + paymentCommissionAmount(r, r.payment, commissionRate), 0));
  // Fixed pay is entered per month; a fixed-length cycle gets its proportional share.
  const planForPeriod = period.cycle === 'monthly' ? plan
    : (period.cycle === 'semimonthly' ? { ...plan, basePay: round2(Number(plan.basePay || 0) / 2) }
    : { ...plan, basePay: round2(Number(plan.basePay || 0) * period.days / 30.4375) });
  const parts = computePlanParts(planForPeriod, { meetingsCount: meetings.length, qualifyingWeeks, salesTotal, commissionTotal: commission });
  // Extra bonuses: a named amount per period, per meeting booked, or per sale payment received.
  const extrasBreakdown = planExtras(plan).map(x => {
    const count = x.trigger === 'meeting' ? meetings.length : (x.trigger === 'payment' ? sales.length : 1);
    return { id: x.id, label: x.label, trigger: x.trigger, unit: x.amount, count, amount: round2(count * x.amount) };
  });
  const extrasTotal = round2(extrasBreakdown.reduce((acc, x) => acc + x.amount, 0));

  // Override commission: a % of another teammate's own paid sales this month, on top of this
  // person's own plan above — e.g. a manager earning a cut of someone reporting to them.
  // Independent of planType/commissionRate; based on the gross sale amount, not what the

    meetingsCount: meetings.length,
    meetingsList: meetings,  // includes contactName, scheduledOn, createdAt, agenda

const NAV_MIN_W = 180, NAV_MAX_W = 440, NAV_DEFAULT_W = 256;
function loadNavPrefs() {
  try {
    ui.navCollapsed = localStorage.getItem('lumexa_nav_collapsed') === '1';
    const w = parseInt(localStorage.getItem('lumexa_nav_width') || '', 10);
    ui.navWidth = Number.isFinite(w) ? Math.min(NAV_MAX_W, Math.max(NAV_MIN_W, w)) : NAV_DEFAULT_W;
  } catch (e) { ui.navCollapsed = false; ui.navWidth = NAV_DEFAULT_W; }
  applyNavWidth();
}
function applyNavWidth() {
  const root = document.documentElement;
  if (root && root.style && typeof root.style.setProperty === 'function') root.style.setProperty('--crm-nav-w', `${ui.navWidth || NAV_DEFAULT_W}px`);

function saveNavPrefs() {
  try { localStorage.setItem('lumexa_nav_collapsed', ui.navCollapsed ? '1' : '0'); localStorage.setItem('lumexa_nav_width', String(ui.navWidth || NAV_DEFAULT_W)); } catch (e) { /* private mode */ }

function bindNavResizer() {
  const handle = document.querySelector('[data-nav-resizer]');
  if (!handle) return;
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    document.body.classList.add('nav-resizing');
    const move = (ev) => { ui.navWidth = Math.min(NAV_MAX_W, Math.max(NAV_MIN_W, Math.round(ev.clientX))); applyNavWidth(); };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); document.body.classList.remove('nav-resizing'); saveNavPrefs(); };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });
  handle.addEventListener('dblclick', () => { ui.navWidth = NAV_DEFAULT_W; applyNavWidth(); saveNavPrefs(); });
}

function pipelineStats(cards) {
  const open = cards.filter(card => card.p.stage !== 'Completed');
  const leads = new Set(open.map(card => card.c.id));
  let followUps = 0, estimatesOut = 0;
  for (const id of leads) {
    const c = getContact(id); if (!c) continue;
    const b = actionBucket(c); if (b === 'overdue' || b === 'today') followUps++;
    estimatesOut += openEstimateCount(c.sales || []);
  }
  return { openLeads: leads.size, followUps, estimatesOut, awaiting: open.filter(card => card.p.stage === 'Awaiting payment').length };
}
function projectAmountLabel(c, p) {
  const sales = (c.sales || []).filter(sale => sale && !saleNotSelected(sale) && (!sale.projectId || sale.projectId === p.id));
  if (!sales.length) return '';
  const sets = estimateSets(sales);
  const live = sets.filter(set => ['sold', 'pending'].includes(estimateSetStatus(set)));
  const sum = list => list.reduce((acc, set) => acc + estimateSetValue(set), 0);
  if (!live.length) return `${fmtMoneyShort(sum(sets))} declined`;
  if (live.every(set => estimateSetStatus(set) === 'sold')) {
    const full = live.every(set => set.filter(saleIsSold).every(s => s.status === 'paid'));
    return `${fmtMoneyShort(sum(live))} ${full ? 'paid' : 'sold'}`;
  }
  // Open sets count at their lowest option; the range shows what is still on the table.
  const low = sum(live);
  const high = live.reduce((acc, set) => acc + (estimateSetStatus(set) === 'sold' ? estimateSetValue(set) : estimateSetRange(set).high), 0);
  return high > low ? `${fmtMoneyShort(low)}–${fmtMoneyShort(high)} est.` : `${fmtMoneyShort(low)} est.`;
}

function moveProjectStage(key, stage) {
  const [contactId, projectId] = String(key || '').split('|');
  const contact = getContact(contactId);
  const p = contact ? findProject(contact, projectId) : null;
  if (!contact || !p || !PROJECT_STAGES.some(option => option.id === stage)) return false;
  p.stage = stage; p.updatedAt = new Date().toISOString();
  syncProjectMirror(contact);
  saveState(); renderPage();
  if (ui.drawerContactId === contact.id) renderContactDrawer();
  toast(`${projectName(contact, p)} moved to ${stage}.`);
  return true;
}

/* ----------------- Calendar ----------------- */
function calendarEntries() {
  const entries = [];
  for (const c of visibleContacts()) {
    if (c.nextActionDue) entries.push({
      id:`next-${c.id}`, type:'next', date:localDateKey(c.nextActionDue), time:extractTimeOfDay(c.nextActionDue),
      title:`Next action · ${c.name || 'Contact'}`, notes:c.nextStep || 'Next action due', contactId:c.id,
    });
    if (c.status === 'On Hold' && c.onHoldUntil) entries.push({
      id:`hold-${c.id}`, type:'onhold', date:localDateKey(c.onHoldUntil), time:'',
      title:`On Hold follow-up · ${c.name || 'Contact'}`, notes:c.statusReason || 'Resume follow-up', contactId:c.id,
    });
    for (const meeting of (c.meetings || [])) {
      if (!meeting.scheduledOn) continue;
      const scheduled = new Date(meeting.scheduledOn);
      const time = isNaN(scheduled) ? '' : localTimeOfDay(scheduled);
      entries.push({
        id:`meeting-${c.id}-${meeting.id}`, type:'meeting', date:localDateKey(meeting.scheduledOn), time,
        title:`Meeting · ${c.name || 'Contact'}`, notes:meeting.agenda || 'Meeting', contactId:c.id, meetingType: MEETING_TYPES[meeting.type] ? meeting.type : '',
        completed:!!meeting.completed,
      });
    }
  }
  for (const event of (state.calendarEvents || [])) entries.push({
    id:`custom-${event.id}`, type:'custom', date:localDateKey(event.date), time:event.time || '',
    title:event.title || 'Reminder', notes:event.notes || '', eventId:event.id,
  });
  return entries.filter(entry => entry.date).sort((a,b) =>
    a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '') || a.title.localeCompare(b.title));
}

function calendarEventStyle(type) {
  if (type === 'meeting') return 'background:#e9f1e8;color:#35553a;border-color:#bdd0bd;';
  if (type === 'next') return 'background:#fff0e8;color:#9b421d;border-color:#efc5b2;';
  if (type === 'onhold') return 'background:#f0edf8;color:#5c4d8a;border-color:#ccc3e5;';
  return 'background:#e9f0f5;color:#294e68;border-color:#bed0dc;';
}

function calendarTypeLabel(type) {
  if (type === 'meeting') return 'Meeting';
  if (type === 'next') return 'Next action';
  if (type === 'onhold') return 'On Hold';
  return 'Reminder';
}

function calendarTypeIcon(type) {
  if (type === 'meeting') return svgIcon('users');
  if (type === 'next') return svgIcon('check');
  if (type === 'onhold') return svgIcon('calendar');
  return svgIcon('bolt');
}

function calendarDisplayTitle(entry) {
  const prefixes = {
    meeting:'Meeting · ',
    next:'Next action · ',
    onhold:'On Hold follow-up · ',
  };
  const prefix = prefixes[entry.type] || '';
  return prefix && String(entry.title || '').startsWith(prefix) ? String(entry.title).slice(prefix.length) : (entry.title || calendarTypeLabel(entry.type));
}

function renderCalendarEvent(entry, compact = false) {
  const action = entry.contactId
    ? `data-calendar-contact="${esc(entry.contactId)}"`
    : `data-calendar-custom="${esc(entry.eventId)}"`;
  return `<button class="w-full text-left border rounded px-2 py-1 ${compact ? 'text-[10px]' : 'text-xs'} leading-tight hover:opacity-80" style="${calendarEventStyle(entry.type)}" ${action} title="${esc(entry.notes || entry.title)}">
    <span class="calendar-type-label">${esc(calendarTypeLabel(entry.type))}</span>${entry.time ? `<span class="mono opacity-70 mr-1">${esc(entry.time)}</span>` : ''}${entry.meetingType ? `<span class="chip ${MEETING_TYPES[entry.meetingType].chip} mr-1" data-meeting-type="${esc(entry.meetingType)}" style="font-size:9px;padding:0 6px">${MEETING_TYPES[entry.meetingType].label}</span>` : ''}${esc(calendarDisplayTitle(entry))}${entry.completed ? ' ✓' : ''}
  </button>`;
}

function renderCalendar() {
  const [year, month] = String(ui.calendarMonth || monthKey(new Date())).split('-').map(Number);
  const safeYear = Number.isFinite(year) ? year : new Date().getFullYear();
  const safeMonth = Number.isFinite(month) ? month : new Date().getMonth() + 1;
  const first = new Date(safeYear, safeMonth - 1, 1);
  const gridStart = new Date(first);
  gridStart.setDate(first.getDate() - ((first.getDay() + 6) % 7));
  const allEntries = calendarEntries();
  const calendarTypes = ui.calendarTypes || {meeting:true, next:true, onhold:true, custom:true};
  const entries = allEntries.filter(entry => calendarTypes[entry.type] !== false);
  const monthPrefix = `${safeYear}-${String(safeMonth).padStart(2,'0')}`;
  const typeCounts = ['meeting','next','onhold','custom'].reduce((counts,type) => {
    counts[type] = allEntries.filter(entry => entry.type === type && entry.date.startsWith(monthPrefix)).length;
    return counts;
  }, {});
  const activeTypeCount = Object.values(calendarTypes).filter(Boolean).length;
  const byDate = entries.reduce((map, entry) => {
    (map[entry.date] ||= []).push(entry);
    return map;
  }, {});
  const today = localDateKey(new Date());
  const agendaEndKey = shiftDateKey(today, 30);
  const agenda = entries.filter(entry => entry.date >= today && entry.date <= agendaEndKey).slice(0,30);
  const overdue = entries.filter(entry => (entry.type === 'next' || entry.type === 'onhold') && entry.date < today).slice(-10);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const date = new Date(gridStart); date.setDate(gridStart.getDate() + i);
    const key = localDateKey(date);
    const dayEntries = byDate[key] || [];
    const inMonth = date.getMonth() === safeMonth - 1;
    cells.push(`<div class="min-h-[116px] border-r border-b border-sand p-2 ${inMonth ? 'bg-white' : 'bg-paper/60'} ${key===today ? 'ring-2 ring-inset ring-ember' : ''}" data-calendar-day="${key}">
      <div class="flex items-center justify-between mb-1">
        <span class="mono text-xs ${inMonth ? 'text-ink' : 'text-ash/50'}">${date.getDate()}</span>
        ${key===today ? '<span class="text-[9px] uppercase tracking-wider text-ember">Today</span>' : ''}
      </div>
      <div class="space-y-1">${dayEntries.slice(0,3).map(entry => renderCalendarEvent(entry, true)).join('')}${dayEntries.length > 3 ? `<div class="text-[10px] text-ash pl-1">+${dayEntries.length-3} more</div>` : ''}</div>
    </div>`);
  }
  const agendaRows = [...overdue, ...agenda];
  return `
    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
      <div>
        <div class="serif text-2xl">${esc(monthLabel(`${safeYear}-${String(safeMonth).padStart(2,'0')}`))}</div>
        <div class="text-xs text-ash mt-1">Meetings, next actions, On Hold follow-ups and your own reminders in one place.</div>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost" data-calendar-nav="prev" aria-label="Previous month">←</button>
        <button class="btn btn-ghost" data-calendar-nav="today">Today</button>
        <button class="btn btn-ghost" data-calendar-nav="next" aria-label="Next month">→</button>
        <input class="input" style="width:150px" type="month" id="calendar-month" data-testid="calendar-month" value="${safeYear}-${String(safeMonth).padStart(2,'0')}"/>
        <button class="btn btn-primary" data-calendar-add data-testid="calendar-add-reminder">${svgIcon('plus')} Add reminder</button>
      </div>
    </div>
    <div class="card calendar-filter-bar" data-testid="calendar-filters">
      <div>
        <div class="label">Show on calendar</div>
        <div class="calendar-filter-list">
          ${['meeting','next','onhold','custom'].map(type => `<button type="button" class="calendar-filter ${calendarTypes[type]!==false?'active':''}" data-calendar-filter="${type}" aria-pressed="${calendarTypes[type]!==false?'true':'false'}">${calendarTypeIcon(type)}<strong>${esc(calendarTypeLabel(type))}</strong><small>${typeCounts[type]}</small></button>`).join('')}
        </div>
      </div>
      <div class="text-right shrink-0">
        <div class="text-[10px] text-ash mb-2">${activeTypeCount} of 4 types shown</div>
        <div class="flex gap-1"><button class="btn btn-ghost" data-calendar-filter-action="all">Show all</button><button class="btn btn-ghost" data-calendar-filter-action="none">Clear</button></div>
      </div>
    </div>
    <div class="card overflow-hidden" data-testid="calendar-grid">
      <div class="grid grid-cols-7 bg-ink text-white">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(day => `<div class="px-3 py-2 text-[10px] mono uppercase tracking-[0.18em] border-r border-white/10">${day}</div>`).join('')}</div>
      <div class="grid grid-cols-7">${cells.join('')}</div>
    </div>
    <div class="card p-6 mt-6">
      <div class="flex items-center justify-between">
        <div><h3 class="serif text-2xl">Upcoming agenda</h3><div class="text-xs text-ash mt-1">The next 30 days, plus overdue contact reminders. Uses the filters above.</div></div>
        <span class="chip chip-cold">${agendaRows.length} visible</span>
      </div>
      <div class="mt-4 divide-row" data-testid="calendar-agenda">
        ${agendaRows.length === 0 ? `<div class="text-sm text-ash py-5">${activeTypeCount === 0 ? 'No event types are selected. Choose a filter above to show calendar items.' : 'Nothing matching these filters is scheduled in the next 30 days.'}</div>` : agendaRows.map(entry => {
          const meta = nextActionDueMeta(entry.date);
          return `<div class="py-3 flex items-center gap-4">
            <div class="w-28 shrink-0"><div class="text-sm mono ${entry.date < today ? 'text-ember' : ''}">${esc(fmtDate(`${entry.date}T12:00:00`))}</div>${entry.time ? `<div class="text-xs text-ash mono mt-0.5">${esc(entry.time)}</div>` : (entry.date < today ? `<div class="text-[10px] text-ember mt-0.5">${esc(meta?.label || 'Overdue')}</div>` : '')}</div>
            <div class="flex-1 min-w-0"><div class="font-semibold">${esc(calendarDisplayTitle(entry))}${entry.completed ? ' ✓' : ''}</div><div class="text-xs text-ash mt-0.5 truncate">${esc(entry.notes || 'No note')}</div></div>
            <span class="border rounded px-2 py-1 text-[10px] mono uppercase inline-flex items-center gap-1" style="${calendarEventStyle(entry.type)}">${calendarTypeIcon(entry.type)}${esc(calendarTypeLabel(entry.type))}</span>
            ${entry.contactId ? `<button class="btn btn-ghost" data-calendar-contact="${esc(entry.contactId)}">Open</button>` : `<button class="btn btn-ghost" data-calendar-custom="${esc(entry.eventId)}">Edit</button><button class="btn btn-ghost" data-calendar-delete="${esc(entry.eventId)}" aria-label="Delete reminder">${svgIcon('trash')}</button>`}
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function openCalendarEventEditor(eventId = null) {
  const existing = eventId ? (state.calendarEvents || []).find(event => event.id === eventId) : null;
  openModal({
    title: existing ? 'Edit reminder' : 'Add calendar reminder',
    subtitle: 'Use this for anything that is not already a meeting, next action or On Hold follow-up.',
    fields: [
      { key:'title', label:'Title', type:'text', value:existing?.title || '', placeholder:'e.g. Send proposal' },
      { key:'date', label:'Date', type:'date', value:existing?.date || localDateKey(new Date()) },
      { key:'time', label:'Time (optional)', type:'time', value:existing?.time || '' },
      { key:'notes', label:'Notes (optional)', type:'textarea', rows:3, value:existing?.notes || '' },
    ],
    submitLabel: existing ? 'Save reminder' : 'Add reminder',
    onSubmit: values => {
      if (!values.title.trim() || !values.date) { toast('Add a title and date.'); return false; }
      const record = { id:existing?.id || cryptoId(), title:values.title.trim(), date:values.date, time:values.time || '', notes:values.notes || '', createdAt:existing?.createdAt || new Date().toISOString() };
      state.calendarEvents = state.calendarEvents || [];
      if (existing) state.calendarEvents = state.calendarEvents.map(event => event.id === existing.id ? record : event);
      else state.calendarEvents.push(record);
      ui.calendarMonth = record.date.slice(0,7);
      saveState(); renderPage();
      toast(existing ? 'Reminder updated.' : 'Reminder added to your calendar.');
    },
  });
}

// Home: everything in short — the numbers, today's and upcoming meetings, follow-ups that are
// due, and the pipeline with a few cards per stage. Each block links to its full page.
function renderDashboard() {
  const contacts = visibleContacts();
  const todayKey = localDateKey(new Date());
  const byTime = (a, b) => String(a.scheduledOn || '').localeCompare(String(b.scheduledOn || ''));
  const meetings = allMeetings().filter(m => m.contactBrand === activeBrand() && !m.completed && m.scheduledOn);
  const todayMeetings = meetings.filter(m => localDateKey(m.scheduledOn) === todayKey).sort(byTime);
  const upcoming = meetings.filter(m => localDateKey(m.scheduledOn) > todayKey).sort(byTime).slice(0, 5);
  const nextActions = [
    ...contacts.filter(c => c.nextActionDue && c.status !== 'Inactive').map(contact => ({ contact, date: localDateKey(contact.nextActionDue), time: extractTimeOfDay(contact.nextActionDue), label: contact.nextStep || 'Next action due', type: 'next' })),
    ...contacts.filter(c => c.status === 'On Hold' && c.onHoldUntil).map(contact => ({ contact, date: localDateKey(contact.onHoldUntil), label: `On Hold · ${contact.statusReason || 'Resume follow-up'}`, type: 'onhold' })),
  ].filter(item => item.date).sort((a, b) => a.date.localeCompare(b.date));
  const dueNow = nextActions.filter(item => item.date <= todayKey);
  const soon = nextActions.filter(item => item.date > todayKey).slice(0, Math.max(0, 8 - dueNow.length));
  const cards = projectBoardCards();
  const stats = pipelineStats(cards);
  const tile = (label, value, tone, nav) => `<button type="button" class="card kpi-tile text-left" data-nav="${nav}"><div class="kpi-label">${label}</div><div class="kpi-value ${tone || ''}">${value}</div></button>`;
  const meetingRow = (m) => `<div class="py-2.5 flex items-center justify-between gap-3">
      <div class="min-w-0"><div class="font-semibold text-sm truncate">${esc(m.contactName)}</div><div class="text-xs text-ash truncate">${esc(m.agenda || 'Meeting')}</div></div>
      <div class="flex items-center gap-2 shrink-0">${meetingTypeChip(m)}<span class="text-xs mono text-ash-dark">${esc(localDateKey(m.scheduledOn) === todayKey ? (localTimeOfDay(m.scheduledOn) || 'today') : fmtDateTime(m.scheduledOn))}</span><button class="btn btn-ghost btn-xs" data-action="open-contact" data-id="${esc(m.contactId)}">Open</button></div>
    </div>`;
  const actionRow = (item) => { const due = nextActionDueMeta(item.date); return `<div class="py-2.5 flex items-center justify-between gap-3">
