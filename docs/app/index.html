/* ----------------- command palette (⌘K) & keyboard shortcuts ----------------- */
function paletteItems() {
  const q = String(ui.paletteQuery || '').trim().toLowerCase();
  const items = [];
  const other = activeBrand() === 'lumexa' ? 'velum' : 'lumexa';
  const actions = [
    { label:'New contact', hint:'N', run:() => { if (!['contacts','projects'].includes(ui.page)) ui.page = 'contacts'; newContact(false); } },
    { label:`Switch to ${BRANDS[other].name}`, run:() => { ui.activeBrand = other; ui.selectedContactIds.clear(); renderAll(); } },
    { label:'Pull from cloud', run:() => pullFromBackend(false) },
    ...(canManageUsers() ? [{ label:'Export backup', run:() => exportBackup() }] : []),
  ];
  const pages = [];
  for (const group of navGroups()) for (const [id, label, , ok] of group.items) if (ok) pages.push({ label:`Go to ${label}`, run:() => navigateTo(id) });
  if (canManageWorkspace()) pages.push({ label:'Go to Settings', run:() => navigateTo('settings') });
  const match = text => !q || text.toLowerCase().includes(q);
  for (const a of actions) if (match(a.label)) items.push({ type:'Actions', ...a });
  for (const p of pages) if (match(p.label)) items.push({ type:'Pages', ...p });
  if (q) {
    let n = 0;
    for (const c of state.contacts) {
      if (n >= 8) break;
      const hay = `${c.name || ''} ${c.company || ''} ${c.email || ''} ${c.phone || ''} ${c.pointOfContact || ''} ${contactProjects(c).map(p => p.name).join(' ')}`.toLowerCase();
      if (!hay.includes(q)) continue;
      n++;
      const where = c.company || c.email || '';
      items.push({ type:'Leads', label:c.name || 'Unnamed contact', sub:`${where}${where ? ' · ' : ''}${BRANDS[c.brand || 'lumexa']?.name || 'Lumexa'}`, run:() => openContactAnywhere(c.id) });
    }
  }
  return items;
}
// Jump to a lead from anywhere: switch to its brand, land on a page that can show the drawer,
// and (in the Split view) drop any filter that would hide it from the list.
function openContactAnywhere(id) {
  const c = getContact(id);
  if (!c) return;
  ui.activeBrand = c.brand || 'lumexa';
  if (ui.splitOverride) ui.page = 'contacts';
  if (!['contacts','actions','dashboard','calendar','projects'].includes(ui.page)) ui.page = 'contacts';
  if (ui.page === 'contacts' && isSplitLayout() && !filterContacts().some(x => x.id === id)) {
    ui.search = ''; ui.statusFilter = 'All'; ui.categoryFilter = 'all'; ui.regionFilter = 'all';
  }
  if (!leadOwnerMatches(c)) {
    ui.leadsFilter = 'all'; invalidateDerivedCaches();
    try { localStorage.setItem('lumexa_leads_filter', 'all'); } catch (e) { /* ignore */ }
    toast('Switched to All leads so this lead is visible.');
  }
  ui.drawerContactId = id;
  renderAll();
  renderContactDrawer();
}
function renderCommandPalette() {
  const root = document.getElementById('palette-root');
  if (!root) return;
  if (!ui.paletteOpen) { root.innerHTML = ''; return; }
  const items = paletteItems();
  ui.paletteIndex = Math.min(ui.paletteIndex || 0, Math.max(0, items.length - 1));
  let html = '', last = '';
  items.forEach((it, i) => {
    if (it.type !== last) { html += `<div class="crm-pal-sec">${esc(it.type)}</div>`; last = it.type; }
    html += `<button type="button" class="crm-pal-item ${i === ui.paletteIndex ? 'on' : ''}" data-pal-index="${i}"><span class="opacity-60">${it.type === 'Leads' ? svgIcon('users') : '→'}</span><span class="min-w-0 truncate"><b>${esc(it.label)}</b>${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}</span>${it.hint ? `<span class="k kbd">${esc(it.hint)}</span>` : ''}</button>`;
  });
  root.innerHTML = `<div class="crm-pal" data-pal-bg data-testid="command-palette"><div class="crm-pal-box">
      <div class="crm-pal-input">${svgIcon('search')}<input id="palette-input" placeholder="Jump to a lead, a page, or do something…" value="${esc(ui.paletteQuery)}" aria-label="Command" autocomplete="off"/></div>
      <div class="crm-pal-list">${html || '<div class="crm-pal-sec">Nothing matches</div>'}</div>
      <div class="crm-pal-foot"><span><span class="kbd">↑↓</span> move</span><span><span class="kbd">↵</span> open</span><span><span class="kbd">esc</span> close</span></div>
    </div></div>`;
  const input = document.getElementById('palette-input');
  if (input) {
    if (input.focus) { input.focus(); try { input.setSelectionRange(ui.paletteQuery.length, ui.paletteQuery.length); } catch (e) { /* ignore */ } }
    input.addEventListener('input', () => { ui.paletteQuery = input.value; ui.paletteIndex = 0; renderCommandPalette(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { ui.paletteIndex = Math.min(items.length - 1, ui.paletteIndex + 1); renderCommandPalette(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { ui.paletteIndex = Math.max(0, ui.paletteIndex - 1); renderCommandPalette(); e.preventDefault(); }
      else if (e.key === 'Enter') { e.preventDefault(); runPaletteItem(items[ui.paletteIndex]); }
      else if (e.key === 'Escape') { e.preventDefault(); closeCommandPalette(); }
    });
  }
  root.querySelectorAll('[data-pal-index]').forEach(b => b.addEventListener('click', () => runPaletteItem(items[Number(b.getAttribute('data-pal-index'))])));
  root.querySelectorAll('[data-pal-bg]').forEach(b => b.addEventListener('click', e => { if (e.target === b) closeCommandPalette(); }));
}
function runPaletteItem(item) { if (!item) return; closeCommandPalette(); item.run(); }
function openCommandPalette() { if (!ui.currentUser) return; ui.paletteOpen = true; ui.paletteQuery = ''; ui.paletteIndex = 0; renderCommandPalette(); }
function closeCommandPalette() { ui.paletteOpen = false; renderCommandPalette(); }
function closeContactDrawer() {
  ui.drawerContactId = null;
  ui.drawerViewContactId = null;
  ui.communicationHistoryExpanded = false;
  renderContactDrawer();
}
function moveSplitSelection(delta) {
  const list = filterContacts();
  if (!list.length) return;
  const i = list.findIndex(c => c.id === ui.drawerContactId);
  const next = list[Math.max(0, Math.min(list.length - 1, i < 0 ? 0 : i + delta))];
  if (!next || next.id === ui.drawerContactId) return;
  ui.drawerContactId = next.id;
  renderContactDrawer();
  const row = document.querySelector(`#contacts-tbody [data-id="${next.id}"]`);
  if (row && row.scrollIntoView) row.scrollIntoView({ block:'nearest' });
}
function handleGlobalKeydown(e) {
  if (!ui.currentUser || !ui.authReady) return;
  const active = document.activeElement;
  const typing = !!(active && (['INPUT','TEXTAREA','SELECT'].includes(active.tagName) || active.isContentEditable));
  if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === 'k') { e.preventDefault(); if (ui.paletteOpen) closeCommandPalette(); else openCommandPalette(); return; }
  if (ui.paletteOpen) return; // the palette's own input handles its keys
  if (e.key === 'Escape') {
    const modal = document.getElementById('modal-root');
    if (modal && modal.innerHTML) return; // the modal closes itself
    if (typing) { if (active.blur) active.blur(); return; }
    if (ui.drawerContactId && !inlineDrawerHost()) closeContactDrawer();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { const s = document.getElementById('contact-search'); if (s && s.focus) { e.preventDefault(); s.focus(); } return; }
  if (String(e.key).toLowerCase() === 'n' && ['contacts','projects'].includes(ui.page)) { e.preventDefault(); newContact(ui.page === 'projects'); return; }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && ui.page === 'contacts' && isSplitLayout()) { e.preventDefault(); moveSplitSelection(e.key === 'ArrowDown' ? 1 : -1); }
}

function navigateTo(page) {
  if (page !== 'contacts') ui.splitOverride = false;
  ui.page = page;
  ui.navigated = true;
  ui.mobileNavOpen = false;
  renderAll();
  if (ui.page === 'team') loadTeamData();
  if ((ui.page === 'settings' || ui.page === 'sales') && canManagePayroll()) loadTeamData();
  if (ui.page === 'settings') loadGoogleSheetsSyncSetup();
  if (ui.page === 'settings') loadMetaLeadAdsSetup();
}
function bindSidebarHandlers() {
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => navigateTo(el.getAttribute('data-nav')));
  });
  document.querySelectorAll('details[data-nav-group]').forEach(el => {
    el.addEventListener('toggle', () => {
      const open = navGroupOpenState(); open[el.getAttribute('data-nav-group')] = el.open;
      try { localStorage.setItem('lumexa_nav_groups', JSON.stringify(open)); } catch (e) { /* ignore */ }
    });
  });
  document.querySelectorAll('[data-brand]').forEach(el => {
    el.addEventListener('click', () => {
      ui.activeBrand = el.getAttribute('data-brand');
      ui.selectedContactIds.clear();
      renderAll();
    });
  });
  document.querySelectorAll('[data-action]').forEach(el => {
    const a = el.getAttribute('data-action');
    if (a === 'new-lead')      el.addEventListener('click', () => { if (!['contacts','projects'].includes(ui.page)) navigateTo('contacts'); newContact(ui.page === 'projects'); });
    if (a === 'export-backup') el.addEventListener('click', exportBackup);
    if (a === 'import-backup') el.addEventListener('click', importBackup);
    if (a === 'import-missing') el.addEventListener('click', addMissingFromBackup);
    if (a === 'restore-owners') el.addEventListener('click', restoreOwnersFromBackup);
    if (a === 'import-contacts-json') el.addEventListener('click', importContactsFromJson);
    if (a === 'import-xlsx')   el.addEventListener('click', importXlsx);
    if (a === 'find-duplicates') el.addEventListener('click', findDuplicateLeads);
    if (a === 'tidy-phones') el.addEventListener('click', tidyPhoneNumbers);
    if (a === 'pull-cloud')    el.addEventListener('click', () => pullFromBackend(false));
    if (a === 'logout')        el.addEventListener('click', logout);
    if (a === 'toggle-mobile-nav') el.addEventListener('click', () => { ui.mobileNavOpen = !ui.mobileNavOpen; renderAll(); });
    if (a === 'toggle-nav-collapse') el.addEventListener('click', toggleNavCollapsed);
    if (a === 'close-mobile-nav')  el.addEventListener('click', () => { ui.mobileNavOpen = false; renderAll(); });
    if (a === 'toggle-nav-collapse' && !el.__navResizerBound) { el.__navResizerBound = true; bindNavResizer(); }
    if (a === 'open-palette')      el.addEventListener('click', openCommandPalette);
  });
}

function bindPageHandlers() {
  // Top bar — bind ONCE per element (it persists across renderPage calls)
  const sb = document.getElementById('contact-search');
  if (sb && !sb.dataset.bound) {
    sb.dataset.bound = '1';
    let searchTimer = null;
    sb.addEventListener('input', e => {
      ui.search = e.target.value;
      // A bulk selection is tied to what's currently visible — changing what's visible without
      // clearing it risks silently applying a category to leads no longer on screen.
      ui.selectedContactIds.clear();
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(() => ['projects','orders'].includes(ui.page) ? renderPage() : updateContactsList(), 140);
    });
  }
  const leadsFilter = document.getElementById('leads-filter');
  if (leadsFilter && !leadsFilter.dataset.bound) {
    leadsFilter.dataset.bound = '1';
    leadsFilter.addEventListener('change', () => setLeadsFilter(leadsFilter.value));
  }
  const actionStreamPerson = document.getElementById('action-stream-person');
  if (actionStreamPerson && !actionStreamPerson.dataset.bound) {
    actionStreamPerson.dataset.bound = '1';
    actionStreamPerson.addEventListener('change', () => setLeadsFilter(actionStreamPerson.value));
  }
  bindContactsFilterControls();
  const filtersBtn = document.querySelector('[data-action="toggle-filters"]');

  document.querySelectorAll('[data-action="cleanup-blank-contacts"]').forEach(el => el.addEventListener('click', cleanupBlankContacts));

  document.querySelectorAll('[data-action="tracker-view-print-order"]').forEach(el => el.addEventListener('click', () => {
    ui.printOrderId = el.getAttribute('data-order-id');

    renderAll(); // the headline text (list vs. single-order view) lives in the topbar, not #page-root
  }));

    ui.printOrderId = null; ui.printOrderContactId = null; renderAll();
  }));
  document.querySelectorAll('[data-action="print-order"]').forEach(el => el.addEventListener('click', printOrder));

  // Workspace appearance and optional modules
  document.querySelectorAll('[data-workspace-cc]').forEach(el => el.addEventListener('change', () => {
    state.workspaceSettings.defaultCountryCode = String(el.value || '1');
    saveState(); renderAll(); toast(`Phone numbers without a code are now read as +${state.workspaceSettings.defaultCountryCode}.`);
  }));
  document.querySelectorAll('[data-workspace-field]').forEach(el => {
    const saveWorkspaceField = () => {
      const key = el.getAttribute('data-workspace-field');
      const fallbacks = { workspaceName:'Lumexa', leadLabel:'Contact', cloudDriveUrl:'', googleSheetsSpreadsheetId:'', googleSheetsSheetName:'Sheet1', googleSheetsWebAppUrl:'', timeZone: DEFAULT_TIME_ZONE };
      state.workspaceSettings[key] = key === 'cloudDriveUrl' ? normalizeHttpUrl(el.value) : (el.value.trim() || fallbacks[key] || '');
      saveState(); renderAll();

      el.addEventListener('input', () => {

        ui.googleSheetsSettingsTimer = setTimeout(async () => {

    state.workspaceSettings.accent = el.getAttribute('data-workspace-accent');

      else {

        savedColor = result.user.color;
      }
      // This is a personal profile field, not CRM data — it lives on the user record via its own
      // endpoint, not in `state`, so it doesn't go through saveState()/scheduleSync() at all.
      ui.currentUser = { ...ui.currentUser, color: savedColor };

let printTextareaRestore = [];

function expandReportNotesForPrint() {
  const textareas = [...document.querySelectorAll('#printable-area textarea')];
  if (!textareas.length || printTextareaRestore.length) return;
  printTextareaRestore = textareas.map(textarea => {
    const printValue = document.createElement('div');
    printValue.className = 'print-notes-value';
    printValue.style.display = 'none';
    printValue.textContent = textarea.value || ' ';
    textarea.insertAdjacentElement('afterend', printValue);
    textarea.dataset.printExpanded = 'true';
    return {textarea, printValue};
  });
}

function restoreReportNotesAfterPrint() {
  printTextareaRestore.forEach(({textarea,printValue}) => {
    printValue.remove();
    delete textarea.dataset.printExpanded;
  });
  printTextareaRestore = [];
}

function printReport() {
  expandReportNotesForPrint();
  requestAnimationFrame(() => window.print());
}

function applyPrintScale(scale) {
  ui.printScale = scale;
  const styleEl = document.getElementById('print-scale-style');
  if (styleEl) styleEl.textContent = `@media print { #printable-area { zoom: ${scale}; } }`;
}

window.addEventListener('beforeprint', expandReportNotesForPrint);
window.addEventListener('afterprint', restoreReportNotesAfterPrint);

  });
  // "Mark sold" is recording a payment: the person enters the % of the sale that was paid. The
  // commission on that payment is locked right here (rate × amount) and accrues in the month
  // the payment landed; the remainder stays visible as outstanding until 100% is in.
  document.querySelectorAll('[data-action="record-payment"]').forEach(el => {
    el.addEventListener('click', () => {
      const s = (c.sales||[]).find(x => x.id === el.getAttribute('data-id'));
      if (!s) return;
      const paidPct = salePaidPercent(s);
      const remaining = Math.max(0, round2(100 - paidPct));
      const today = localDateKey(new Date());
      openModal({
        title: paidPct > 0 ? 'Record another payment' : 'Record a payment',
        subtitle: `${fmtMoney(s.amount)} sale${paidPct ? ` · ${paidPct}% (${fmtMoney(salePaidAmount(s))}) paid so far` : ''}. Commission on this payment counts in the month it was paid.`,
        fields: [
          { key:'percent', label:'Payment (% of the sale)', type:'number', step:'0.01', min:0, value: remaining, help:`${remaining}% (${fmtMoney(round2(Number(s.amount || 0) * remaining / 100))}) is outstanding. Enter 100 for payment in full.` },
          { key:'date', label:'Paid on', type:'date', value: today },
          { key:'note', label:'Note', type:'text', placeholder:'e.g. deposit, second installment, final balance' },
        ],
        submitLabel: 'Record payment',
        onSubmit: v => {
          const pct = round2(Number(v.percent || 0));
          if (!(pct > 0)) { toast('Enter the percentage that was paid.'); return false; }
          if (pct > remaining + 0.005) { toast(`Only ${remaining}% is outstanding on this sale.`); return false; }
          if (!v.date) { toast('Choose the date the payment was received.'); return false; }
          s.ownerId = s.ownerId || ownerIdAtDate(c, v.date);
          // Credit the lead's owner, not whoever is entering the payment (a manager reconciling
          // payments must not take a teammate's commission).
          s.createdByUserId = s.createdByUserId || s.ownerId || ui.currentUser?.id || '';
          const rate = Number(payPlanFor(s.createdByUserId || s.ownerId).commissionRate || 0);
          const amount = round2(Number(s.amount || 0) * pct / 100);
          s.payments = Array.isArray(s.payments) ? s.payments : [];
          s.payments.push({ id: cryptoId(), date: v.date, percent: pct, amount, note: (v.note || '').trim(), commissionRate: rate, commissionAmount: round2(amount * rate), recordedByUserId: ui.currentUser?.id || '' });
          recomputeSaleFromPayments(s);

      saveState(); renderContactDrawer();
    });
  });
  document.querySelectorAll('[data-action="decline-sale"]').forEach(el => {
    el.addEventListener('click', () => {
      const s = (c.sales||[]).find(x => x.id === el.getAttribute('data-id'));
      if (!s) return;
      if (salePayments(s).length) { toast('Money has already been received on this sale — remove the recorded payments first.'); return; }
      const today = localDateKey(new Date());
      const inSet = !!s.optionGroupId;
      openModal({
        title:'Record client decision',
        subtitle: inSet ? 'This estimate is one option in a set. Close it as not chosen when the client went with another option (it is archived, not counted as a declined deal), or as declined when the whole scope is off.' : 'This closes the estimate as not sold and keeps the reason in your monthly statistics.',
        fields:[
          ...(inSet ? [{ key:'decision', label:'What happened', type:'select', value:'not_selected', options:[{ value:'not_selected', label:'Not chosen — client picked another option from this set' }, { value:'declined', label:'Client declined this estimate' }] }] : []),
          {key:'declinedOn',label: inSet ? 'Closed on' : 'Declined on',type:'date',value:today},
          {key:'declineReason',label: inSet ? 'Reason (optional for not chosen)' : 'Reason client did not proceed',type:'textarea',rows:3,placeholder:'e.g. price, timing, chose another supplier'},
        ],
        submitLabel:'Save decision',
        onSubmit: values => {
          const reason = (values.declineReason || '').trim();
          const notChosen = inSet && values.decision !== 'declined';
          if (!values.declinedOn) { toast('Choose the date.'); return false; }
          if (!reason && !notChosen) { toast('Add the reason the client did not proceed.'); return false; }
          s.status = notChosen ? 'not_selected' : 'declined'; s.paidOn=null; s.declinedOn=values.declinedOn;
          s.declineReason = reason || (notChosen ? 'Client chose another option' : '');
          saveState(); renderContactDrawer(); toast(notChosen ? 'Option archived as not chosen.' : 'Client decision recorded.');
        },

  });
  document.querySelectorAll('[data-action="delete-sale"]').forEach(el => {
    el.addEventListener('click', () => { if (!confirm('Delete this estimate / sale?')) return; recordDeletion(el.getAttribute('data-id')); c.sales = (c.sales||[]).filter(x => x.id !== el.getAttribute('data-id')); tidyOptionGroups(c); saveState(); renderContactDrawer(); });
  });
  // Owner-only fix for a sale that was logged or marked sold by the wrong person (e.g. a
  // manager entering it on a teammate's behalf) — corrects who gets commission credit without
  // touching the lead's actual ownership.
  document.querySelectorAll('[data-action="reassign-sale-credit"]').forEach(el => {
    el.addEventListener('click', () => {
      const s = (c.sales || []).find(x => x.id === el.getAttribute('data-id'));
      if (!s) return;
      const currentId = s.createdByUserId || s.ownerId || '';
      openModal({
        title: 'Reassign commission credit',
        subtitle: `Currently credited to ${esc(userName(currentId) || 'nobody')}. This only changes who gets paid for this sale — it does not change the lead's owner.`,
        fields: [
          { key:'userId', label:'Credit this sale to', type:'select', value: currentId, options: rosterUsers().map(u => ({ value:u.id, label:u.name || u.email || 'Unnamed user' })) },
        ],
        submitLabel: 'Reassign',
        onSubmit: v => {

          s.ownerId = v.userId;

          if (Array.isArray(s.payments) && s.payments.length) {
            for (const pm of s.payments) { pm.commissionRate = rate; pm.commissionAmount = round2(Number(pm.amount || 0) * rate); }

  document.querySelectorAll('[data-action="add-order"]').forEach(el => {

  document.querySelectorAll('[data-action="edit-order"]').forEach(el => {

        title: `Edit order${o.orderNumber ? ` ${o.orderNumber}` : ''}`,

        submitLabel: 'Save order',

        },

  document.querySelectorAll('[data-action="delete-order"]').forEach(el => {

  document.querySelectorAll('[data-action="toggle-order-flag"]').forEach(el => {

  document.querySelectorAll('[data-sale-edit-field="status"]').forEach(el => {
    el.addEventListener('change', () => {

      const paidWrap = document.querySelector(`[data-paidon-wrap="${id}"]`);
      const declinedWrap = document.querySelector(`[data-declined-wrap="${id}"]`);
      if (paidWrap) paidWrap.setAttribute('data-hidden', el.value === 'paid' ? 'false' : 'true');

  });
  document.querySelectorAll('[data-action="save-edit-sale"]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-id');
      const s = (c.sales || []).find(x => x.id === id);
      if (!s) return;
      const changes = {};
      document.querySelectorAll(`[data-sale-edit-field][data-id="${id}"]`).forEach(inp => {
        const key = inp.getAttribute('data-sale-edit-field');
        changes[key] = ['amount','shipping','installation'].includes(key) ? round2(Number(inp.value || 0)) : inp.value;
      });
      if (!isFinite(changes.amount) || changes.amount <= 0) { toast('Enter a positive amount.'); return; }
      if (!changes.date) { toast('Choose the date the estimate was logged.'); return; }
      const hasPayments = Array.isArray(s.payments) && s.payments.length > 0;
      if (hasPayments) { delete changes.status; delete changes.paidOn; delete changes.declinedOn; delete changes.declineReason; }
      if (changes.status === 'declined' && !(changes.declineReason || '').trim()) { toast('Add the reason the client did not proceed.'); return; }
      const optionOf = changes.optionOf; delete changes.optionOf;
      if ('projectId' in changes) changes.projectId = findProject(c, changes.projectId) ? changes.projectId : '';
      Object.assign(s, changes);
      if (optionOf !== undefined) applyOptionChoice(c, s, optionOf);
      if (s.status === 'not_selected' && !s.optionGroupId && !hasPayments) s.status = 'declined';
      if (hasPayments) {
        // Payments are percentages, so a corrected sale amount re-derives every payment's dollar
        // value and its locked commission (rate unchanged) — the same "track the corrected
        // amount" rule the legacy lock below follows.
        recomputeSaleFromPayments(s);
      } else if (s.status === 'paid') {
        s.paidOn = s.paidOn || s.date || localDateKey(new Date());
        s.declinedOn = null; s.declineReason = '';
        // Commission is locked in as a fixed dollar amount the moment a sale is marked sold, so a
        // later pay-plan rate change never silently rewrites a historical payout. But that lock
        // must still track a corrected sale amount edited here afterward — otherwise a $16,700
        // estimate fixed to its real $18,900 value keeps paying commission on the old figure
        // forever. Keep whichever rate was already locked in (or lock in today's rate, for a sale
        // reaching "paid" for the first time through this form rather than the "Mark sold" toggle),
        // and recompute the dollar amount from the current (possibly corrected) sale amount.
        if (s.commissionRate === undefined || s.commissionRate === null) {
          s.commissionRate = Number(payPlanFor(s.createdByUserId || s.ownerId).commissionRate || 0);
        }
        s.commissionAmount = Number(s.amount || 0) * Number(s.commissionRate || 0);
        closeOtherOptions(c, s, s.paidOn);
      } else if (s.status === 'declined' || s.status === 'not_selected') {
        s.paidOn = null;
        s.declinedOn = s.declinedOn || localDateKey(new Date());
        s.declineReason = (s.declineReason || '').trim() || (s.status === 'not_selected' ? 'Client chose another option' : '');
      } else {
        s.paidOn = null; s.declinedOn = null; s.declineReason = '';
      }
      ui.editingSaleId = null;
      saveState(); renderContactDrawer();
      toast('Estimate updated.');
    });
  });


  // Advertisement campaign source toggle
  const campaignToggle = document.querySelector('[data-action="toggle-campaign-lead"]');
  if (campaignToggle) campaignToggle.addEventListener('click', () => {
    const makingCampaign = !isCampaignLead(c);
    c.leadSource = makingCampaign ? 'Campaign' : 'Regular';
    c.campaignName = typeof c.campaignName === 'string' ? c.campaignName : '';
    saveState();
    renderPage();
    renderContactDrawer();
    toast(makingCampaign ? 'Marked as an advertisement campaign lead.' : 'Moved back to regular leads.');
  });

  // Delete contact
  const btnDel = document.querySelector('[data-action="delete-contact"]');
  if (btnDel) btnDel.addEventListener('click', () => {
    if (!confirm(`Delete contact "${c.name}"? This cannot be undone.`)) return;
    // Contacts holding financial records are deliberately kept by the backend (it re-adds them),
    // so only tombstone the ones that will actually stay deleted.
    if (!(c.sales || []).length) recordDeletion(c.id);
    state.contacts = state.contacts.filter(x => x.id !== c.id);
    ui.drawerContactId = null;
    saveState(); renderAll();
  });
}

function newContact(asProject = false) {
  const createdAt = new Date().toISOString();
  const ownerId = ui.currentUser?.id || '';
  const c = { id: cryptoId(), name: asProject ? 'New project' : 'New contact', brand: activeBrand(), pointOfContact:'', email:'', phone:'', company:'', role:'', website:'', status:'Warm', statusReason:'', leadType:asProject?'Project':'Lead', projectStage:'Planning', projectLabels:[], projects: asProject ? [{ id: cryptoId(), name:'', stage: (asProject && ui.newProjectStage) || 'Planning', labels:[], notes:'', nextStep:'', nextActionDue:'', createdAt, updatedAt:'' }] : [], leadSource:'Regular', campaignName:'', category:'', region:'', regionNote:'', followUpMode:'standard', nextStep:'', nextActionDue:'', onHoldUntil:'', tags:[], notes:'', subcontacts:[], meetings:[], calls:[], renders:[], sales:[], orders:[], ownerId, ownershipHistory: ownerId ? [{ id:cryptoId(), userId:ownerId, from:localDateKey(createdAt), to:null }] : [], createdAt };
  state.contacts = [c, ...state.contacts];

  saveState(); renderAll(); renderContactDrawer();
}

/* A never-touched "New contact"/"New project" draft: still has its default name and every
   editable field empty. Used to clean up duplicates from the double-add glitch. */
function isBlankContact(c) {
  if (!c || (c.name !== 'New contact' && c.name !== 'New project')) return false;
  const emptyText = ['pointOfContact','email','phone','company','role','website','statusReason','nextStep','notes','campaignName']
    .every(key => !String(c[key] || '').trim());
  const emptyArrays = ['tags','subcontacts','meetings','calls','renders','renderRequests','orders','sales','projectLabels','projects']
    .every(key => !(c[key] && c[key].length));
  const untouchedDefaults = (c.status || 'Warm') === 'Warm' && (c.leadSource || 'Regular') === 'Regular'
    && !c.nextActionDue && !c.onHoldUntil && !c.category;
  return emptyText && emptyArrays && untouchedDefaults;
}

function cleanupBlankContacts() {
  const blanks = visibleContacts().filter(isBlankContact);
  if (!blanks.length) { toast('No empty draft contacts found.'); return; }
  if (!confirm(`Delete ${blanks.length} empty draft contact${blanks.length===1?'':'s'} with no information entered? This cannot be undone.`)) return;
  const blankIds = new Set(blanks.map(item => item.id));
  recordDeletion(...blankIds);
  state.contacts = state.contacts.filter(item => !blankIds.has(item.id));
  if (blankIds.has(ui.drawerContactId)) ui.drawerContactId = null;
  saveState(); renderAll();
  toast(`Deleted ${blanks.length} empty draft contact${blanks.length===1?'':'s'}.`);
}

function editTask(id) {
  const t = state.tasks.find(x => x.id === id); if (!t) return;
  if (t.kind === 'warm-followup') {
    openModal({
      title: 'Edit follow-up automation',
      subtitle: 'How many days without any contact before a lead is flagged for follow-up.',
      fields: [
        { key:'days', label:'Days without contact', type:'number', min:1, value: String(t.thresholdDays || 7) },
        { key:'enabled', label:'Status', type:'select', value: t.enabled ? 'on' : 'off', options:[{value:'on',label:'Enabled'},{value:'off',label:'Disabled'}] },
      ],
      submitLabel: 'Save',
      onSubmit: (v) => {
        const n = Math.max(1, Math.min(365, parseInt(v.days, 10) || 7));
        t.thresholdDays = n;
        t.enabled = v.enabled === 'on';
        t.lastResult = null;
        saveState(); renderPage();
        toast(`Threshold set to ${n} days. Click Run to refresh the list.`);
      },
    });
    return;
  }
  if (t.kind === 'no-response-recommendation') {
    openModal({
      title: 'Edit no-response recommendation',
      subtitle: 'How many outbound calls, emails or WhatsApp messages without an incoming response should trigger a recommendation.',
      fields: [
        { key:'attempts', label:'Unanswered reach-outs', type:'number', min:1, value: String(t.thresholdAttempts || 7) },
        { key:'enabled', label:'Status', type:'select', value: t.enabled ? 'on' : 'off', options:[{value:'on',label:'Enabled'},{value:'off',label:'Disabled'}] },
      ],
      submitLabel: 'Save',
      onSubmit: (v) => {
        const n = Math.max(1, Math.min(100, parseInt(v.attempts, 10) || 7));
        t.thresholdAttempts = n;
        t.enabled = v.enabled === 'on';
        t.lastResult = null;
        saveState(); renderPage();
        toast(`Recommendation threshold set to ${n} unanswered reach-outs.`);
      },
    });
    return;
  }
  toast(`This task isn't editable yet — ping me to add edit support.`);
}

    subtitle: 'Choose a date to see only the contacts you called, emailed or messaged that day.',

      { key:'date', label:'Contact date', type:'date', value: t.lastResult?.selectedDate || localDateKey(new Date()) },
    ],
    submitLabel: 'Show contacts',
    onSubmit: (v) => {
      if (!v.date) { toast('Choose a date first.'); return false; }
      runTask(id, { date: v.date });
    },
  });
}

function invalidateNoResponseResult() {
  for (const task of (state.tasks || [])) {
    if (task.kind === 'no-response-recommendation') task.lastResult = null;
  }
}

function unansweredOutreach(c) {
  const logs = (c.calls || []).filter(log => log.timestamp).slice().sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
  let attempts = 0;
  let last = null;
  for (const log of logs) {
    if (isResponseTouch(log)) {
      attempts = 0;
      last = null;
    } else if (log.direction !== 'incoming') {
      attempts++;
      last = log;
    }
  }
  return { attempts, last };
}

function applyNoResponseRecommendation(id, status, attempts) {
  const c = getContact(id);
  if (!c || !['On Hold', 'Inactive'].includes(status)) return;
  c.status = status;
  c.statusReason = `${attempts} unanswered outreach attempt${attempts===1?'':'s'} — set from no-response recommendation.`;
  c.statusHistory = c.statusHistory || [];
  c.statusHistory.push({ status, changedAt: new Date().toISOString() });
  for (const task of state.tasks) if (task.kind === 'no-response-recommendation') task.lastResult = null;
  saveState(); renderAll();
  toast(`${c.name || 'Contact'} marked ${status}.`);
}

function runTask(id, options = {}) {
  const t = state.tasks.find(x => x.id === id); if (!t) return;
  const now = new Date();
  const nowIso = now.toISOString();
  t.lastRun = nowIso;

  if (t.kind === 'warm-followup') {
    const threshold = Math.max(1, Number(t.thresholdDays || 7));
    const cutoffMs = now.getTime() - threshold * 86400000;
    const STATUS_RANK = { Hot: 0, Warm: 1, Cold: 2 };
    const picks = [];
    for (const c of visibleContacts()) {
      // Project leads are included: the project tracker shows their activity, but a project that has
      // gone quiet still needs a follow-up nudge here like any other lead.
      const s = c.status || 'Cold';
      if (!(s in STATUS_RANK)) continue; // skip Inactive
      // Latest touchpoint = latest comm log entry OR meeting createdAt
      let lastTs = null, lastChannel = '';
      for (const k of (c.calls || [])) {
        if (k.timestamp && (!lastTs || k.timestamp > lastTs)) { lastTs = k.timestamp; lastChannel = k.channel || 'call'; }
      }
      for (const m of (c.meetings || [])) {
        const mt = m.createdAt || m.scheduledOn;
        if (mt && (!lastTs || mt > lastTs)) { lastTs = mt; lastChannel = 'meeting'; }
      }
      const lastMs = lastTs ? new Date(lastTs).getTime() : 0;
      if (!lastTs || lastMs < cutoffMs) {
        const daysSince = lastTs ? Math.floor((now.getTime() - lastMs) / 86400000) : null;
        picks.push({
          id: c.id,
          name: c.name || '—',
          status: s,
          pointOfContact: c.pointOfContact || '',
          phone: c.phone || '',
          email: c.email || '',
          nextStep: c.nextStep || '',
          daysSince,
          lastChannel,
          lastTs,
          isProject: isProjectLead(c),
          ownerId: currentOwnerId(c),
        });
      }
    }
    // Sort: never-contacted first (subgrouped Hot > Warm > Cold), then overdue rows
    // ordered by status rank then by daysSince desc.
    picks.sort((a, b) => {
      const aNever = a.daysSince === null ? 0 : 1;
      const bNever = b.daysSince === null ? 0 : 1;
      if (aNever !== bNever) return aNever - bNever;
      const sa = STATUS_RANK[a.status], sb = STATUS_RANK[b.status];
      if (sa !== sb) return sa - sb;
      return (b.daysSince || 0) - (a.daysSince || 0);
    });
    t.lastResult = { v3: true, generatedAt: nowIso, contacts: picks };
    saveState(); renderPage();
    const neverN = picks.filter(p => p.daysSince === null).length;
    toast(`Found ${picks.length} contact${picks.length===1?'':'s'} (${neverN} never contacted · ${picks.length - neverN} overdue).`);
    return;
  }

  if (t.kind === 'project-tracker') {
    const projects = [];
    for (const c of visibleContacts()) {
      if (!isProjectLead(c)) continue;
      const activities = projectActivities(c);
      projects.push({
        id: c.id,
        name: c.name || '—',
        status: c.status || 'Cold',
        pointOfContact: c.pointOfContact || '',
        nextStep: c.nextStep || '',
        lastActivity: activities[0] || null,
        logs: activities.slice(0, 5),
        ownerId: currentOwnerId(c),
      });
    }
    // Most recently active projects first; projects with no activity stay visible at the end.
    projects.sort((a, b) => {
      if (!a.lastActivity && !b.lastActivity) return a.name.localeCompare(b.name);
      if (!a.lastActivity) return 1;
      if (!b.lastActivity) return -1;
      return (b.lastActivity.timestamp || '').localeCompare(a.lastActivity.timestamp || '');
    });
    t.lastResult = { v2: true, generatedAt: nowIso, contacts: projects };
    saveState(); renderPage();
    const active = projects.filter(p => p.lastActivity).length;
    toast(`${projects.length} project lead${projects.length===1?'':'s'} · ${active} with activity logged.`);
    return;
  }

  if (t.kind === 'no-response-recommendation') {
    const threshold = Math.max(1, Number(t.thresholdAttempts || 7));
    const picks = [];
    for (const c of visibleContacts()) {
      const status = c.status || 'Cold';
      if (isProjectLead(c) || status === 'Inactive' || status === 'On Hold') continue;
      const outreach = unansweredOutreach(c);
      if (outreach.attempts < threshold || !outreach.last) continue;
      const channel = outreach.last.channel === 'email' ? 'Email' : (outreach.last.channel === 'whatsapp' ? 'WhatsApp' : 'Call');
      picks.push({
        id: c.id,
        name: c.name || '—',
        pointOfContact: c.pointOfContact || '',
        status,
        attempts: outreach.attempts,
        lastChannel: `${channel} · Out`,
        lastTimestamp: outreach.last.timestamp,
        ownerId: currentOwnerId(c),
      });
    }
    picks.sort((a, b) => b.attempts - a.attempts || (b.lastTimestamp || '').localeCompare(a.lastTimestamp || ''));
    t.lastResult = { v2: true, generatedAt: nowIso, contacts: picks };
    saveState(); renderPage();
    toast(`${picks.length} lead${picks.length===1?'':'s'} reached ${threshold} unanswered outreach attempts.`);
    return;
  }

  if (t.kind === 'contacted-on-date') {
    const selectedDate = options.date;
    if (!selectedDate) return;
    const startIso = dayStart(selectedDate).toISOString(), endIso = dayEnd(selectedDate).toISOString();
    const picks = [];
    for (const c of reportContacts()) {
      const touches = (c.calls || []).filter(log => log.timestamp && log.timestamp >= startIso && log.timestamp <= endIso)
        .map(log => ({ channel: log.channel || 'call', direction: log.direction || 'outgoing', outcome:log.outcome || '', timestamp: log.timestamp }));
      if (!touches.length) continue;
      touches.sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
      picks.push({ id:c.id, name:c.name || '—', status:c.status || 'Cold', pointOfContact:c.pointOfContact || '', touches, latest:touches[touches.length-1].timestamp, ownerId: currentOwnerId(c) });
    }
    picks.sort((a, b) => (b.latest || '').localeCompare(a.latest || ''));
    t.lastResult = { v2: true, generatedAt: nowIso, selectedDate, contacts: picks };
    saveState(); renderPage();
    toast(`${picks.length} contact${picks.length===1?'':'s'} contacted on ${fmtDate(`${selectedDate}T12:00:00`)}.`);
    return;
  }

  if (t.kind === 'contacted-today') {
    const sIso = dayStart(localDateKey(now)).toISOString(), eIso = dayEnd(localDateKey(now)).toISOString();
    // Personal by design: the run is always for the person clicking Run, and its result is kept
    // per person (below) so teammates running the same automation never see each other's list.
    const userId = ui.currentUser?.id || '';
    const resultKey = contactedTodayResultKey();
    const todayKey = localDateKey(now);
    const picks = [];
    for (const c of reportContacts()) {
      if (userId && ownerIdAtDate(c, todayKey) !== userId) continue;
      const touches = [];
      for (const k of (c.calls || [])) {
        const ts = k.timestamp;
        if (ts && ts >= sIso && ts <= eIso) {
          touches.push({ channel: k.channel || 'call', direction: k.direction || 'outgoing', outcome:k.outcome || '', timestamp: ts });
        }
      }
      if (touches.length) {
        touches.sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
        picks.push({
          id: c.id,
          name: c.name || '—',
          status: c.status || 'Cold',
          pointOfContact: c.pointOfContact || '',
          phone: c.phone || '',
          touches,
          latest: touches[touches.length - 1].timestamp,
          ownerId: userId || ownerIdAtDate(c, todayKey),
        });
      }
    }
    picks.sort((a, b) => (b.latest || '').localeCompare(a.latest || ''));
    t.resultsByUser = (t.resultsByUser && typeof t.resultsByUser === 'object') ? t.resultsByUser : {};
    t.resultsByUser[resultKey] = { v2: true, generatedAt: nowIso, contacts: picks };
    t.lastResult = null; // legacy shared slot — no longer read for this automation
    saveState(); renderPage();
    let calls = 0, emails = 0, dms = 0;
    for (const p of picks) for (const tch of p.touches) {
      if (tch.channel === 'email') emails++; else if (tch.channel === 'whatsapp') dms++; else calls++;
    }
    toast(`${picks.length} contact${picks.length===1?'':'s'} contacted today · ${calls} calls · ${emails} emails · ${dms} WhatsApp.`);
    return;
  }

  // Unknown kinds — shouldn't happen now, but graceful no-op
  saveState(); renderPage();
  toast(`This task isn't wired up yet — ping me to code its logic.`);
}
function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  recordDeletion(id);
  state.tasks = state.tasks.filter(x => x.id !== id);
  saveState(); renderPage();
}

/* ----------------- Backup / Import ----------------- */
function exportBackup() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[T:]/g, '-');
  a.href = url; a.download = `lumexa-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Backup downloaded.');
}
function importBackup() {
  if (!canManageUsers()) { toast('Your role cannot import a backup.'); return; }
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json,.json';
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.contacts)) throw new Error('Invalid backup format');
        if (cloudMode()) { cloudImportBackup(parsed); return; }
        if (!confirm(`Restore from this backup (${parsed.contacts.length} contacts)? Anything in it that is missing here is added back; nothing currently in the CRM is removed.`)) return;
        // Union, not replace: every other browser merges additively, so a replace could never
        // hold anyway — and additive means a wrong file can't wipe anything.
        const restored = threeWayMerge({}, state, mergeWithDefaults(parsed));
        reconcileInPlace(state, mergeWithDefaults(restored));
        afterStateMerged();
        saveState(); renderAll();
        toast('Backup restored — missing records were added back.');
      } catch(e) { alert('Could not import backup: ' + e.message); }
    };
    reader.readAsText(f);
  };
  input.click();
}
/* One-time bulk import of a JSON array of already-Lumexa-shaped contact objects (produced by an
   external transform, e.g. migrating a whole other CRM's export). Distinct from importXlsx(),
   which maps a flat spreadsheet row-by-row — this expects the richer shape (nested calls/
   meetings/sales/etc.) that a one-off migration script already built. Any string field valued
   exactly "PLACEHOLDER_OWNER_ID" is replaced with a teammate the owner picks at import time, so
   the transform script doesn't need to know real user ids in advance. Owner/boss only. */
function mergeImportedContactExtras(target, incoming) {
  for (const f of ['sales', 'meetings', 'calls']) {
    if (Array.isArray(incoming[f]) && incoming[f].length) target[f] = (target[f] || []).concat(incoming[f]);
  }
  const incomingNotes = incoming.notes ? String(incoming.notes).trim() : '';
  if (incomingNotes) {
    const existingNotes = target.notes ? String(target.notes).trim() : '';
    if (!existingNotes.includes(incomingNotes)) target.notes = existingNotes ? `${existingNotes}\n\n${incomingNotes}` : incomingNotes;
  }
}
function importContactsFromJson() {
  if (!canManageUsers()) { toast('Your role cannot do this.'); return; }
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json,.json';
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      let raw;
      try {
        raw = JSON.parse(reader.result);
        if (!Array.isArray(raw)) throw new Error('Expected a JSON array of contact objects.');
      } catch (e) { alert('Could not read this file: ' + e.message); return; }
      const asText = JSON.stringify(raw);
      const needsOwner = asText.includes('PLACEHOLDER_OWNER_ID');
      const finish = (ownerId) => {
        const withOwner = (ownerId ? JSON.parse(asText.split('PLACEHOLDER_OWNER_ID').join(ownerId)) : raw).filter(c => c && typeof c === 'object');
        for (const c of withOwner) { if (c.phone) c.phone = formatPhone(c.phone); if (c.email) c.email = String(c.email).trim(); }
        // A match (email, phone digits or name+company) never discards data: the matched lead
        // keeps everything and gains the file's notes, meetings, calls and any blank details.
        reviewImportDuplicates({
          incoming: withOwner, title: `Import ${withOwner.length} contact${withOwner.length === 1 ? '' : 's'} from ${f.name}`,
          apply: (toAdd, merged) => {
            state.contacts = state.contacts.concat(toAdd);
            saveState(); renderAll();
            toast(`Imported ${toAdd.length} contact${toAdd.length===1?'':'s'}${merged ? `, merged ${merged}` : ''}.`);
          },
        });
      };
      if (!needsOwner) { finish(null); return; }
      openModal({
        title: 'Who owns these contacts?',
        subtitle: 'This import needs an owner assigned before it can be added to the CRM.',
        fields: [
          { key:'ownerId', label:'Assign to', type:'select', value: ui.currentUser?.id || '', options: rosterUsers().map(u => ({ value:u.id, label:u.name || u.email || 'Unnamed user' })) },
        ],
        submitLabel: 'Import',
        onSubmit: v => {
          if (!v.ownerId) { toast('Choose a teammate.'); return false; }
          finish(v.ownerId);
        },
      });
    };
    reader.readAsText(f);
  };
  input.click();
}
function importXlsx() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.xlsx,.xls,.csv';
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
        if (rows.length === 0) { toast('No rows found.'); return; }
        const mapped = rows.map(r => {
          const lower = {};
          Object.keys(r).forEach(k => lower[k.toLowerCase().trim()] = r[k]);
          const pick = (...keys) => { for (const k of keys) if (lower[k] !== undefined && lower[k] !== '') return String(lower[k]).trim(); return ''; };
          const status = (pick('status') || 'Warm').trim();
          const norm = ['Hot','Warm','Cold','On Hold','Inactive'].find(s => s.toLowerCase() === status.toLowerCase()) || 'Warm';
          const rawLeadType = pick('lead type','leadtype','contact type','type','category');
          const leadType = /project/i.test(rawLeadType) || /^project$/i.test(status) ? 'Project' : 'Lead';
          const importedStage = pick('project stage','projectstage');
          const projectStage = PROJECT_STAGES.find(stage => stage.id.toLowerCase() === importedStage.toLowerCase())?.id || normalizeStageId(importedStage);
          const importedLabels = pick('project labels','projectlabels').split(',').map(label => label.trim());
          const projectLabels = importedLabels.filter(label => PROJECT_LABELS.includes(label));
          const importedProjectName = pick('project name','projectname').trim();
          const rawLeadSource = pick('lead source','source','source type','acquisition source','advertisement','ad lead');
          const campaignName = pick('campaign name','campaign','advertisement campaign','ad campaign');
          const leadSource = campaignName || /(campaign|advert|facebook|instagram|meta|google.?ads?)/i.test(rawLeadSource) ? 'Campaign' : 'Regular';
          return {
            id: cryptoId(),
            brand: activeBrand(),
            name: pick('name','full name','contact','contact name'),
            pointOfContact: pick('point of contact','poc','contact person'),
            email: pick('email','e-mail'),
            phone: formatPhone(pick('phone','mobile','phone number','tel','number')),
            company: pick('company','organization','organisation') || pick('name'),
            role: pick('role','title','position','role in the company'),
            website: pick('website','url','site'),
            status: norm,
            leadType: importedProjectName ? 'Project' : leadType,
            projectStage,
            projectLabels,
            projects: (importedProjectName || leadType === 'Project') ? [{ id: cryptoId(), name: importedProjectName, stage: projectStage, labels: projectLabels, notes: '', createdAt: new Date().toISOString(), updatedAt: '' }] : [],
            leadSource,
            campaignName,
            category: '',
            region: '', regionNote: '',
            followUpMode: 'standard',
            nextActionDue: pick('next action due','next-action due','follow-up due','follow up due','due date'),
            onHoldUntil: pick('on hold follow-up','on hold follow up','on hold until','follow up on','resume follow-up','resume follow up'),
            notes: pick('notes','note'),
            subcontacts: [], meetings: [], calls: [], sales: [],
            ownerId: ui.currentUser?.id || '',
            createdAt: new Date().toISOString(),
          };
        }).filter(c => c.name || c.email || c.phone);
        if (mapped.length === 0) { toast('No usable rows. Expected columns like name/email/phone/company/status.'); return; }
        reviewImportDuplicates({
          incoming: mapped, title: `Import ${mapped.length} lead${mapped.length === 1 ? '' : 's'} from ${f.name}`,
          apply: (toAdd, merged, flagged) => {
            state.contacts = toAdd.concat(state.contacts);
            saveState(); renderAll();
            toast(`Imported ${toAdd.length} lead${toAdd.length === 1 ? '' : 's'}${merged ? `, completed ${merged} existing` : (flagged && toAdd.length < mapped.length ? `, skipped ${mapped.length - toAdd.length} duplicate${mapped.length - toAdd.length === 1 ? '' : 's'}` : '')}.`);
          },
        });
      } catch(err) { alert('Could not import sheet: ' + err.message); }
    };
    reader.readAsArrayBuffer(f);
  };
  input.click();
}

/* ----------------- xlsx exports ----------------- */
function exportStamp() { return new Date().toISOString().slice(0,19).replace(/[T:]/g,'-'); }
function downloadSheet(filename, rows, sheetName) {
  if (!rows || rows.length === 0) { toast('Nothing to export yet.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Sheet1');
  XLSX.writeFile(wb, filename);
}

function xlsxValue(value) {
  if (Array.isArray(value)) return value.map(xlsxValue).join(' | ');
  if (value && typeof value === 'object') return JSON.stringify(value);
  return value ?? '';
}

function xlsxRecord(record) {
  return Object.fromEntries(Object.entries(record || {}).map(([key, value]) => [key, xlsxValue(value)]));
}

function downloadWorkbook(filename, sheets) {
  const usableSheets = (sheets || []).filter(sheet => Array.isArray(sheet.rows));
  if (!usableSheets.length || usableSheets.every(sheet => sheet.rows.length === 0)) { toast('Nothing to export yet.'); return; }
  const wb = XLSX.utils.book_new();
  for (const sheet of usableSheets) {
    const rows = sheet.rows.length ? sheet.rows : [{ 'No records': '' }];
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, String(sheet.name || 'Sheet').slice(0, 31));
  }
  XLSX.writeFile(wb, filename);
}

/* ---------- Campaign statistics workbook ---------- */
function campaignChannelLabel(log) {
  const channel = String(log?.channel || 'call').toLowerCase();
  return channel === 'email' ? 'Email' : (['whatsapp','wa','dm'].includes(channel) ? 'WhatsApp' : 'Call');
}
function campaignDirectionLabel(log) { return log?.direction === 'incoming' ? 'Incoming' : 'Outgoing'; }
function campaignLogLabel(log) {
  const outcome = callOutcomeLabel(log);
  return `${campaignChannelLabel(log)} · ${campaignDirectionLabel(log)}${outcome ? ` · ${outcome}` : ''}`;
}
function campaignLogsByKeyword(contact, matcher) {
  return (contact.calls || []).filter(log => log.direction !== 'incoming' && matcher.test(String(log.notes || '')));
}
function campaignActivityEvidence(logs) {
  return logs.map(log => `${fmtDateTime(log.timestamp)} — ${campaignLogLabel(log)}${log.notes ? `: ${log.notes}` : ''}`).join('\n');
}
function campaignTranscript(contact) {
  const lines = (contact.calls || []).slice().sort((a,b) => String(a.timestamp || '').localeCompare(String(b.timestamp || ''))).map(log =>
    `${fmtDateTime(log.timestamp)} — ${campaignLogLabel(log)}${isResponseTouch(log) ? ' · response' : ''}${isValuableConversation(log) ? ' · valuable conversation' : ''}${log.notes ? `\n${log.notes}` : ''}`
  );
  const text = lines.join('\n\n');
  // Excel stores at most 32,767 characters in a cell. Keep the useful beginning
  // and make it clear when a very long timeline continues on the Contact log tab.
  return text.length > 30000 ? `${text.slice(0,29930)}\n\n[Timeline continues in the Contact log tab]` : text;
}
function campaignSalesEvidence(contact) {
  return (contact.sales || []).map(sale => {
    const outcomeDate = saleOutcomeDate(sale) || sale.date || '';
    return `${fmtDate(outcomeDate)} — ${sale.description || 'Estimate'} · ${saleStatusLabel(sale)}${sale.amount ? ` · ${fmtMoney(sale.amount)}` : ''}${sale.declineReason ? ` · ${sale.declineReason}` : ''}`;
  }).join('\n');
}
function campaignMeetingEvidence(contact) {
  return (contact.meetings || []).map(meeting =>
    `${fmtDateTime(meeting.scheduledOn || meeting.createdAt)} — ${meeting.completed ? 'Completed' : 'Scheduled'}${meeting.agenda ? ` · ${meeting.agenda}` : ''}`
  ).join('\n');
}
function campaignContactMoment(contact) {
  const logs = contact.calls || [];
  if (!logs.length) return '';
  return logs.slice().sort((a,b) => String(b.timestamp || '').localeCompare(String(a.timestamp || '')))[0]?.timestamp || '';
}
function campaignWorksheet(rows, widths) {
  const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'No records': '' }]);
  if (ws['!ref']) ws['!autofilter'] = { ref: ws['!ref'] };
  if (Array.isArray(widths)) ws['!cols'] = widths.map(wch => ({ wch }));
  return ws;
}
function downloadCampaignWorkbook(filename, sheets) {
  const wb = XLSX.utils.book_new();
  for (const sheet of sheets) {
    XLSX.utils.book_append_sheet(wb, campaignWorksheet(sheet.rows, sheet.widths), String(sheet.name || 'Sheet').slice(0,31));
  }
  XLSX.writeFile(wb, filename);
}

/* ----------------- toast ----------------- */
let toastTimer = null;
function toast(msg) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  root.innerHTML = `<div class="toast" data-testid="toast">${esc(msg)}</div>`;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, 2400);
}

/* ----------------- modal forms ----------------- */
function closeModal() {
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = '';
  document.removeEventListener('keydown', modalKeyHandler);
}
function modalKeyHandler(e) { if (e.key === 'Escape') closeModal(); }
function localDatetimeValue(d) {
  return toLocalInput(d ? new Date(d) : new Date());
}
function openModal({ title, subtitle, fields, submitLabel = 'Save', onSubmit }) {
  const root = document.getElementById('modal-root');
  if (!root) return;
  const fieldHtml = fields.map((f, i) => {
    const attrs = `id="modal-field-${i}" data-modal-field="${esc(f.key)}" data-testid="modal-field-${esc(f.key)}"`;
    let control;
    if (f.type === 'textarea') {
      control = `<textarea class="textarea" rows="${f.rows||3}" ${attrs} placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`;
    } else if (f.type === 'html') {
      control = f.html || '';
    } else if (f.type === 'select') {
      control = `<select class="select" ${attrs}>${(f.options||[]).map(o => `<option value="${esc(o.value)}" ${String(o.value)===String(f.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    } else if (f.type === 'checkbox') {
      control = `<label class="flex items-start gap-2 cursor-pointer rounded-xl border border-sand p-3 bg-paper">
        <input type="checkbox" ${attrs} ${f.value ? 'checked' : ''} style="margin-top:2px"/>
        <span><strong class="text-sm">${esc(f.checkboxLabel || f.label || 'Yes')}</strong>${f.help ? `<small class="block text-xs text-ash mt-1">${esc(f.help)}</small>` : ''}</span>
      </label>`;
    } else {
      const extra = `${f.step?`step="${esc(f.step)}"`:''} ${f.min!=null?`min="${esc(f.min)}"`:''}`;
      control = `<input class="input" type="${f.type||'text'}" ${attrs} value="${esc(f.value??'')}" placeholder="${esc(f.placeholder||'')}" ${extra}/>`;
    }
    return `<div>${f.label && f.type !== 'checkbox'?`<div class="label">${esc(f.label)}</div>`:''}${control}${f.help && f.type !== 'checkbox' ? `<small class="block text-xs text-ash mt-1">${esc(f.help)}</small>` : ''}</div>`;
  }).join('');
  root.innerHTML = `
    <div class="modal-bg" data-modal-close></div>
    <div class="modal-card" data-testid="modal">
      <div class="px-6 pt-5 pb-3 border-b border-sand">
        <h3 class="serif text-2xl">${esc(title)}</h3>
        ${subtitle?`<p class="text-xs text-ash mt-1">${esc(subtitle)}</p>`:''}
      </div>
      <form id="modal-form" class="px-6 py-5 space-y-3">${fieldHtml}</form>
      <div class="px-6 py-4 bg-paper border-t border-sand flex justify-end gap-2">
        <button type="button" class="btn btn-ghost" data-modal-close data-testid="modal-cancel">Cancel</button>
        <button type="submit" form="modal-form" class="btn btn-primary" data-testid="modal-submit">${esc(submitLabel)}</button>
      </div>
    </div>`;
  root.querySelectorAll('[data-modal-close]').forEach(el => el.addEventListener('click', closeModal));
  root.querySelectorAll('[data-action="open-duplicate"]').forEach(el => el.addEventListener('click', () => { const id = el.getAttribute('data-id'); closeModal(); openContactAnywhere(id); }));
  document.addEventListener('keydown', modalKeyHandler);
  document.getElementById('modal-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const values = {};
    root.querySelectorAll('[data-modal-field]').forEach(inp => {
      values[inp.getAttribute('data-modal-field')] = inp.type === 'checkbox' ? inp.checked : inp.value;
    });
    const result = await onSubmit(values);
    if (result !== false) closeModal();
  });
  const first = root.querySelector('[data-modal-field]');
  if (first) setTimeout(() => first.focus(), 30);
}

/* ----------------- icons (inline svg) ----------------- */
function svgIcon(name) {
  const stroke = 'stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"';
