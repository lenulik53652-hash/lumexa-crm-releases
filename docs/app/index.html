function actionBucket(c) {
  // Split into their own sections rather than one ambiguous "Waiting" bucket, so a paused lead
  // doesn't read as merely "handled by someone else" (or get lost in that bucket entirely).
  if (c.status === 'On Hold') return 'onhold';
  if (!c.nextActionDue) return 'unscheduled';
  const diff = dateKeyDiff(localDateKey(new Date()), localDateKey(c.nextActionDue));
  return diff < 0 ? 'overdue' : (diff === 0 ? 'today' : 'upcoming');
}

function renderActionStream() {
  // Personal by design, same as Reports and the Contacted Today automation — the list is one
  // person's own leads, never the whole team's. By default that person is you; picking a
  // teammate (here or in the Contacts lead view) shows their stream instead, so whoever is
  // taking over their leads can see exactly who needs contacting.
  const myId = leadsFilterPersonId();
  const viewingSelf = myId === (ui.currentUser?.id || '');
  const personSelect = `<select id="action-stream-person" class="select" style="width:auto" aria-label="Whose action stream" data-testid="action-stream-person">
      <option value="mine" ${viewingSelf?'selected':''}>My action stream</option>
      ${rosterUsers().filter(u => u.id !== (ui.currentUser?.id || '')).map(u => `<option value="user:${esc(u.id)}" ${!viewingSelf && myId===u.id?'selected':''}>${esc(u.name || u.email || 'Teammate')}’s action stream</option>`).join('')}
    </select>`;
  const records = visibleContacts()
    .filter(c => c.status !== 'Inactive')
    .filter(c => currentOwnerId(c) === myId)
    .slice()
    .sort((a,b) => (a.nextActionDue || '9999-12-31').localeCompare(b.nextActionDue || '9999-12-31'));
  const groups = [
    ['overdue','Overdue','Handle these first.'],
    ['today','Today',viewingSelf ? 'Your current action list.' : 'Due today.'],
    ['upcoming','Upcoming','Already scheduled.'],
    ['onhold','On Hold','Paused for now — revisit when ready.'],
    ['unscheduled','No next action','Decide the next move.'],
  ];
  const weekAgo = Date.now() - 7 * 86400000;
  const recentCalls = visibleContacts().filter(c => currentOwnerId(c) === myId).flatMap(c => (c.calls || []).filter(log =>
    log.channel === 'call' && new Date(log.timestamp || 0).getTime() >= weekAgo
  ));
  const pickedUp = recentCalls.filter(log => log.outcome === 'picked_up').length;
  const unavailable = recentCalls.filter(log => log.outcome === 'unavailable').length;
  return `
    <div class="flex items-end justify-between gap-4 mb-5">
      <div><h2 class="serif text-3xl">${viewingSelf ? 'One list, ordered by urgency' : `${esc(rosterUser(myId)?.name || 'Teammate')}’s action list`}</h2><p class="text-sm text-ash mt-1">${viewingSelf ? 'Complete the current action and set the next task without searching through contact cards.' : 'Their leads, ordered by urgency — what to contact first if you are taking these over.'}</p></div>
      <div class="flex items-center flex-wrap gap-2">
        ${personSelect}
        <span class="action-stat"><strong>${recentCalls.length}</strong> calls · 7 days</span>
        <span class="action-stat"><strong>${pickedUp}</strong> picked up</span>
        <span class="action-stat"><strong>${unavailable}</strong> unavailable</span>
      </div>
    </div>
    <div class="space-y-4">
      ${groups.map(([id,title,copy]) => {
        const list = records.filter(c => actionBucket(c) === id);
        // The rest of the page is ordered by nextActionDue (set up top), but that's blank for On
        // Hold leads — they carry their own date instead, so order this section by that.
        if (id === 'onhold') list.sort((a,b) => (a.onHoldUntil || '9999-12-31').localeCompare(b.onHoldUntil || '9999-12-31'));
        return `<section class="card overflow-hidden action-group">
          <header class="px-5 py-4 bg-paper border-b border-sand flex items-center justify-between">
            <div><h3 class="serif text-2xl">${title}</h3><p class="text-xs text-ash mt-1">${copy}</p></div>
            <span class="chip chip-cold">${list.length}</span>
          </header>
          ${list.length ? `<div class="divide-row">${list.map(c => {
            // On Hold leads carry their own follow-up date (onHoldUntil) separate from
            // nextActionDue — that's the one relevant here, so it needs to show the same way.
            const dueField = id === 'onhold' ? c.onHoldUntil : c.nextActionDue;
            const due = nextActionDueMeta(localDateKey(dueField));
            return `<article class="action-stream-row px-5 py-4">
              <button class="action-complete" data-action="complete-next-action" data-id="${esc(c.id)}" title="Complete and plan the next action">${id === 'unscheduled' ? '+' : '✓'}</button>
              <button class="min-w-0 text-left" data-action="open-contact" data-id="${esc(c.id)}">
                <div class="font-semibold truncate">${esc(c.name || 'Unnamed contact')}</div>
                <div class="text-xs text-ash truncate">${esc(c.company || c.email || 'No company')}</div>
              </button>
              <button class="min-w-0 text-left" data-action="open-contact" data-id="${esc(c.id)}">
                <div class="text-sm font-semibold truncate">${esc(c.nextStep || 'Add the next action')}</div>
                <div class="text-xs ${due?.tone || 'text-ash'} mt-1">${esc(due?.label || copy)}${extractTimeOfDay(dueField) ? ` · ${esc(extractTimeOfDay(dueField))}` : ''}</div>
              </button>
              <div class="flex items-center gap-2 justify-end"><span class="chip chip-${statusSlug(c.status)}">${esc(c.status || 'Cold')}</span><button class="btn btn-ghost" data-action="open-contact" data-id="${esc(c.id)}">Open</button></div>
            </article>`;
          }).join('')}</div>` : `<div class="px-5 py-8 text-sm text-ash">This section is clear.</div>`}
        </section>`;
      }).join('')}
    </div>`;
}

/* ----------------- Contacts ----------------- */
const CONTACT_FILTERS = ['All', 'Hot', 'Warm', 'Cold', 'Projects', 'Campaigns', 'On Hold', 'Inactive'];

function sortContacts(list) {
  const mode = ui.contactsSort || 'default';
  if (mode === 'default') return list;
  const out = list.slice();
  if (mode === 'newest') out.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  else if (mode === 'due') out.sort((a, b) => (localDateKey(a.nextActionDue) || '9999').localeCompare(localDateKey(b.nextActionDue) || '9999'));
  else if (mode === 'name') out.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
  return out;
}
function filterContacts() {
  if (ui.categoryFilter && !['all','none'].includes(ui.categoryFilter) && !(state.leadCategories || []).some(cat => cat.id === ui.categoryFilter)) ui.categoryFilter = 'all';
  const q = (ui.search || '').toLowerCase().trim();
  return sortContacts(visibleContacts().filter(c => {
    if (ui.statusFilter === 'Projects' && !hasProjects(c)) return false;
    if (ui.statusFilter === 'Campaigns' && !isCampaignLead(c)) return false;
    if (ui.statusFilter !== 'All' && ui.statusFilter !== 'Projects' && ui.statusFilter !== 'Campaigns' && c.status !== ui.statusFilter) return false;
    if (ui.categoryFilter === 'none' && c.category) return false;
    if (ui.categoryFilter && ui.categoryFilter !== 'all' && ui.categoryFilter !== 'none' && c.category !== ui.categoryFilter) return false;
    if (ui.regionFilter === 'none' && c.region) return false;
    if (ui.regionFilter && ui.regionFilter !== 'all' && ui.regionFilter !== 'none' && c.region !== ui.regionFilter) return false;
    if (!q) return true;
    // Cheap, allocation-light containment check
    return (c.name && c.name.toLowerCase().includes(q))
        || (c.email && c.email.toLowerCase().includes(q))
        || (c.company && c.company.toLowerCase().includes(q))
        || (c.phone && c.phone.toLowerCase().includes(q))
        || (c.pointOfContact && c.pointOfContact.toLowerCase().includes(q))
        || (c.campaignName && c.campaignName.toLowerCase().includes(q))
        || contactProjects(c).some(p => p.name && p.name.toLowerCase().includes(q))
        || (c.subcontacts || []).some(person => [person.name, person.role, person.email, person.phone].some(value => String(value || '').toLowerCase().includes(q)));
  }));
}

function relativeDayLabel(iso) {
  const key = localDateKey(iso);
  if (!key) return '';
  const today = localDateKey(new Date());
  if (key === today) return 'today';
  const days = dateKeyDiff(key, today);
  if (days === 1) return 'yesterday';
  if (days > 1 && days < 7) return `${days} days ago`;
  const d = new Date(`${key}T00:00:00`);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: String(key).slice(0, 4) === String(today).slice(0, 4) ? undefined : 'numeric' });
}
function contactRowsHtml(filtered) {
  if (filtered.length === 0) {

    const owner = currentOwnerId(c);

    html += `<div class="lead-row" data-action="open-contact" data-id="${esc(c.id)}" data-testid="contact-row-${esc(c.id)}">
      <input type="checkbox" class="contact-select-checkbox" data-id="${esc(c.id)}" data-testid="contact-select-${esc(c.id)}" ${ui.selectedContactIds.has(c.id) ? 'checked' : ''}/>
      <span class="avatar" style="${userColor(owner) ? `background:${esc(userColor(owner))}` : (owner ? '' : 'background:var(--crm-sand);color:var(--crm-ash)')}" title="${esc(ownerName || 'Unassigned')}">${esc(ownerName ? initialsOf(ownerName) : '—')}</span>
      <div class="lead-main">
        <div class="lead-title"><strong>${esc(c.name || '—')}</strong><span class="chip chip-${statusSlug(status)}">${esc(status)}</span>${projectChipHtml(c)}${isCampaignLead(c) ? `<span class="chip chip-campaign" title="${esc(c.campaignName || 'Advertisement campaign')}">Campaign</span>` : ''}${categoryName ? `<span class="chip chip-teammate">${esc(categoryName)}</span>` : ''}${regionChipHtml(c)}</div>
        ${sub ? `<div class="lead-sub">${esc(sub)}</div>` : ''}
        <div class="lead-next ${due?.tone || ''}">${c.nextStep ? `${svgIcon('clock')} ${esc(c.nextStep)}${due ? ` · ${esc(due.label)}` : ''}` : (due ? `${svgIcon('clock')} ${esc(due.label)}` : '<span class="text-ash">No next step</span>')}</div>
      </div>
      <div class="lead-meta">
        <div title="${esc(c.createdAt ? fmtDateTime(c.createdAt) : '')}">Added ${esc(relativeDayLabel(c.createdAt) || '—')}</div>
        ${stats ? `<div>${esc(stats)}</div>` : ''}
      </div>
      ${rowQuickHtml(c)}
    </div>`;
  }
  if (filtered.length > VIS_CAP) {
    html += `<div class="px-5 py-4 text-center text-ash text-xs">Showing first ${VIS_CAP} of ${filtered.length}. Narrow your search to see more. Bulk actions still apply to all ${filtered.length} matching leads.</div>`;
  }
  return html;
}

function tabCountsHtml() {
  const counts = { All:0, Hot:0, Warm:0, Cold:0, Projects:0, Campaigns:0, 'On Hold':0, Inactive:0 };
  for (const c of visibleContacts()) {
    counts.All++;
    if (isProjectLead(c)) counts.Projects++;
    if (isCampaignLead(c)) counts.Campaigns++;
    if (counts[c.status] !== undefined) counts[c.status]++;
  }
  return CONTACT_FILTERS.map(s => `
    <button data-tab-status="${s}" data-testid="tab-status-${statusSlug(s)}"
            class="tab ${ui.statusFilter===s?'active':''}">
      ${s} <span class="ml-1 opacity-60">· ${counts[s]}</span>
    </button>`).join('');
}

function splitRowsHtml(filtered) {
  if (filtered.length === 0) {
    return `<div class="split-empty"><div class="serif text-xl">No leads here</div><div class="text-xs mt-1">Try another filter, the other brand, or add the lead now.</div></div>`;
  }
  const VIS_CAP = 300;
  let html = '';
  for (const c of filtered.slice(0, VIS_CAP)) {
    const due = nextActionDueMeta(localDateKey(c.nextActionDue));
    html += `<div class="split-row ${ui.drawerContactId === c.id ? 'active' : ''}" data-action="open-contact" data-id="${esc(c.id)}" data-testid="contact-row-${esc(c.id)}">
      <input type="checkbox" class="contact-select-checkbox" data-id="${esc(c.id)}" data-testid="contact-select-${esc(c.id)}" ${ui.selectedContactIds.has(c.id) ? 'checked' : ''}/>
      <div class="split-name">${ownerDotHtml(currentOwnerId(c))}<span>${esc(c.name || '—')}</span></div>
      <span class="text-[11px] mono ${due?.tone || 'text-ash'}">${due ? esc(due.label) : ''}</span>
      <div class="split-sub"><span class="chip chip-${statusSlug(c.status || 'Cold')}">${esc(c.status || 'Cold')}</span>${projectChipHtml(c)}${esc(c.nextStep || c.company || c.email || '')}</div>
      ${rowQuickHtml(c)}
    </div>`;
  }
  if (filtered.length > VIS_CAP) html += `<div class="px-4 py-3 text-xs text-ash text-center">Showing first ${VIS_CAP} of ${filtered.length}. Narrow your search to see more.</div>`;
  return html;
}

function renderContacts() {
  const filtered = filterContacts();
  const blankCount = visibleContacts().filter(isBlankContact).length;
  if (isSplitLayout()) {
    // Split view: the list is a column and the lead itself is always open on the right. Keep the
    // open lead if it is still in the list, otherwise fall back to the first one.
    // On a phone the detail pane becomes a full-screen sheet, so nothing is pre-selected there —
    // otherwise the first lead would cover the list the moment the page opens.
    const phone = typeof matchMedia === 'function' && matchMedia('(max-width: 900px)').matches;
    if (phone) { if (ui.drawerContactId && !filtered.some(c => c.id === ui.drawerContactId)) ui.drawerContactId = null; }
    else if (!ui.drawerContactId || !filtered.some(c => c.id === ui.drawerContactId)) ui.drawerContactId = filtered[0]?.id || null;
    return `
    ${blankCount ? `<div class="card p-4 mb-4 flex items-center justify-between gap-4" style="border-color:#f59e0b;">
      <div class="text-sm">Found <strong>${blankCount}</strong> empty draft ${blankCount===1?'contact':'contacts'} with no information entered.</div>
      <button class="btn btn-danger shrink-0" data-action="cleanup-blank-contacts" data-testid="btn-cleanup-blank-contacts">${svgIcon('trash')} Delete empty drafts</button>
    </div>` : ''}
    <div id="contacts-tabs" class="flex items-center justify-between gap-4 mb-4 flex-wrap">${contactsTabsHtml(filtered.length)}</div>
    <div id="bulk-category-bar-wrap" class="mb-4">${bulkCategoryBarHtml()}</div>
    <div class="split-wrap" data-testid="split-view">
      <div class="card split-list">
        <div class="split-head"><span><strong>${filtered.length}</strong> ${filtered.length === 1 ? 'lead' : 'leads'}</span><span>· click to open · hover for quick actions</span></div>
        <div id="contacts-tbody">${splitRowsHtml(filtered)}</div>
      </div>
      <div class="split-detail" id="split-detail"></div>
    </div>`;
  }
  return `
    ${blankCount ? `<div class="card p-4 mb-4 flex items-center justify-between gap-4" style="border-color:#f59e0b;">
      <div class="text-sm">Found <strong>${blankCount}</strong> empty draft ${blankCount===1?'contact':'contacts'} with no information entered — likely from the "New contact" double-add glitch (now fixed).</div>
      <button class="btn btn-danger shrink-0" data-action="cleanup-blank-contacts" data-testid="btn-cleanup-blank-contacts">${svgIcon('trash')} Delete empty drafts</button>
    </div>` : ''}
    <div id="contacts-tabs" class="flex items-center justify-between gap-4 mb-4 flex-wrap">${contactsTabsHtml(filtered.length)}</div>
    <div id="bulk-category-bar-wrap" class="mb-4">${bulkCategoryBarHtml()}</div>
    <div class="card lead-list" id="contacts-tbody" data-testid="lead-list">${contactRowsHtml(filtered)}</div>
  `;
}

/* Surgical update: only refresh the visible contact rows + tab counts.
   Called on search input (debounced) so we don't tear down the whole page. */
function updateContactsList() {
  if (ui.page !== 'contacts') return;
  const filtered = filterContacts();
  const tbody = document.getElementById('contacts-tbody');
  if (tbody) tbody.innerHTML = isSplitLayout() ? splitRowsHtml(filtered) : contactRowsHtml(filtered);
  const tabs = document.getElementById('contacts-tabs');
  if (tabs) tabs.innerHTML = contactsTabsHtml(filtered.length);
  const bar = document.getElementById('bulk-category-bar-wrap');
  if (bar) bar.innerHTML = bulkCategoryBarHtml();
  // Rebind only the new elements inside the table & tabs
  document.querySelectorAll('[data-tab-status]').forEach(el => {
    el.addEventListener('click', () => { ui.statusFilter = el.getAttribute('data-tab-status'); ui.selectedContactIds.clear(); updateContactsList(); });
  });
  bindContactsFilterControls();
  syncFiltersButton();
  document.querySelectorAll('#contacts-tbody [data-action="open-contact"]').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); ui.drawerContactId = el.getAttribute('data-id'); renderContactDrawer(); });
  });
  bindContactSelectionCheckboxes();
  bindBulkCategoryBarHandlers();
  bindRowQuickActions();
  const selectAllBtn = document.querySelector('[data-action="select-all-filtered"]');
  if (selectAllBtn) selectAllBtn.addEventListener('click', () => {
    for (const c of filterContacts()) ui.selectedContactIds.add(c.id);
    updateContactsList();
  });
}
function bindContactSelectionCheckboxes() {
  document.querySelectorAll('.contact-select-checkbox').forEach(el => {
    el.addEventListener('click', e => e.stopPropagation()); // don't also open the contact drawer
    el.addEventListener('change', () => {
      const id = el.getAttribute('data-id');
      if (el.checked) ui.selectedContactIds.add(id); else ui.selectedContactIds.delete(id);
      renderBulkCategoryBar();
    });
  });
}
/* The bulk-action bar's own selection count needs to refresh without re-rendering the whole
   table (which would lose scroll position and re-run the filter mid-click). */
function renderBulkCategoryBar() {
  const bar = document.getElementById('bulk-category-bar-wrap');
  if (bar) bar.innerHTML = bulkCategoryBarHtml();
  bindBulkCategoryBarHandlers();
}
function bindBulkCategoryBarHandlers() {
  document.querySelectorAll('[data-action="apply-bulk-category"]').forEach(el => el.addEventListener('click', () => {
    const select = document.getElementById('bulk-category-select');
    const value = select?.value || '';
    if (!value) { toast('Choose a category first.'); return; }
    const categoryId = value === '__clear__' ? '' : value;
    const categoryLabel = value === '__clear__' ? 'no category' : (leadCategoryName(categoryId) || 'that category');
    const ids = new Set(ui.selectedContactIds);
    if (!ids.size) return;
    if (!confirm(`Set ${ids.size} contact${ids.size===1?'':'s'} to "${categoryLabel}"?`)) return;
    for (const c of state.contacts) { if (ids.has(c.id)) c.category = categoryId; }
    ui.selectedContactIds.clear();
    saveState(); renderPage();
    toast(`Updated ${ids.size} contact${ids.size===1?'':'s'}.`);
  }));
  document.querySelectorAll('[data-action="apply-bulk-region"]').forEach(el => el.addEventListener('click', () => {
    const value = document.getElementById('bulk-region-select')?.value || '';
    if (!value) { toast('Choose a region first.'); return; }
    const region = value === '__clear__' ? '' : value;
    const ids = new Set(ui.selectedContactIds);
    if (!ids.size) return;
    if (!confirm(`Set ${ids.size} contact${ids.size===1?'':'s'} to "${region ? CONTACT_REGIONS[region] : 'no region'}"? The "where exactly" note is kept.`)) return;
    for (const c of state.contacts) { if (ids.has(c.id)) c.region = region; }
    ui.selectedContactIds.clear();
    saveState(); renderPage();
    toast(`Updated ${ids.size} contact${ids.size===1?'':'s'}.`);
  }));
  document.querySelectorAll('[data-action="clear-contact-selection"]').forEach(el => el.addEventListener('click', () => {
    ui.selectedContactIds.clear();
    updateContactsList();
  }));
}

  const tabBtn = (id, label) => `

  const body = ui.salesTab === 'payouts' ? renderPayouts() : (ui.salesTab === 'conversion' ? renderSalesConversion() : renderSales());

    : (ui.salesTab === 'conversion' ? ''
    : `<button data-action="export-sales-xlsx" data-testid="btn-export-sales-xlsx" class="btn btn-ghost ml-auto">${svgIcon('sheet')} Export estimates & sales .xlsx</button>`);

function renderSales() {
  const sales = allSales().filter(sale => !ui.salesPersonId || ui.salesPersonId === 'all' || sale.ownerId === ui.salesPersonId).sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const sets = estimateSets(sales).filter(set => estimateSetStatus(set));
  const totals = sales.reduce((acc,s)=>{
    if (saleIsSold(s)) { acc.sold += Number(s.amount||0); acc.collected += salePaidAmount(s); acc.outstanding += saleOutstanding(s); }
    return acc;
  }, { count:sets.length, gross:sets.reduce((sum, set) => sum + estimateSetValue(set), 0), sold:0, collected:0, outstanding:0, pending:openEstimateValue(sales), declined:sets.filter(set => estimateSetStatus(set) === 'declined').length, optionSets:sets.filter(set => set.length > 1).length });

  const rows = sales.length === 0
    ? `<tr><td colspan="8" class="px-5 py-10 text-center text-ash text-sm">No estimates yet. Open a contact and add one.</td></tr>`
    : sales.map(s => `
      <tr class="row-hover cursor-pointer" data-action="open-contact" data-id="${s.contactId}" data-testid="sale-row-${s.id}">
        <td class="px-5 py-3 font-semibold">${esc(s.contactName)}</td>
        <td class="px-5 py-3 text-sm">${esc(s.description || '—')}${optionIndexLabel(getContact(s.contactId), s) ? `<div class="text-xs text-ash">${esc(optionIndexLabel(getContact(s.contactId), s))}</div>` : ''}</td>
        <td class="px-5 py-3 mono">${fmtMoney(s.amount)}</td>
        <td class="px-5 py-3 mono text-xs">${saleIsSold(s) ? `${salePaidPercent(s)}% · ${fmtMoney(salePaidAmount(s))}${saleOutstanding(s) ? `<div class="text-ash">${fmtMoney(saleOutstanding(s))} outstanding</div>` : ''}` : '—'}</td>
        <td class="px-5 py-3"><span class="chip chip-${saleStatusChipClass(s)}">${esc(saleStatusLabel(s))}</span></td>
        <td class="px-5 py-3 text-sm">${fmtUtcDate(s.date)}</td>
        <td class="px-5 py-3 text-sm">${saleOutcomeDate(s) ? fmtUtcDate(saleOutcomeDate(s)) : '—'}</td>
        <td class="px-5 py-3 text-sm text-ash">${esc(s.declineReason || '—')}</td>
      </tr>`).join('');

  return `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
      <div class="card p-5"><div class="text-[11px] mono uppercase tracking-[0.2em] text-ash">Estimates</div><div class="serif text-4xl mt-2">${totals.count}</div>${totals.optionSets ? `<div class="text-xs text-ash mt-1">${totals.optionSets} set${totals.optionSets === 1 ? '' : 's'} of options, each counted once</div>` : ''}</div>
      <div class="card p-5"><div class="text-[11px] mono uppercase tracking-[0.2em] text-ash">Estimated value</div><div class="serif text-4xl mt-2">${fmtMoney(totals.gross)}</div>${totals.optionSets ? `<div class="text-xs text-ash mt-1">options counted at the lowest open one</div>` : ''}</div>
      <div class="card p-5"><div class="text-[11px] mono uppercase tracking-[0.2em] text-ash">Sold value</div><div class="serif text-4xl mt-2 text-moss">${fmtMoney(totals.sold)}</div><div class="text-xs text-ash mt-1">${fmtMoney(totals.collected)} collected · ${fmtMoney(totals.outstanding)} outstanding · ${totals.declined} declined</div></div>
      <div class="card p-5"><div class="text-[11px] mono uppercase tracking-[0.2em] text-ash">Pending</div><div class="serif text-4xl mt-2 text-ember">${fmtMoney(totals.pending)}</div></div>
    </div>

    <div class="card overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-sand/60 text-left text-[11px] uppercase tracking-[0.18em] text-ash">
          <tr>
            <th class="px-5 py-3 font-semibold">Contact</th>
            <th class="px-5 py-3 font-semibold">Description</th>
            <th class="px-5 py-3 font-semibold">Amount</th>
            <th class="px-5 py-3 font-semibold">Paid</th>
            <th class="px-5 py-3 font-semibold">Status</th>
            <th class="px-5 py-3 font-semibold">Logged on</th>
            <th class="px-5 py-3 font-semibold">Outcome date</th>
            <th class="px-5 py-3 font-semibold">Decline reason</th>
          </tr>
        </thead>
        <tbody class="divide-row">${rows}</tbody>
      </table>
    </div>
  `;
}

function payoutBreakdownHtml(p) {
  const row = (k, v, hint) => `
    <div class="flex items-center justify-between text-sm">
      <div>${k}${hint?`<span class="text-ash text-xs ml-1">${hint}</span>`:''}</div>
      <div class="mono">${v}</div>
    </div>`;
  const comps = p.components || planComponents(p.plan);
  return `
    ${comps.fixed ? row('Fixed pay', fmtMoney(p.base), '(monthly)') : ''}
    ${comps.perMeeting ? row('Meetings', fmtMoney(p.meetingsPay), `(${p.meetingsCount} booked × ${fmtMoney(p.meetingRate)})`) : ''}
    ${comps.weeklyBonus ? row('Weekly bonus', fmtMoney(p.bonus), `(${p.qualifyingWeeks} × ${fmtMoney(p.weeklyBonus)} · ≥${p.plan.weeklyThreshold} bookings/wk)`) : ''}
    ${comps.commission ? row('Commission', fmtMoney(p.commission), `(${(p.commissionRate*100).toFixed(1)}% × ${fmtMoney(p.salesTotal)})`) : ''}
    ${(p.extrasBreakdown || []).map(x => row(`Bonus — ${esc(x.label)}`, fmtMoney(x.amount), x.trigger === 'period' ? '(per period)' : `(${x.count} × ${fmtMoney(x.unit)})`)).join('')}
    ${(p.overrideBreakdown || []).map(ov => row(`Override — ${esc(userName(ov.fromUserId))}'s sales`, fmtMoney(ov.amount), `(${(ov.rate*100).toFixed(1)}% × ${fmtMoney(ov.salesTotal)})`)).join('')}
    <div class="border-t border-sand pt-2 mt-2 flex items-center justify-between">
      <div class="font-semibold">Total</div>
      <div class="serif text-2xl">${fmtMoney(p.total)}</div>

    <div class="text-xs text-ash">Paid out: ${fmtDate(p.paidOn)}</div>

}

function auditActorKey(entry) {
  return entry.actor_email || entry.actor_id || entry.actor_name || 'unknown';
}

function auditActorName(entry) {
  return entry.actor_name || entry.actor_email || 'Unknown person';
}

function auditInitials(entry) {
  const value = auditActorName(entry).trim();
  const parts = value.split(/\s+/).filter(Boolean);
  return (parts.length > 1 ? `${parts[0][0]}${parts[parts.length-1][0]}` : value.slice(0,2)).toUpperCase();
}

function auditTimeLabel(timestamp) {
  const date = new Date(timestamp || '');
  if (isNaN(date)) return '—';
  return date.toLocaleTimeString('en-US', { ...tzOpts(), hour:'numeric', minute:'2-digit'});
}

function groupAuditEvents(entries) {
  const events = [];
  const index = new Map();
  entries.forEach(entry => {
    const key = `${entry.created_at || ''}|${auditActorKey(entry)}|${entry.target || ''}`;
    let event = index.get(key);
    if (!event) {
      event = { key, created_at:entry.created_at || '', actor:entry, target:entry.target || 'CRM record', entries:[] };
      index.set(key, event);
      events.push(event);
    }
    event.entries.push(entry);
  });
  return events;
}

function googleSheetsSpreadsheetId() {
  const value = String(workspaceOptions().googleSheetsSpreadsheetId || '').trim();
  const match = value.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  return match ? match[1] : value;
}

function appsScriptString(value) {
  return String(value || '').replace(/\\/g, '\\\\').replace(/"/g, '\\"');
}

function preparedGoogleSheetsScript() {
  const template = ui.googleSheetsSetup?.script_template || '';
  const spreadsheetId = googleSheetsSpreadsheetId();
  const sheetName = String(workspaceOptions().googleSheetsSheetName || 'Sheet1').trim() || 'Sheet1';
  if (!template || !spreadsheetId) return '';
  return template
    .replace(/__SPREADSHEET_ID__/g, appsScriptString(spreadsheetId))
    .replace(/__SHEET_NAME__/g, appsScriptString(sheetName));
}

/* ----------------- Tasks ----------------- */
function renderTasks() {
  if (state.tasks.length === 0) return `<div class="text-ash">No automations yet.</div>`;
  return `
    <div class="card p-4 mb-4 bg-paper border-dashed text-sm text-ash">
      Need a new automation? Ping your developer with what it should do — each automation is hand-wired so "Run" actually does something useful for your workflow.
    </div>
    <div class="grid grid-cols-1 gap-4">
      ${state.tasks.map(t => renderTaskCard(t)).join('')}
    </div>
  `;
}

function renderTaskCard(t) {
  let resultHtml = '';
  if (t.kind === 'warm-followup') resultHtml = renderWarmFollowupResult(t);
  if (t.kind === 'contacted-today') resultHtml = renderContactedTodayResult(t);
  if (t.kind === 'project-tracker') resultHtml = renderProjectTrackerResult(t);
  if (t.kind === 'no-response-recommendation') resultHtml = renderNoResponseResult(t);
  if (t.kind === 'contacted-on-date') resultHtml = renderContactedOnDateResult(t);
  return `
    <div class="card p-5">
      <div class="flex items-start justify-between gap-4">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-3 flex-wrap">
            <h3 class="serif text-2xl">${esc(t.name)}</h3>
            <span class="chip ${t.enabled?'chip-paid':'chip-inactive'}">${t.enabled?'Enabled':'Disabled'}</span>
            <span class="kbd">${esc(t.trigger || 'manual')}</span>
            ${t.kind === 'warm-followup' ? `<span class="kbd">≥${t.thresholdDays||7} days no contact</span>` : ''}
            ${t.kind === 'no-response-recommendation' ? `<span class="kbd">≥${t.thresholdAttempts||7} unanswered reach-outs</span>` : ''}
            ${t.kind === 'contacted-on-date' ? `<span class="kbd">pick a date</span>` : ''}
          </div>
          <p class="text-sm text-ash mt-2">${esc(t.description)}</p>
          ${(() => {
            const shown = t.kind === 'contacted-today' ? contactedTodayResultFor(t) : t.lastResult;
            const ran = t.kind === 'contacted-today' ? (shown?.generatedAt || null) : t.lastRun;
            return `<div class="text-xs text-ash mt-2 mono">Last run: ${ran ? fmtDateTime(ran) : 'never'}${shown ? ` · ${(shown.contacts || []).length} contacts` : ''}</div>`;
          })()}
        </div>
        <div class="flex flex-col gap-2 shrink-0">
          <button class="btn btn-ember" data-action="run-task" data-id="${t.id}" data-testid="btn-run-task-${t.id}">${svgIcon('play')} Run</button>
          ${['warm-followup','no-response-recommendation'].includes(t.kind) ? `<button class="btn btn-ghost" data-action="edit-task" data-id="${t.id}" data-testid="btn-edit-task-${t.id}">${svgIcon('pencil')} Edit</button>` : ''}
        </div>
      </div>
      ${resultHtml}
    </div>`;
}

function renderWarmFollowupResult(t) {
  if (!t.lastResult) {
    return `<div class="mt-4 text-sm text-ash italic">Click <span class="kbd">Run</span> to generate the list.</div>`;
  }
  const list = t.lastResult.contacts || [];
  if (list.length === 0) {
    return `<div class="mt-4 text-sm">Nothing to follow up with right now — every active contact was touched within the last ${t.thresholdDays||7} days. ✓</div>`;
  }
  // Summary counts
  const never = list.filter(p => p.daysSince === null);
  const overdue = list.filter(p => p.daysSince !== null);
  const byStatus = { Hot: 0, Warm: 0, Cold: 0 };
  for (const p of list) byStatus[p.status] = (byStatus[p.status] || 0) + 1;

  return `
    <div class="mt-5 border-t border-sand pt-4">
      <div class="flex items-baseline justify-between mb-3 flex-wrap gap-2">
        <div class="text-[11px] mono uppercase tracking-[0.2em] text-ash">
          Follow-up list · ${list.length} contact${list.length===1?'':'s'}
          <span class="ml-3 normal-case tracking-normal">
            <span class="chip chip-hot">Hot · ${byStatus.Hot}</span>
            <span class="chip chip-warm">Warm · ${byStatus.Warm}</span>
            <span class="chip chip-cold">Cold · ${byStatus.Cold}</span>
            ${list.some(p => p.isProject) ? `<span class="chip chip-project">Projects · ${list.filter(p => p.isProject).length}</span>` : ''}
            <span class="kbd ml-2">${never.length} never contacted</span>
            <span class="kbd">${overdue.length} overdue</span>
          </span>
        </div>
        <div class="text-xs text-ash">Generated ${fmtDateTime(t.lastResult.generatedAt)}</div>
      </div>
      <table class="w-full text-sm">
        <thead class="text-left text-[11px] uppercase tracking-[0.18em] text-ash">
          <tr>
            <th class="py-2 font-semibold">Contact</th>
            <th class="py-2 font-semibold">Status</th>
            <th class="py-2 font-semibold">Last touch</th>
            <th class="py-2 font-semibold">Phone</th>
            <th class="py-2 font-semibold">Email</th>
            <th class="py-2 font-semibold">Next step</th>
          </tr>
        </thead>
        <tbody class="divide-row">
          ${list.map(p => `
            <tr class="row-hover cursor-pointer" data-action="open-contact" data-id="${p.id}" data-testid="warm-followup-row-${p.id}">
              <td class="py-2">
                <div class="font-semibold flex items-center gap-2">${ownerDotHtml(p.ownerId)}${esc(p.name)}</div>
                ${p.pointOfContact ? `<div class="text-xs text-ash">${esc(p.pointOfContact)}</div>` : ''}
              </td>
              <td class="py-2"><div class="flex flex-wrap gap-1"><span class="chip chip-${statusSlug(p.status||'cold')}">${esc(p.status)}</span>${p.isProject ? '<span class="chip chip-project">Project</span>' : ''}</div></td>
              <td class="py-2 mono text-xs">
                ${p.daysSince === null ? '<span class="text-ember">never contacted</span>' : (p.daysSince + 'd ago · ' + esc(p.lastChannel || '—'))}
              </td>
              <td class="py-2 mono text-xs">${esc(p.phone || '—')}</td>
              <td class="py-2 mono text-xs">${esc(p.email || '—')}</td>
              <td class="py-2 text-xs">${esc(p.nextStep || '—')}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// "Contacted today" results are kept per person on the task (resultsByUser), never in the shared
// lastResult slot — otherwise whoever ran it last would overwrite what every teammate sees.
function contactedTodayResultKey() { return ui.currentUser?.id || 'local'; }
function contactedTodayResultFor(t) {
  const byUser = (t?.resultsByUser && typeof t.resultsByUser === 'object') ? t.resultsByUser : {};
  return byUser[contactedTodayResultKey()] || null;
}
function renderContactedTodayResult(t) {
  const result = contactedTodayResultFor(t);
  if (!result) {
    return `<div class="mt-4 text-sm text-ash italic">Click <span class="kbd">Run</span> to list everyone you contacted today.</div>`;
  }
  const list = result.contacts || [];
  if (list.length === 0) {
    return `<div class="mt-4 text-sm">No contacts logged today yet. Log a call, email or WhatsApp and run again.</div>`;
  }
  const chLabel = ch => ch === 'email' ? 'Email' : (ch === 'whatsapp' ? 'WhatsApp' : 'Call');
  const chIcon  = ch => ch === 'email' ? svgIcon('mail') : (ch === 'whatsapp' ? svgIcon('chat') : svgIcon('phone'));
  let calls = 0, emails = 0, dms = 0;
  for (const p of list) for (const tch of p.touches) {
    if (tch.channel === 'email') emails++; else if (tch.channel === 'whatsapp') dms++; else calls++;
  }
  return `
    <div class="mt-5 border-t border-sand pt-4">
      <div class="flex items-baseline justify-between mb-3 flex-wrap gap-2">
        <div class="text-[11px] mono uppercase tracking-[0.2em] text-ash">
          Contacted today · ${list.length} contact${list.length===1?'':'s'}
          <span class="ml-3 normal-case tracking-normal">
            <span class="kbd">${calls} call${calls===1?'':'s'}</span>
            <span class="kbd">${emails} email${emails===1?'':'s'}</span>
            <span class="kbd">${dms} WhatsApp</span>
          </span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs ${localDateKey(result.generatedAt) === localDateKey(new Date()) ? 'text-ash' : 'text-ember'}">${localDateKey(result.generatedAt) === localDateKey(new Date()) ? '' : 'From an earlier day · run again for today · '}Generated ${fmtDateTime(result.generatedAt)}</span>
          <button class="btn btn-ghost" data-action="export-contacted-today-xlsx" data-testid="btn-export-contacted-today-xlsx">${svgIcon('sheet')} Export .xlsx</button>
        </div>
      </div>
      <table class="w-full text-sm">
        <thead class="text-left text-[11px] uppercase tracking-[0.18em] text-ash">
          <tr>
            <th class="py-2 font-semibold">Contact</th>
            <th class="py-2 font-semibold">Status</th>
            <th class="py-2 font-semibold">Type of contact</th>
            <th class="py-2 font-semibold">Time</th>
          </tr>
        </thead>
        <tbody class="divide-row">
          ${list.map(p => `
            <tr class="row-hover cursor-pointer" data-action="open-contact" data-id="${p.id}" data-testid="contacted-today-row-${p.id}">
              <td class="py-2">
                <div class="font-semibold flex items-center gap-2">${ownerDotHtml(p.ownerId)}${esc(p.name)}${brandChipHtml(getContact(p.id))}</div>
                ${p.pointOfContact ? `<div class="text-xs text-ash">${esc(p.pointOfContact)}</div>` : ''}
              </td>
              <td class="py-2"><span class="chip chip-${statusSlug(p.status||'cold')}">${esc(p.status)}</span></td>
              <td class="py-2">
                <div class="flex flex-wrap gap-1">
                  ${p.touches.map(tch => `<span class="chip" style="background:#ece7dc;color:#524d40;display:inline-flex;align-items:center;gap:4px">${chIcon(tch.channel)}${chLabel(tch.channel)} · ${esc(communicationTouchLabel(tch))}</span>`).join('')}
                </div>
              </td>
              <td class="py-2 mono text-xs">${p.touches.map(tch => new Date(tch.timestamp).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})).join(', ')}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function projectActivities(c) {
  const activities = [];
  for (const log of (c.calls || [])) {
    if (!log.timestamp) continue;
    activities.push({
      kind: 'communication',
      channel: log.channel || 'call',
      direction: log.direction || 'outgoing',
      outcome: log.outcome || '',
      timestamp: log.timestamp,
      detail: log.notes || '',
    });
  }
  for (const meeting of (c.meetings || [])) {
    const timestamp = meeting.createdAt || meeting.scheduledOn;
    if (!timestamp) continue;
    activities.push({
      kind: 'meeting',
      timestamp,
      detail: meeting.agenda || '',
      completed: !!meeting.completed,
    });
  }
  return activities.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
}

function projectActivityLabel(activity) {
  if (activity.kind === 'meeting') {
    return `Meeting ${activity.completed ? 'completed' : 'scheduled'}${activity.detail ? ` · ${activity.detail}` : ''}`;
  }
  const channel = activity.channel === 'email' ? 'Email' : (activity.channel === 'whatsapp' ? 'WhatsApp' : 'Call');
  return `${channel} · ${communicationTouchLabel(activity)}${activity.detail ? ` · ${activity.detail}` : ''}`;
}

function renderProjectTrackerResult(t) {
  if (!t.lastResult) {
    return `<div class="mt-4 text-sm text-ash italic">Click <span class="kbd">Run</span> to see the latest project activity.</div>`;
  }
  const list = t.lastResult.contacts || [];
  if (list.length === 0) {
    return `<div class="mt-4 text-sm">No Project leads yet. Open a contact and set its type to <span class="kbd">Project lead</span>.</div>`;
  }

/* ---------- Daily report helpers ---------- */
function dateKey(d) { return localDateKey(d); }
/* userId scopes every count to leads that person owned at the time of each touch/meeting/sale
   (via ownerIdAtDate / the ownerId already attached by allMeetings()/allSales()) — pass null
   for the company-wide total. */
function reportMetricsInRange(startIso, endIso, userId = null) {
  const outreachByChannel = { call:new Set(), email:new Set(), whatsapp:new Set() };
  const responseContacts = new Set();
  const inboundContacts = new Set();
  const conversationContacts = new Set();
  const pickedUpContacts = new Set();
  const activeContacts = new Set();
  for (const c of reportContacts()) {
    for (const log of (c.calls || [])) {
      const timestamp = log.timestamp || '';
      if (timestamp < startIso || timestamp > endIso) continue;
      if (userId && ownerIdAtDate(c, timestamp.slice(0,10)) !== userId) continue;
      activeContacts.add(c.id);
      const rawChannel = (log.channel || 'call').toLowerCase();
      const channel = rawChannel === 'email' ? 'email' : (['whatsapp','wa','dm'].includes(rawChannel) ? 'whatsapp' : 'call');
      if (log.direction !== 'incoming') outreachByChannel[channel].add(c.id);
      else inboundContacts.add(c.id);
      if (isResponseTouch(log)) responseContacts.add(c.id);
      if (isValuableConversation(log)) conversationContacts.add(c.id);
      if (channel === 'call' && log.direction !== 'incoming' && log.outcome === 'picked_up') pickedUpContacts.add(c.id);
    }
  }
  const meetings = allMeetings().filter(meeting => {
    const timestamp = meeting.createdAt || meeting.scheduledOn || '';
    if (timestamp < startIso || timestamp > endIso) return false;
    return !userId || meeting.ownerId === userId;
  });
  const estimates = allSales().filter(sale => {
    const date = String(sale.date || '').slice(0,10);
    if (date < startIso.slice(0,10) || date > endIso.slice(0,10)) return false;
    return !userId || sale.ownerId === userId;
  });
  const renders = reportContacts().flatMap(contact => (contact.renders || []).map(render => ({ render, contact }))).filter(({render, contact}) => {
    const date = String(render.date || '').slice(0,10);
    if (date < startIso.slice(0,10) || date > endIso.slice(0,10)) return false;
    return !userId || ownerIdAtDate(contact, date) === userId;
  });
  const sold = allSales().filter(sale => {
    const date = String(saleFirstPaidOn(sale) || '').slice(0,10);
    if (!saleIsSold(sale) || date < startIso.slice(0,10) || date > endIso.slice(0,10)) return false;
    return !userId || sale.ownerId === userId;
  });
  const calls = outreachByChannel.call.size;
  const emails = outreachByChannel.email.size;
  const dms = outreachByChannel.whatsapp.size;
  const touchpoints = calls + emails + dms;
  return {
    touchpoints, calls, emails, dms,
    responses:responseContacts.size,
    inbound:inboundContacts.size,
    conversations:conversationContacts.size,
    pickedUp:pickedUpContacts.size,
    meetings:meetings.length,
    estimates:estimateSetCount(estimates),
    renders:renders.length,
    sold:sold.length,
    soldValue:sold.reduce((sum, sale) => sum + Number(sale.amount || 0), 0),
    activeContacts:activeContacts.size,
    conversion:touchpoints > 0 ? Math.round((responseContacts.size / touchpoints) * 100) : 0,
  };
}
function reportMetricDelta(current, previous) {
  const now = Number(current || 0), before = Number(previous || 0);
  if (!before) return now ? { label:'New', tone:'up' } : { label:'0%', tone:'flat' };
  const value = Math.round(((now - before) / before) * 100);
  return { label:`${value > 0 ? '+' : ''}${value}%`, tone:value > 0 ? 'up' : (value < 0 ? 'down' : 'flat') };
}
function reportComparisonCard(label, value, previous, formatter = value => String(value)) {
  const delta = reportMetricDelta(value, previous);
  return `<div class="card p-3 report-comparison-card">
    <div class="label" style="margin:0">${esc(label)}</div>
    <div class="serif text-3xl mt-1">${esc(formatter(value))}</div>
    <div class="report-delta report-delta-${delta.tone}">${esc(delta.label)} <span>vs previous period</span></div>
  </div>`;
}
function automaticReportSummary(metrics) {
  const inbound = metrics.inbound === undefined || metrics.inbound === null ? '' : ` (${metrics.inbound} reached in by email, call or WhatsApp)`;
  return `${metrics.touchpoints} channel reach-outs were logged across ${metrics.activeContacts} active contacts. ${metrics.responses} unique contacts responded${inbound} and ${metrics.conversations || 0} were marked as valuable conversations. ${metrics.meetings} meetings, ${metrics.estimates} estimates and ${metrics.renders || 0} renders were logged; ${metrics.sold} were sold${metrics.soldValue ? ` for ${fmtMoney(metrics.soldValue)}` : ''}.`;
}
/* ---------- Top lead conversations ----------
   Leads whose communication log holds an incoming ("In") entry inside the period — the lead
   wrote, called or messaged us — ranked by how much that conversation matters: lead
   temperature, whether a teammate marked it a valuable conversation, project leads, money on
   the table, a meeting on the calendar and how many times they reached in. Scoped the same way
   as every other report number: to the leads this person owned on the day of each entry. */
function leadConversationScore(c, incoming, startIso, endIso) {
  const statusNow = statusAtIso(c, endIso);
  const base = { Hot:100, Warm:60, Cold:25, 'On Hold':10, Inactive:5 };
  let score = base[statusNow] ?? 25;
  const reasons = [statusNow];
  const valuable = incoming.some(isValuableConversation);
  if (valuable) { score += 40; reasons.push('valuable conversation'); }
  if (isProjectLead(c)) { score += 30; reasons.push('project lead'); }
  const openSales = (c.sales || []).filter(s => s && saleIsOpen(s));
  const openValue = estimateSets(openSales).reduce((sum, set) => sum + estimateSetValue(set), 0);
  if (openSales.length) { score += 25 + Math.min(25, openValue / 2000); reasons.push(`${fmtMoney(openValue)} in open estimates`); }
  const periodDay = startIso.slice(0,10);
  const meetingBooked = (c.meetings || []).some(m => m && !m.completed && String(m.scheduledOn || '').slice(0,10) >= periodDay);
  if (meetingBooked) { score += 20; reasons.push('meeting on the calendar'); }
  if (String(c.nextStep || '').trim()) { score += 10; reasons.push('next step set'); }
  if (incoming.length > 1) { score += Math.min(20, (incoming.length - 1) * 5); reasons.push(`reached in ${incoming.length}×`); }
  if (isCampaignLead(c)) score += 5;
  return { score, reasons, statusNow, valuable, openValue, meetingBooked };
}
function topLeadConversations(startIso, endIso, userId = null, limit = 6) {
  const ranked = [];
  for (const c of reportContacts()) {
    const incoming = (c.calls || []).filter(log => {
      const t = log?.timestamp || '';
      if (log?.direction !== 'incoming' || !t || t < startIso || t > endIso) return false;
      return !userId || ownerIdAtDate(c, t.slice(0,10)) === userId;
    }).sort((a, b) => String(a.timestamp || '').localeCompare(String(b.timestamp || '')));
    if (!incoming.length) continue;
    ranked.push({ contact:c, incoming, ...leadConversationScore(c, incoming, startIso, endIso) });
  }
  ranked.sort((a, b) => b.score - a.score
    || String(b.incoming[b.incoming.length - 1].timestamp || '').localeCompare(String(a.incoming[a.incoming.length - 1].timestamp || ''))
    || String(a.contact.name || '').localeCompare(String(b.contact.name || '')));
  return { shown: ranked.slice(0, limit), rest: ranked.slice(limit), total: ranked.length };
}
function reportChannelLabel(log) {
  const channel = String(log?.channel || 'call').toLowerCase();
  return channel === 'email' ? 'Email' : (['whatsapp','wa','dm'].includes(channel) ? 'WhatsApp' : 'Call');
}
function reportEntryTime(log, sameDay) {
  const dt = new Date(log?.timestamp || '');
  if (isNaN(dt)) return '';
  return sameDay
    ? dt.toLocaleTimeString('en-US', { ...tzOpts(),  hour:'2-digit', minute:'2-digit' })
    : dt.toLocaleString('en-US', { ...tzOpts(), month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

  const rows = shown.map((item, index) => {

        <div class="min-w-0">

            ${isCampaignLead(c) ? '<span class="chip chip-campaign">Campaign</span>' : ''}

          ${entries.map(log => `

            </div>`).join('')}

        </div>

          <div class="text-[10px] mono uppercase tracking-[0.14em] text-ash">Why it matters</div>
          <div class="text-[11px] leading-snug">${esc(item.reasons.join(' · '))}</div>
          ${String(c.nextStep || '').trim()

            : '<div class="text-[11px] text-ember mt-1">No next step set yet</div>'}

  }).join('');
  const restNames = rest.slice(0, 12).map(item => item.contact.name || '—');
  return `
    <section class="mb-6" data-testid="report-lead-conversations">
      ${heading}

    </section>`;
}
function getDailyReport(dKey) {
  return readReport('daily', dKey) || {
    callsTarget: '', calls: '', emails: '', dms: '',
    responses: '', realConversations: '', meetingsBooked: '',
    marketIntel: '', blockers: '', opportunities: '',
    tomorrowCallsTarget: '', tomorrowMeetingsTarget: '',
    priorityTargets: ['', '', ''],
    followUpsDone: '', topFollowUps: ['','',''],
    learned: '', blockers: '', nextPriorities: '',
    generatedAt: '', approvedAt: '', autoSummary: '', autoMetrics: null,
  };
}
function autofillDaily(dKey, userId = reportActivityUserId()) {
  // Meetings booked today = meetings with createdAt on this day
  const day = dKey;
  const meetings = allMeetings().filter(m => (m.createdAt || m.scheduledOn || '').slice(0,10) === day && (!userId || m.ownerId === userId));
  // The day runs from local midnight to local midnight; timestamps are stored in UTC.
  const metrics = reportMetricsInRange(dayStart(dKey).toISOString(), dayEnd(dKey).toISOString(), userId);
  const callsToday = metrics.calls, emailsToday = metrics.emails, dmsToday = metrics.dms;
  const responsesToday = metrics.responses, pickedUpToday = metrics.pickedUp;
  const totalTouchToday = metrics.touchpoints;
  // Hot/Warm/Cold counts — this person's own leads (current ownership), not the whole team's
  const brandContacts = reportContacts();
  const myContacts = userId ? brandContacts.filter(c => currentOwnerId(c) === userId) : brandContacts;
  const hot  = myContacts.filter(c => c.status === 'Hot').length;
  const warm = myContacts.filter(c => c.status === 'Warm').length;
  // New leads = contacts whose FIRST contact (first comm log entry or meeting createdAt) falls in last 7 days
  const sevenAgoIso = new Date(Date.now() - 7*86400000).toISOString();
  let newLeads = 0;
  for (const c of myContacts) {
    const f = firstActivityIso(c);
    if (f && f >= sevenAgoIso) newLeads++;
  }
  return { meetings, callsToday, emailsToday, dmsToday, responsesToday, pickedUpToday, conversationsToday:metrics.conversations, totalTouchToday, callsLoggedToday: callsToday, hot, warm, newLeads, metrics };
}

/* ---------- Weekly report ---------- */
function weekRangeLabel(weekStartIso) {
  const start = new Date(weekStartIso + 'T00:00:00');
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const opts = { month:'short', day:'numeric' };
  const y = start.getFullYear();
  return `${start.toLocaleDateString('en-US', opts)} – ${end.toLocaleDateString('en-US', opts)}, ${y}`;
}
function isoWeekNumber(d) {
  const [y, m, dd] = localDateKey(d).split('-').map(Number);
  const date = new Date(Date.UTC(y, m - 1, dd));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

function reportTextSnippet(value, max = 150) {
  const text = String(value || '').replace(/\s+/g, ' ').trim();
  if (!text) return '';
  return text.length > max ? `${text.slice(0, max - 1).trim()}…` : text;
}

function latestReportActivity(c, endIso = '9999-12-31T23:59:59.999Z') {
  let latest = null;
  for (const log of (c.calls || [])) {
    const timestamp = log.timestamp || '';
    if (!timestamp || timestamp > endIso || (latest && timestamp <= latest.timestamp)) continue;
    const channel = (log.channel || 'call').toLowerCase();
    latest = {
      timestamp,
      label: channel === 'whatsapp' ? 'WhatsApp' : (channel === 'email' ? 'Email' : 'Call'),
      note: log.notes || '',
    };
  }
  for (const meeting of (c.meetings || [])) {
    const timestamp = meeting.createdAt || meeting.scheduledOn || '';
    if (!timestamp || timestamp > endIso || (latest && timestamp <= latest.timestamp)) continue;
    latest = { timestamp, label: 'Meeting', note: meeting.agenda || '' };
  }
  return latest;
}

function reportLeadNote(c, endIso) {
  const due = c.nextActionDue ? ` · due ${formatNextActionDue(c.nextActionDue)}` : '';
  if (reportTextSnippet(c.nextStep)) return { label: 'Next step', text: reportTextSnippet(c.nextStep) + due };
  const latest = latestReportActivity(c, endIso);
  if (latest && reportTextSnippet(latest.note)) {
    return { label: `Latest ${latest.label.toLowerCase()}`, text: reportTextSnippet(latest.note) };
  }
  if (reportTextSnippet(c.statusReason)) return { label: 'Status note', text: reportTextSnippet(c.statusReason) };
  if (reportTextSnippet(c.notes)) return { label: 'Contact note', text: reportTextSnippet(c.notes) };
  if (latest) return { label: 'Latest activity', text: `${latest.label} on ${fmtDate(latest.timestamp)}` };
  return { label: 'Important note', text: 'No next step or recent note has been added.' };
}

function getWeeklyReport(weekKey) {
  return readReport('weekly', weekKey) || {
    learned:'', blockers:'', nextPriorities:'',
    generatedAt:'', approvedAt:'', autoSummary:'', autoMetrics:null,
  };
}

function renderWeeklyReport() {
  const today = new Date();
  const weekStartDate = ui.weeklyReportWeek ? dayStart(ui.weeklyReportWeek) : startOfWeek(today);
  const weekEndDate = dayEnd(shiftDateKey(localDateKey(weekStartDate), 6));
  const weekStart = localDateKey(weekStartDate);
  const startIso = weekStartDate.toISOString();
  const endIso = weekEndDate.toISOString();
  const previousStartDate = new Date(weekStartDate); previousStartDate.setDate(previousStartDate.getDate() - 7);
  const previousEndDate = new Date(previousStartDate); previousEndDate.setDate(previousStartDate.getDate() + 6); previousEndDate.setHours(23,59,59,999);
  const userId = reportActivityUserId();
  const weeklyReport = getWeeklyReport(weekStart);
  const currentMetrics = reportMetricsInRange(startIso, endIso, userId);
  const previousMetrics = reportMetricsInRange(previousStartDate.toISOString(), previousEndDate.toISOString(), userId);
  const shownMetrics = weeklyReport.autoMetrics || currentMetrics;
  const weeklySummary = weeklyReport.autoSummary || automaticReportSummary(shownMetrics);

  // Pool = this person's own leads whose first contact was at or before week-end (i.e., they
  // exist in their funnel by then). Ownership is checked as of week-end, matching the status.
  const brandContacts = reportContacts();
  const allContacts = userId ? brandContacts.filter(c => ownerIdAtDate(c, endIso.slice(0,10)) === userId) : brandContacts;
  const pool = [];
  const newThisWeek = [];
  for (const c of allContacts) {
    const firstIso = firstActivityIso(c);
    // If never contacted, fall back to createdAt
    const inFunnelBy = firstIso || c.createdAt || '';
    if (!inFunnelBy || inFunnelBy > endIso) continue; // not yet in funnel by end of week
    pool.push(c);
    if (firstIso && firstIso >= startIso && firstIso <= endIso) {
      newThisWeek.push({ contact: c, firstIso });
    }
  }

  const isVendor = c => (c.tags||[]).includes('vendor-app');
  // Status as-of end of week for each pool member
  const buckets = { Hot:[], Warm:[], Cold:[], 'On Hold':[], Inactive:[], Vendor:[] };
  for (const c of pool) {
    if (isVendor(c)) { buckets.Vendor.push(c); continue; }
    const s = statusAtIso(c, endIso);
    if (buckets[s]) buckets[s].push(c);
    else buckets.Cold.push(c);
  }
  const hot = buckets.Hot, warm = buckets.Warm, cold = buckets.Cold, inactive = buckets.Inactive, onhold = buckets['On Hold'], vendors = buckets.Vendor;
  const total = pool.length;

  // Meetings: BOOKED IN this week (createdAt in week) vs SCHEDULED FOR this week (scheduledOn in week)
  const brandMeetings = allMeetings();
  const allM = userId ? brandMeetings.filter(m => m.ownerId === userId) : brandMeetings;
  const bookedThisWeek = allM.filter(m => {
    const t = m.createdAt || m.scheduledOn || '';
    return t >= startIso && t <= endIso;
  });
  const scheduledThisWeek = allM.filter(m => (m.scheduledOn || '') >= startIso && (m.scheduledOn || '') <= endIso);
  const doneThisWeek = scheduledThisWeek.filter(m => m.completed);
  const upcomingThisWeek = scheduledThisWeek.filter(m => !m.completed && new Date(m.scheduledOn) >= new Date());
  const inProgressThisWeek = scheduledThisWeek.filter(m => !m.completed && new Date(m.scheduledOn) < new Date());

  // Engagement: pool contacts with any activity (meeting or comm) during the week
  const poolIds = new Set(pool.map(c => c.id));
  const engagedIds = new Set();
  for (const m of allM) {
    if (!poolIds.has(m.contactId)) continue;
    const t = m.createdAt || m.scheduledOn || '';
    if (t >= startIso && t <= endIso) engagedIds.add(m.contactId);
  }
  for (const c of pool) {
    for (const k of (c.calls || [])) {
      const t = k.timestamp || '';
      if (t >= startIso && t <= endIso) { engagedIds.add(c.id); break; }
    }
  }
  const engaged = engagedIds.size;
  const notScheduled = Math.max(0, total - engaged);
  const pct = n => total > 0 ? Math.round((n / total) * 100) : 0;

  // Reach-outs are unique per contact + channel during the week.
  const weekCalls = currentMetrics.calls, weekEmails = currentMetrics.emails, weekDms = currentMetrics.dms;

  const leadList = (contacts, limit = 25) => {
    const rank = { Hot:0, Warm:1, Cold:2, 'On Hold':3, Inactive:4 };
    const ordered = contacts.slice().sort((a, b) => {
      const aStatus = statusAtIso(a, endIso), bStatus = statusAtIso(b, endIso);
      const aActivity = activityInRange(a, startIso, endIso).total;
      const bActivity = activityInRange(b, startIso, endIso).total;
      return (rank[aStatus] ?? 9) - (rank[bStatus] ?? 9)
        || Number(Boolean(b.nextStep)) - Number(Boolean(a.nextStep))
        || bActivity - aActivity
        || String(a.name || '').localeCompare(String(b.name || ''));
    });
    const shown = ordered.slice(0, limit);
    return `
      <div class="card overflow-x-auto">
        <div class="px-4 py-2 bg-sand text-[10px] mono uppercase tracking-[0.18em] text-ash grid gap-4" style="grid-template-columns:minmax(150px,1.05fr) minmax(240px,2fr) minmax(105px,.75fr);min-width:560px">
          <div>Lead</div><div>Important note</div><div class="text-right">This week</div>
        </div>
        <div class="divide-row">
          ${shown.map(c => {
            const sNow = statusAtIso(c, endIso);
            const note = reportLeadNote(c, endIso);
            const activity = activityInRange(c, startIso, endIso);
            const latest = latestReportActivity(c, endIso);
            const tagLabel = isVendor(c) ? 'Vendor app' : sNow;
            return `
              <div class="px-4 py-3 grid gap-4 items-start break-inside-avoid row-hover cursor-pointer" style="grid-template-columns:minmax(150px,1.05fr) minmax(240px,2fr) minmax(105px,.75fr);min-width:560px" data-action="open-contact" data-id="${c.id}">
                <div class="min-w-0">
                  <div class="font-semibold text-sm truncate">${esc(c.name || '—')}</div>
                  <div class="text-[11px] text-ash truncate">${esc(c.pointOfContact || c.company || c.role || '—')}</div>
                  <span class="chip chip-${statusSlug(isVendor(c)?'cold':sNow)} mt-1">${esc(tagLabel)}</span>
                  ${isProjectLead(c) ? '<span class="chip chip-project mt-1">Project</span>' : ''}
                  ${isCampaignLead(c) ? '<span class="chip chip-campaign mt-1">Campaign</span>' : ''}
                  ${brandChipHtml(c) ? `<span class="chip chip-brand mt-1">Velum</span>` : ''}
                </div>
                <div>
                  <div class="text-[10px] mono uppercase tracking-[0.16em] text-ash">${esc(note.label)}</div>
                  <div class="text-sm mt-1 leading-snug">${esc(note.text)}</div>
                </div>
                <div class="text-right">
                  <div class="mono text-sm">${activity.total} touch${activity.total === 1 ? '' : 'es'}</div>
                  <div class="text-[11px] text-ash mt-1">${latest ? `Last ${fmtDate(latest.timestamp)}` : 'No activity yet'}</div>
                  ${c.nextActionDue ? `<div class="text-[11px] text-ember mt-1">Due ${formatNextActionDue(c.nextActionDue)}</div>` : ''}
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>
      ${ordered.length > shown.length ? `<div class="text-xs text-ash mt-2">Showing the ${shown.length} highest-priority leads; ${ordered.length - shown.length} more remain in this category.</div>` : ''}`;
  };

  const bar = (n, color) => {
    const w = total > 0 ? (n / total) * 100 : 0;
    return `<div class="h-3 rounded-full" style="width:${Math.max(w,2).toFixed(1)}%;background:${color}"></div>`;
  };

  return `
    <div class="card p-5 mb-5 no-print flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="label" style="margin:0">Week of</div>
        <input type="date" id="weekly-date" class="input" value="${esc(weekStart)}" style="width:auto"/>
        <button class="btn btn-ghost" data-weekly-action="this-week">This week</button>
        <button class="btn btn-ghost" data-weekly-action="generate">${svgIcon('sparkles')} ${weeklyReport.generatedAt ? 'Refresh from CRM' : 'Generate report'}</button>
      </div>
      <div class="flex items-center gap-2">
        ${renderPdfTextSizeControl()}
        <button class="btn ${weeklyReport.approvedAt ? 'btn-ghost' : 'btn-primary'}" data-weekly-action="approve">${weeklyReport.approvedAt ? 'Approved ✓' : 'Approve report'}</button>
        <button class="btn btn-ember" data-weekly-action="print" data-testid="btn-print-weekly">${svgIcon('print')} Export PDF</button>
      </div>
    </div>

    <div id="printable-area" class="card p-8 print-page">
      <header class="border-b border-sand pb-5 mb-6">
        <div class="flex items-start justify-between">
          <div>
            <div class="mono text-[10px] tracking-[0.3em] text-ember">LUMEXA · WEEKLY BRIEF</div>
            <h2 class="serif text-4xl mt-2">Weekly contact &amp; lead summary.</h2>
            <p class="text-sm text-ash mt-2 max-w-2xl">${total} contacts in the funnel as of end of week — status reflects where each one stood on ${weekEndDate.toLocaleDateString('en-US', { ...tzOpts(),  month:'short', day:'numeric', year:'numeric' })}.</p>
          </div>
          <div class="text-right">
            <div class="mono text-[10px] tracking-[0.3em] text-ash uppercase">Week №</div>
            <div class="serif text-3xl">${isoWeekNumber(weekStartDate)}</div>
            <div class="text-xs text-ash mt-1">${weekRangeLabel(weekStart)}</div>
          </div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mt-6">
          <div class="card p-3"><div class="text-[10px] mono uppercase tracking-[0.2em] text-ash">Funnel</div><div class="serif text-3xl mt-1">${total}</div><div class="text-xs text-ash">contacts by ${weekEndDate.toLocaleDateString('en-US', { ...tzOpts(),  month:'short', day:'numeric' })}</div></div>
          <div class="card p-3"><div class="text-[10px] mono uppercase tracking-[0.2em] text-ash">New this week</div><div class="serif text-3xl mt-1">${newThisWeek.length}</div><div class="text-xs text-ash">first contact in week</div></div>
          <div class="card p-3"><div class="text-[10px] mono uppercase tracking-[0.2em] text-ash">Hot</div><div class="serif text-3xl mt-1">${hot.length}</div><div class="text-xs text-ash">${pct(hot.length)}% of funnel</div></div>
          <div class="card p-3"><div class="text-[10px] mono uppercase tracking-[0.2em] text-ash">Warm</div><div class="serif text-3xl mt-1">${warm.length}</div><div class="text-xs text-ash">${pct(warm.length)}% — nurture</div></div>
          <div class="card p-3"><div class="text-[10px] mono uppercase tracking-[0.2em] text-ash">Vendor apps</div><div class="serif text-3xl mt-1">${vendors.length}</div><div class="text-xs text-ash">commercial track</div></div>
          <div class="card p-3"><div class="text-[10px] mono uppercase tracking-[0.2em] text-ash">Meetings (week)</div><div class="serif text-3xl mt-1">${bookedThisWeek.length}</div><div class="text-xs text-ash">${doneThisWeek.length} done · ${upcomingThisWeek.length} upcoming</div></div>
        </div>
        <div class="report-comparison-grid mt-3">
          ${reportComparisonCard('Reach-outs', shownMetrics.touchpoints, previousMetrics.touchpoints)}
          ${reportComparisonCard('Responses', shownMetrics.responses, previousMetrics.responses)}

        </div>
      </header>

      <section class="report-auto-summary mb-8">

        <p>${esc(weeklySummary)}</p>

      ${renderLeadConversationsSection({

          <div class="space-y-2">

/* ---------- Monthly report ---------- */
function getMonthlyReport(mKey) {
  return readReport('monthly', mKey) || {
    executiveSummary: '',
    biggestWins: '',
    monthlyChallenges: '',
    nextMonthFocus: '',
    learned: '',
    blockers: '',
    nextPriorities: '',
    generatedAt: '',
    approvedAt: '',
    autoSummary: '',
    autoMetrics: null,
  };
}

function monthlyRange(mKey) {
  const [year, month] = String(mKey).split('-').map(Number);
  const start = dayStart(`${mKey}-01`);
  const end = dayEnd(`${mKey}-${String(daysInMonthKey(mKey)).padStart(2, '0')}`);
  return { start, end, startIso:start.toISOString(), endIso:end.toISOString() };
}

function renderMonthlyReport() {
  const mKey = ui.monthlyReportMonth || localDateKey(new Date()).slice(0,7);
  const report = getMonthlyReport(mKey);
  const { start, end, startIso, endIso } = monthlyRange(mKey);
  const previousMonth = shiftDateKey(`${mKey}-01`, -1).slice(0, 7);
  const previousRange = monthlyRange(previousMonth);
  const userId = reportActivityUserId();
  const currentMetrics = reportMetricsInRange(startIso, endIso, userId);
  const previousMetrics = reportMetricsInRange(previousRange.startIso, previousRange.endIso, userId);
  const shownMetrics = report.autoMetrics || currentMetrics;
  const monthlySummary = report.autoSummary || automaticReportSummary(shownMetrics);
  const dailyEntries = reportEntries('daily')
    .filter(([date]) => date.startsWith(mKey))
    .sort((a,b) => a[0].localeCompare(b[0]));
  const sumDaily = key => dailyEntries.reduce((sum, [,r]) => sum + Number(r?.[key] || 0), 0);
  const reportedCalls = sumDaily('calls');
  const reportedEmails = sumDaily('emails');
  const reportedDms = sumDaily('dms');
  const reportedOutput = reportedCalls + reportedEmails + reportedDms;
  const responses = sumDaily('responses');
  const conversations = sumDaily('realConversations');
  const reportedMeetings = sumDaily('meetingsBooked');
  const conversion = responses > 0 ? Math.round((conversations / responses) * 100) : 0;

  let crmCalls = 0, crmEmails = 0, crmDms = 0;
  const activeContacts = [];
  const brandContacts = reportContacts();
  for (const c of brandContacts) {
    if (userId && ownerIdAtDate(c, endIso.slice(0,10)) !== userId) continue;
    const activity = activityInRange(c, startIso, endIso);
    crmCalls += activity.calls; crmEmails += activity.emails; crmDms += activity.dms;
    if (activity.total > 0) activeContacts.push({ contact:c, activity });
  }
  const crmTouchpoints = crmCalls + crmEmails + crmDms;
  const brandMeetings = allMeetings();
  const meetings = userId ? brandMeetings.filter(m => m.ownerId === userId) : brandMeetings;
  const bookedMeetings = meetings.filter(m => {
    const timestamp = m.createdAt || m.scheduledOn || '';
    return timestamp >= startIso && timestamp <= endIso;
  });
  const completedMeetings = meetings.filter(m => m.completed && (m.scheduledOn || '') >= startIso && (m.scheduledOn || '') <= endIso);
  const monthlySales = allSales().filter(s => String(s.paidOn || s.date || '').slice(0,7) === mKey && (!userId || s.ownerId === userId));
  const paidRevenue = round2(salePaymentRows(allSales().filter(s => (!userId || s.ownerId === userId)))
    .filter(r => String(r.paymentDate || '').slice(0,7) === mKey).reduce((sum, r) => sum + Number(r.paymentAmount || 0), 0));

  const pool = brandContacts.filter(c => {
    if (userId && ownerIdAtDate(c, endIso.slice(0,10)) !== userId) return false;
    const entered = firstActivityIso(c) || c.createdAt || '';
    return entered && entered <= endIso;
  });
  const statusCounts = { Hot:0, Warm:0, Cold:0, 'On Hold':0, Inactive:0 };
  for (const c of pool) {
    const status = statusAtIso(c, endIso);
    if (statusCounts[status] !== undefined) statusCounts[status]++;
  }
  const movements = { Hot:0, Warm:0, Cold:0, 'On Hold':0, Inactive:0 };
  for (const c of brandContacts) for (const change of (c.statusHistory || [])) {
    const timestamp = change.changedAt || '';
    if (timestamp < startIso || timestamp > endIso || movements[change.status] === undefined) continue;
    if (userId && ownerIdAtDate(c, timestamp.slice(0,10)) !== userId) continue;
    movements[change.status]++;
  }

  const weeklyRows = [];
  let cursor = startOfWeek(start);
  while (cursor <= end) {
    const weekEnd = dayEnd(shiftDateKey(localDateKey(cursor), 6));
    const segmentStart = cursor < start ? start : cursor;
    const segmentEnd = weekEnd > end ? end : weekEnd;
    const segmentStartIso = segmentStart.toISOString();
    const segmentEndIso = segmentEnd.toISOString();
    const segmentMetrics = reportMetricsInRange(segmentStartIso, segmentEndIso, userId);
    const calls = segmentMetrics.calls, emails = segmentMetrics.emails, dms = segmentMetrics.dms;
    const meetingCount = meetings.filter(m => {
      const timestamp = m.createdAt || m.scheduledOn || '';
      return timestamp >= segmentStartIso && timestamp <= segmentEndIso;
    }).length;
    const newLeads = brandContacts.filter(c => {

function communicationDayKey(timestamp) {
  const date = timestamp ? new Date(timestamp) : new Date();
  if (isNaN(date)) return 'Unknown date';
  const pad = value => String(value).padStart(2,'0');
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}

function communicationDayLabel(dayKey) {
  if (dayKey === 'Unknown date') return dayKey;
  const today = communicationDayKey(new Date().toISOString());
  const yesterdayDate = new Date(); yesterdayDate.setDate(yesterdayDate.getDate() - 1);
  const yesterday = communicationDayKey(yesterdayDate.toISOString());
  if (dayKey === today) return 'Today';
  if (dayKey === yesterday) return 'Yesterday';
  return fmtDate(`${dayKey}T12:00:00`);
}

function communicationEntryLabel(call) {
  const channel = (call.channel || 'call').toLowerCase();
  const channelLabel = channel === 'email' ? 'Email' : (channel === 'whatsapp' ? 'WhatsApp' : 'Call');
  const direction = call.direction === 'incoming' ? 'received' : 'sent';
  return `${channelLabel} ${direction}${call.notes ? ` · ${call.notes}` : ''}`;
}

function renderCommunicationEntry(call) {
  const ch = (call.channel || 'call').toLowerCase();
  const chLabel = ch === 'email' ? 'EMAIL' : (ch === 'whatsapp' ? 'WHATSAPP' : 'CALL');
  const chIcon = ch === 'email' ? svgIcon('mail') : (ch === 'whatsapp' ? svgIcon('chat') : svgIcon('phone'));
  const isIn = call.direction === 'incoming';
  const editing = ui.editingCommId === call.id;
  if (editing) {
    const dt = call.timestamp ? new Date(call.timestamp) : new Date();
    const pad = n => String(n).padStart(2,'0');

function renderCommunicationHistory(calls) {
  if (!calls.length) return `<div class="text-sm text-ash py-4">No communications logged yet.</div>`;
  const groups = [];
  calls.forEach(call => {
    const key = communicationDayKey(call.timestamp);
    let group = groups.find(item => item.key === key);
    if (!group) { group = { key, calls:[] }; groups.push(group); }
    group.calls.push(call);
  });
  const visibleGroups = ui.communicationHistoryExpanded ? groups : groups.slice(0,3);
  return `
    <div>
      ${visibleGroups.map((group, index) => {
        const channels = [...new Set(group.calls.map(call => (call.channel || 'call').toLowerCase()))];
        const channelIcons = channels.map(channel => channel === 'email' ? svgIcon('mail') : (channel === 'whatsapp' ? svgIcon('chat') : svgIcon('phone'))).join('');
        const preview = communicationEntryLabel(group.calls[0]);
        return `
          <details class="communication-bundle" ${index===0?'open':''}>
            <summary>
              <div class="communication-bundle-preview"><strong>${esc(communicationDayLabel(group.key))}</strong><small>${esc(preview)}</small></div>
              <div class="communication-bundle-count"><span class="flex items-center gap-1">${channelIcons}</span><span>${group.calls.length} ${group.calls.length===1?'interaction':'interactions'}</span>${svgIcon('chevron')}</div>
            </summary>
            <div>${group.calls.map(renderCommunicationEntry).join('')}</div>
          </details>`;
      }).join('')}
      ${groups.length > 3 ? `<button class="btn btn-ghost w-full justify-center mt-3" data-action="toggle-communication-history">${ui.communicationHistoryExpanded ? 'Show recent only' : `Show full history (${calls.length} entries)`}</button>` : ''}

}

      <div data-drawer-pane="sales">${isProjectLead(c) ? renderOrdersSection(c, orders) : ''}</div>

  root.querySelectorAll('[data-drawer-pane]').forEach(el => {
